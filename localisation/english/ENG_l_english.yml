 britain.312.t:0 "Tony Benn Resigns Party Leadership at Labour Party Conference"
 britain.312.d:0 "For the second time in the Labour Party’s history, Tony Benn has announced his resignation as party leader, citing the same reason as last time: resigning from politics to spend more time with politics. This resignation is likely to be final, and has thus ignited a firestorm within the party over whom the successor to the venerable socialist leader should be. Although Benn’s own Tribune Group faction is moving to place Benn’s protegé, left-wing activist and long-time MP Jeremy Corbyn, into the leader’s office, the large moderate wing of the party remains a major factor within the party, and is moving to secure the election of moderate politician Tony Blair in Corbyn’s place. As the internecine factions of Labour compete for power, setting Blair’s moderate platform of technocratic socialism against Corbyn’s Alternate Economic Strategy, Labour members are lining up for debates, with only a token presence from the Trotskyist Militant Tendency. With the moderates pointing to the success of the moderate platform in 1998 and in 2003, it is expected that Blair will ultimately secure a majority. However, Blair is by far the more experienced opponent, prompting worries inside the cabinet that the old politician will herald a restoration of Labour to power, prompting some of Owen’s advisors to urge him to use what levers he has to tip the scales in Corbyn’s favour, ensuring that Labour will continue their spate of perpetual opposition."
 britain.312.o1:0 "Let’s ensure they stick with the loony left"
 britain.312.o2:0 "Interfering is far too dangerous"
 britain.313.t:0 "CPGB Endorses the Labour Party"
 britain.313.d:0 "Labour’s election of Jeremy Corbyn as leader seems to have had unintended effects, as the Communist Party of Great Britain has broken out of their self-imposed electoral agnosticism to give their first ever second preference endorsement since the adoption of the single transferable vote system, unsurprisingly to Corbyn’s Labour. Remarking that Corbyn is the first chance the country has had for a left-led government, the party has stated its willingness to give parliamentary support to ensure the formation of a Labour Party government, to form a united front to take Britain back from David Owen and the SDP. The two parties have shared history, most notably collaborating on the drafts of the Alternate Economic Strategy during the seventies, and Jeremy Corbyn is known to sympathize with various socialist parties around the world, prompting much speculation that the two parties are entering a formal alliance to contest future elections together. The Labour Party has refused to comment on such speculation, stating simply that it remains fully committed to delivering a Labour government for the British people, a notable amount of overlap already seems to be happening, with even the Merry Men willing to entertain whispers of such an alliance, if only it returns Labour to power."
 britain.313.o1:0 "Perhaps Corbyn might be more of a threat than we thought"
 britain.314.t:0 "Downing Street Cabinet Office Adopts New Cat"
 britain.314.d:0 "Despite the best efforts of trusty mousers like Peter IV, the rodent problem in Downing Street remains difficult to control for government officials. In recognition of the need for greater efforts, the Cabinet Office has sought to recruit a new Chief Mouser, eventually settling upon Larry, a four year old tabby from Battersea Dogs & Cats Home. Chosen for his good temper and a high chase-drive and hunting instinct, the Cabinet Office hopes that the appointment of Larry to the role will bring the rodent population in Downing Street down to acceptable levels. As officials are hard at work setting up accommodations to ensure that Larry will be able to collaborate smoothly with Peter IV, the new appointment has attracted a surprising amount of attention from the media. Larry is fast becoming a media darling, meeting with journalists in front of Downing Street to both demonstrate the efficacy of his work, as well as conducting public outreach, though critics are noting that the new Chief Mouser is seemingly taking a leisurely approach to his work. This criticism does not seem to be able to shift the opinions of the broad public, as Larry has swiftly secured high approval ratings, as people are weary of dreary news, and are relieved to have something warm and wholesome to draw their attention for a change."
 britain.314.o1:0 "Hopefully, his popularity will rub off on the rest of us"
 britain.315.t:0 "Determining the Flag of the Commonwealth"
 britain.315.d:0 "With the passage of the Commonwealth of Britain Act, we now enter a new debate concerning the country’s future, as the abolition of the monarchy has prompted discussions of whether to replace the Union Jack. While initially thought to be just a footnote concern, the flag debate has become a lively one, as Republic and other republican pressure groups seized the moment and have pushed to adopt the old Chartist flag as the new national flag, citing its break with the feudal structure the monarchy represented. In light of this press offensive, more traditionally inclined organisations and political parties, including the Conservative Party and the SDP, have pushed back and urged the government to maintain the Union Jack as the flag, stating that no matter the political order it has become a national symbol for the British people, and its replacement would alienate them from their own country. It seems, however, that some are not content with either option, and as the debate over national and political symbols continues, a number of liberal groups have proposed that an entirely new symbol be drawn up to represent the new Commonwealth. Incorporating graphical elements from both flags, its proponents argue that it is a suitable middle ground that can please both, with the hopes of ensuring that the Commonwealth isn’t consumed by constant debates over symbols. With the matter attaining the national prominence that it has had, it is almost certain to go to a vote, as Parliament goes through the legislative efforts to ensure compatibility between British legislation and the new constitution."
 britain.315.o1:0 "The Union Jack is recognisable, we might as well keep it"
 britain.315.o2:0 "Let’s raise the Chartist standard high"
 britain.315.o3:0 "A modern flag is needed for a modern republic"
 britain.316.t:0 "Report Uncovers Major Shortcomings in Home Office’s Handling of Immigration"
 britain.316.d:0 "With the return of Labour to power, there is much to unwind of prior government carelessness, including the effects of their migration policy. Upon the request of Diane Abbott, an extensive inquiry was carried out into the Home Office and its handling of immigration, resulting in a troubling discovery. Many people, including legal residents and even a handful of citizens, have been unknowingly living precariously on the edge of the law. A broken organizational culture, combined with a lack of care and internalized bias among government officials in the Home Office, has prevented numerous legal residents from securing full residency or citizenship for themselves, or left citizens with unclear documentation putting them at risk of deportation, all as a result of protracted treatment of distrust and disrespect. This investigation has galvanized Labour to move quickly, altering the rules for immigration and ensuring that the nearly 500,000 immigrants and descendants of immigrants from the 60’s onwards are able to stay permanently. Additionally, a reshuffling of the Home Office should hopefully lead to a long overdue culture change, protecting all those who call the country their home. While it will take time to fully come into effect, as all good things do, it is the least that our party can do to make sure everyone, no matter their origin, is treated fairly."
 britain.316.o1:0 "We right our wrongs, one step at a time"
 britain.317.t:0 "Elections Organized for the National Planning Board"
 britain.317.d:0 "One of our longest-standing goals, since the days of former Prime Minister Harold Wilson, has been a National Planning Board to direct the public and private sectors, in line with our ideas of democratic economic planning. Finally, this Board has been established at long last, giving the British people a say in the direction of the economy, rather than leaving it at the whims of private interests. Both private and public enterprises will be legally required to follow the directives of the board, which will be developed in conjunction with the workers and organized labour. To elect the board, elections have been held although with low turnout, as many citizens were unsure of the details of what they were voting for. All major parties have put forward slates of economists, with Tories, SDP, Liberals, and Labour all running, although the CPGB has instead opted to endorse Labour’s candidates. The free-market crusaders of the Tories and Liberals have attempted to steer the conversation towards the strengthening of private business and how it could develop the nation to win over voters; meanwhile, the SDP stresses the need for the economy to work better for the common man, the ideals of labour harmony, leaving idealism about industrial revitalization and economic democracy to us. No matter what the outcome, the democratic economy is certain to be legitimized, and shift power into the hands of the people."
 britain.317.o1:0 "The Tories win the day!"
 britain.317.o2:0 "It’s the Liberals' time to shine!"
 britain.317.o3:0 "The SDP for you and me!"
 britain.317.o4:0 "Only Labour can help labour!"
 britain.318.t:0 "[GetYear] Planning Board Elections"
 britain.318.d:0 "It has been four years since the last elections to the National Planning Board, and the time has come once more for the people to decide the direction of the economy. With the economy on a new path from the stagnation of the 2000s and the country going in a better direction, the election is sure to be a lively event. The four major parties are once more running slates, hoping to secure their spot on the board and direct the economy of the nation in their image. Like last time, the Conservatives and Liberals both argue for a more laissez-faire direction, with a central role in the plan for private business. The SDP center labour relations in their programme, advocating for peace, stability, and amicability. Finally, Labour and the CPGB fight to strengthen British industry, hoping to continue the programme of economic expansion towards the lofty goal of full employment. Voter turnout is projected to be modestly higher now that voters have had time to grow familiar with the Board and what exactly they are voting on, party mobilization is still expected to be what carries the day. No matter what the winner, the continued efforts of involving the British people in the economic management has been a success, both for democracy, and for the ever-improving economic development statistics."
 britain.318.o1:0 "The Tories win the day!"
 britain.318.o2:0 "It’s the Liberals' time to shine!"
 britain.318.o3:0 "The SDP for you and me!"
 britain.318.o4:0 "Only Labour can help labour!"
 britain.319.t:0 "Parliament Overturns Defence of the Realm Act of 1997"
 britain.319.d:0 "In a long-awaited and yet groundbreaking move, and in a stunning blow to the legacy of the late David Owen, the Houses of Parliament have voted to overturn the Defence of the Realm Act of 1997. The act, ostensibly intended to prevent a communist takeover of Britain, established an extensive surveillance system against parties and groups deemed radical by the government, restricting the rights and security of the British public for no other purpose than satiating the paranoid whims of David Owen. This move, at long last, has restored civil liberties that long only existed on paper, allowing the British people to once more breathe and live freely, without fears of ending up in an MI5 database. We have been experiencing great opposition from the Social Democrats and the Tories, in addition to the right-wing press, who accuse the government of undermining the security apparatus that protects Britain against a hypothetical, imagined Communist takeover. Regardless of these complaints, our broad coalition of the Labour Party, the Liberals, and even the CPGB has freed the British people from the legacy of an Orwellian existence."
 britain.319.o1:0 "The police state ends with us"
 britain.320.t:0 "Press Companies Hold Firesales to Satisfy New Media Reforms"
 britain.320.d:0 "A significant portion of the media is controlled by private interest groups, vehemently opposed to any left wing agenda. To bring a decisive end to the issue, reforms to restrict ownership have been passed by Parliament to force the press industry to diversify, when market forces were readily unable to do so themselves. This will prohibit single entities from holding ownership stakes in more than 20% of all media entities in the country, forcing many of the private interest groups to rapidly sell their stakes in order to comply with new legislation. The response of the National Union of Journalists and human rights organisations have been decidedly mixed, as concerns have arisen that this move was vindictive rather than corrective, while our opponents are calling it a direct assault on the freedom of the press, insinuating that smaller newspapers will die out from a lack of access to capital. Such allegations are all but taken from the front pages of the right wing press, which has already published bizarre and vulgar insinuations about Prime Minister [ROOT.GetLeader] and made comparisons to the worst of communist Europe. This only galvanized the government, ensuring that the press reform was pushed through come hell or high water. In an unintended side effect, as the absence of large buyers has led to many local community groups, individuals, and even trade unions and political parties buying portions of the media ecosystem, certainly leading to an interesting media landscape. For what it is worth, the Murdoch Empire can no longer come for us, nor sway the minds of the British working class with blatant lies and deception."
 britain.320.o1:0 "Media empires have no place here"
 britain.321.t:0 "Leading Corporations Strike Planning Agreements with the NEB"
 britain.321.d:0 "With the restoration of the National Enterprise Board, we had hoped that a new era of governmental-corporate relations would follow, and it seems we were right! Using a perfect storm of political pressure, the persistent economic desperation of British society, and targeted minority stake takeovers of private business, the Board ultimately reached a new series of agreements with the country's leading businesses. This agreement, with both public and private businesses, breaks what seemed to be a curse that haunted the previous iteration of the NEB, cementing the decades old dream of economic planning. A large portion of Britain's economy is now subject to the plans of the NEB, which allows Labour and the government to steer and coordinate the economy out of the decades of capital waste and stagnation. Additionally, the NEB’s expertise with groundbreaking scientific development has given us a pathway to the revitalization of the nation's research and development sector, setting our nation to be the leading technological innovation exporter. With hard work, the nation will once again have an economy roaring, under the responsible leadership of the Labour Party, one that stands ready to reach back out into the world."
 britain.321.o1:0 "Prosperity can only be restored through planning"
 britain.322.t:0 "Unison and GMB Restore Affiliation Agreement with the Labour Party"
 britain.322.d:0 "Many of the white-collar and professional unions defected from our party many years ago, joining forces with the SDP out of a misplaced belief that the party could represent their interests better than us. However, our return to power has been followed by tough, but ultimately successful negotiations between our party and the prodigal unions. Thanks to the hard work of party colleagues in the Trade Union and Labour Party Liaison Organization and comrades in the Trades Union Congress, we have finally signed a series of crucial reaffiliation agreements. These encompass major unions such as Unison and the GMB, alongside a myriad minor unions, together representing millions of British workers now back to being united with the party of labour. This move has become a cause for celebration in the whole party, the union’s return being a confirmation of the party’s basic identity as the political wing of the trade union movement, giving new strength to the governing party. Expectedly, the SDP is furious that we have essentially ‘stolen’ their union affiliates from out from under them, regardless of the fact that they did it to us first. But as they say, all is fair in love and war, and we simply played the game better than they did. In the end, Labour becomes the true party of labour once more, cementing the political alliance for decades to come."
 britain.322.o1:0 "Welcome home, old friends"
 britain.323.t:0 "Mandatory Identity Cards Rolled Out"
 britain.323.d:0 "In our efforts to provide much more efficient public services and administration, as well as expand capacities for surveillance, [Root.GetLeader] has worked with party officials to create the National Identity Register. British citizens have been urged to head to their local government office to be issued a free, mandatory photo ID card, which they will henceforth need to use in their meetings with public services. While the initiative has already seen mass sign-ups from our urban regions, the rural regions have fallen behind, as many lack the time or interest to put in the effort. Additionally, while many from the SDP have approved the Register, civil liberties groups have voiced their concerns about government overreach and increased surveillance of our citizens, but how could they argue against the convenience this card will provide? We have already received appreciative remarks from civil service groups and unions, including the Public and Commercial Services Union, as the changes make work with the citizens of Britain much more efficient. Additionally, while not public, MI5 has thanked us as they also benefit greatly from this, as tracking known radicals has become much easier thanks to the new register."
 britain.323.o1:0 "This is what we need for efficiency!"
 britain.324.t:0 "Businesses and White Collar Unions Embrace Formation of National Bargaining Commission"
 britain.324.d:0 "Originally proposed back in the eighties, the Industrial Partnership Agency would be the next step in formalizing a social corporatist model of economics, but due to opposition from civil society, it was never able to pass its first parliamentary hearings. Now, despite the longstanding reluctance from the Trades Union Congress and many British businesses, it seems the project has finally found a way to become a reality. The government, recently revitalized following the assassination of David Owen, has at long last made this dream a reality, as the Industrial Partnership Agency has officially been established. The agency will make strike actions practically obsolete by ensuring that workplace disputes can be settled by an official bargaining institution in an efficient timeframe. Furthermore, the agency will host wage negotiations between businesses and unions both in times of strike and outside them. Many business owners and responsible trade unionists have applauded the agency's creation as a step towards renewed economic activity. Meanwhile, members of the left, such as Labour’s blue collar trade union allies have denounced the new agency, saying it is merely a tool to tame the working class and empower large corporations to never again fear their workers. No matter what, this agency will mark the start of a more sensible, responsible era when it comes to the politics of the worker, and it is our hope that it remains for a long time."
 britain.324.o1:0 "Another step towards economic harmony"
 britain.325.t:0 "New Industrial Strategy to Redevelop 'Grey Belt' Land"
 britain.325.d:0 "Throughout Britain, many urban areas have become part of the ‘Grey Belt’, a series of faltering industrial areas filled to the brim with long-abandoned factories and businesses, with overgrowths and structural collapse being commonplace. This visible reminder of our economic woes will be our new target, as [ROOT.GetLeader] has developed a new, extensive plan to bring these areas back into use. This plan will erase planning laws concerning the Grey Belt, allowing for fast-tracked demolition or refurbishment of buildings throughout these areas, as well as the extension of generous tax credits to any businesses that choose to do so. Alongside this is a renewed investment in our nation's infrastructure, with the aim of restoring railways, roads, and power lines across grey belt areas and helping revitalize the remaining businesses there, as well as laying the foundation for new businesses to move in. The initiative has already seen success, as numerous entrepreneurs have taken up the offer and begun investing in rejuvenating the grey belt. Although it seems the larger corporations remain wary for now, this just shows the new character of the British economy, one where everyday citizens can become investors and make a difference in bringing our economy into the future."
 britain.325.o1:0 "The Grey Belt will be roaring once more"
 britain.326.t:0 "Conservative Party Votes to Merge with the SDP"
 britain.326.d:0 "While we were sure not to get our hopes up too high, it seems our feelers to the Conservative Party have been a resounding success! After an upset in internal party elections, the party has now fallen under the sway of the so-called ‘Red Tories’, who have after many years of debate pushed through a motion at the party’s congress to officially merge with the SDP. The continued identity crisis of the party had become an increasingly pressing matter for their members, as the long time the party has been out of power has exacerbated the many splits between ‘Wet’ conservatism and One Nation ideals, which successive party leaders proved incapable of putting to rest. This, combined with an increasing number of policies shared with [ROOT.GetLeader]’s government, the Conservatives concluded the best solution to their problems was a merger with our own party. Now, our two parties have become one, forming the Democratic Party of Great Britain, a united front against radicalism and anti-democratic organizations. Our new juggernaut of a party will work tirelessly for the people of Britain, and with our unified party bases, it is sure that our domination of the political scene will continue for many years to come."
 britain.326.o1:0 "Together, we will safeguard Britain"
 britain.327.t:0 "Planning Authority Divested to Council Governments"
 britain.327.d:0 "For too long, the bureaucratic red tape imposed by Westminster has caused stagnation across communities by unduly constricting their abilities to develop. Whether these were direct constraints or through well-intended measures that allow bad-faith actors to bring projects to a screeching halt, the time is now to cut this tape and change the foundationals of planning. To this end, the government has pushed through reforms that, in essence, divest the authority for planning to local council governments, freeing it from the centrally imposed restraints that the other parties have pushed. This will allow local communities to develop without having to consult dozens of planning codes and lawbooks, and strengthen the involvement of citizens in many different ways. While certain regulations will be kept in place and enforced, such as workplace safety regulations and environmental protections, many others will be repealed, ensuring that the process may from start to finish be locally managed. This effort, along with others from our economic program, will let local British communities grow and thrive like never before, rejuvenating both the cities and the countryside."
 britain.327.d:0 "A new plan for planning, eh?"
 britain.328.t:0 "Commitment to Economic Responsibility Enshrined in Law"
 britain.328.d:0 "As part of the Liberal Party’s reformist agenda, economics have once again taken the stage as the government has taken a proactive step to prevent another bout of stagflation. As part of the party’s extensive economic agenda, the government has enshrined a duty for economic responsibility into law, which commits all future governments to keeping public spending at a manageable level, while providing greater supervision over the budget. This reform establishes a nonpartisan ‘Office of Budget Responsibility’, a new technocratic institution that has the right to review the budgets and prevent government excess, while providing corrective recommendations should a budget be found fiscally irresponsible. While economically minded circles have applauded the establishment of the OBR, the new law still retains its detractors, especially those wary of the neo-Keynesian economists who make up the OBR’s staff, but with help from the SDP, the bill has been passed. Together, we work to ensure that responsible, sensible spending and stable governance reign over Britain once more!"
 britain.328.o1:0 "Responsibility, smart investments, and level heads make Britain strong"
 britain.329.t:0 "Liberal Party Adds Duty to Democracy to Party Charter"
 britain.329.d:0 "It was in Britain where the ideals of democracy and international duty were entwined fully, as Lord Palmerston enshrined the country’s responsibility to fighting slavery, tyranny, and oppression around the world. The isolationist stance the nation took during David Owen’s tenure has left the torch of liberty much dimmer, as Europe fell to communism, radicalism tore apart the United States, and Owen was content to sit by and watch. The Liberal Party understands this, and at a party congress, the party adopted a ‘duty to uphold democracy’ into the party charter. This will commit all present and current governments to the principles of liberal internationalism and the responsibility to fight against dictatorship from the left and the right. This move has been celebrated by many members of our party, the Conservatives, SDP, and even a number of Labour’s more moderate MPs. While there remains some pushback, especially from the far-right and left, claiming that this will simply take Britain into unneeded conflicts and risk us being attacked by belligerent powers, we understand that the [ROOT.GetName] has a historic mission to uphold. Together, we can defeat tyranny in all its forms and work with our allies to maintain liberty, democracy, and freedom!"
 britain.329.o1:0 "Britain never bows to tyrants, not before, not now!"
 britain.330.t:0 "Radio Free Europe Restarts Broadcasts"
 britain.330.d1:0 "Although it has been off the air for decades, our government has decided the time has come to restore Radio Free Europe, no matter the absence of American sponsorship. All throughout South East England, radio stations have begun broadcasting messages into communist Europe, detailing the atrocities of the communist governments of Europe and abroad and promoting the ideals of liberal democracy. While the Warsaw Pact nations will certainly try their best to block out the broadcasts once more, their citizens will nevertheless do their best to tune in and hear the voice of freedom once more, so change and democratic revival may once more have a chance to flourish across the continent. This move spells a proud victory not just for democracy, but for Britain herself, as it shows that a small nation such as ours is capable of standing up to the Red menace, all on our own, even just in this minor, symbolic way. With the nation taking a clear stand against tyranny once again, we can only hope that this is simply the beginning of the end of communist authoritarianism in Europe and the return of democracy, capitalism, and common sense."
 britain.330.d2:0 "Although it has been off the air for some decades now, it appears the British across the channel have reactivated the insidious propaganda broadcaster, Radio Free Europe. All throughout South East England, radio stations are once more broadcasting capitalist propaganda and misinformation into our countries, all with the aim of turning our citizens against us. Already, the government has made swift efforts to jam the signals, while instructing party organs to downplay or dismiss the claims of the British propaganda press. Unfortunately, the resumption of broadcasts comes at a dangerous time, exacerbating the instability the Second European Spring has wrought upon us, as these broadcasts are already strengthening the counterrevolutionary claims of the bourgeois parties. Considering the wide-ranging broadcasts, it is increasingly clear that collaboration across the fraternal socialist republics is essential to shut down the broadcaster, and diplomatic pressure must be heaped upon the British to make them cease their interference in the internal affairs of other countries, lest this annoyance grows too much for our citizens and for the government."
 britain.330.o1:0 "Britain will always fight for your freedom!"
 britain.330.o2:0 "Someone change the station!"
 britain.331.t:0 "Government Initiates Major Sell-off of State-Owned Enterprises"
 britain.331.d:0 "Although the former David Owen government had undertaken measures to bring certain businesses back into private hands, the continued economic stagnation shows he has not gone far, nor fast, enough. It is fortunate for us, then, that London even in its diminished state still serves as a major financial capital with connections to foreign and domestic investors. To make use of these strengths and to revive the economy, the government has ordered a major sell-off of state-owned businesses and enterprises, ranging from major domestic industry leaders like British Steel and the British Technology Group, to utilities and transportation, including the rail networks. Public services deemed too important to sell off, such as our education and healthcare services, have however been retained under state ownership, despite the encouragement of some Dry Tories. This comes as a great victory for both the Conservative Party and for the ideals of laissez-faire economics, but it has expectedly gained scorn from our political opponents. The Labour Party, the SDP, and the trade union movement have all been left aghast at our programs, believing they will tear apart the social fabric of Britain and sell out the nation to foreign investors, with even the Liberal Party claiming we went too far, too fast. While they can make as many ideological complaints as they wish, we will stand proud of our achievement, being the only party with a real interest in restoring the British economy from its decades-long slump. Together, we can ensure Britain is a nation of sensible economics and smart investments, and build back the workshop of the world."
 britain.331.o1:0 "Private business will save England"
 britain.332.t:0 "Trades Union Congress Acquiesces to Trade Union Act of [GetYear]"
 britain.332.d:0 "After a long, gruelling year of nonstop strikes across the nation affecting just about every industry, and more than a few shouting matches in the Houses of Parliament with deputies from the Labour Party, it seems our hard work and perseverance has paid off. The Trade Union Congress has, at long last, acquiesced to the Trade Union Act, and called off their national strikes. The bill, which heavily limits their rights to strike in a disruptive manner, also prohibits sympathy strikes across sectors of industry, and makes it so that an absolute majority of votes is needed by union members to engage in strike actions. This will hopefully mark an end to union struggles in the nation, at long last securing the Conservative Party a victory against the adversary that has plagued us since the Winter of Discontent, with party members nationwide celebrating this long overdue victory. While those in Labour and the SDP believe this is a frontal assault against workers rights, we understand that it is necessary in order to prevent the radical demands of the trade union movement from constraining the economy."
 britain.332.o1:0 "Union leaders will boss us around no longer"
 britain.333.t:0 "'The Big Society' Takes Shape"
 britain.333.d:0 "At long last, we have passed our largest welfare reform to date. The brainchild of the One Nation Tories, this reform will cut public welfare expenditure by a significant amount, weaning those who are abusing the systems in place off of welfare while maintaining benefits for the people who need them most, such as the elderly and disabled. This will all culminate in our ultimate goal, the creation of community welfare systems to replace the cumbersome state benefits system. This, in effect, creates a ‘Big Society’, instead of ‘big government’, extending increased tax credits for charities and creating newer, simpler laws for founding community organizations. The reform has already seen community care grow throughout Britain, as churches, Muslim communities, and more secular groups have stepped in to fill the space the government has made way for. While many of the prosperous areas in Britain have seen the Big Society flower, there still remains work to be done, as some more left-behind regions have felt the cuts to welfare severely. Even with this, we will still charge full steam ahead, with this welfare reform being a major achievement for the Conservative Party and something for us all to be proud of."
 britain.333.o1:0 "The Big Society is close at hand"
 britain.334.t:0 "[ROOT.GetLeader] Announces Scottish Independence Referendum"
 britain.334.d:0 "In a move that will undoubtedly define the future of the [ROOT.GetNameDef], [ROOT.GetLeader] has overseen parliament voting in favour of a referendum on Scottish independence, to be held in 51 days. Long requested by the Scottish independence movement, [ROOT.GetLeader] has pledged that the government will consider the vote legally binding, hoping that this will definitively let the Scottish people answer how they wish their future to look. With both the government and the opposition pledging themselves to campaign for the preservation of a united [ROOT.GetName], it seems that the major divides will be the national parties versus the Scottish independence movement. Independence activists from across the political spectrum are already organizing, forming the cross-partisan alliance ‘Yes to Scotland’, and organising events and demonstrations to showcase the widespread public support for Scottish independence. Despite their claims, polling companies state that a slim majority for continued affiliated with [ROOT.GetNameDef] exists, and as the country goes on the campaign trail, time will see if that majority holds until voting day."
 britain.334.o1:0 "Time to prove the benefits of the Union"
 britain.335.t:0 "IndyRef Debates over North Sea Oil Emerge"
 britain.335.d:0 "With the independence referendum in full swing, British Petroleum’s north sea oil platforms have become a hot button issue, as discussions are erupting over what is to become of them. Although these platforms are operated by a company operating out of London, over 90% of them are located within what would become Scottish territorial waters under international law, thus giving an independent Scotland extensive control over energy reserves. Naturally, the Scottish independence movement is keen on securing control of the platforms, seeing the oil wealth as foundational for their economic plans upon independence, and are accusing the British government of funnelling most of ‘their’ oil resources out of Scotland and into England. Expectedly, British politicians from across the political spectrum are just as keen on retaining control over the north sea oil, remarking that extraction would have been impossible was it not for British investments, and in light of the population disparity between Scotland and the rest of the [ROOT.GetName], argue the current distribution is fair. Considering the significance of the debate, the government is expected to weigh in with its plans for the North Sea oil, with Scottish voters following the government’s response closely."
 britain.335.o1:0 "We can certainly invest more in Scotland"
 britain.335.o2:0 "The current arrangement benefits Scotland as well"
 britain.335.o3:0 "Assert the [ROOT.GetName]'s right to the oil"
 britain.336.t:0 "Separatist Campaign Accuses Unionists of Unfair Funding Advantage"
 britain.336.d:0 "The Unionist campaign has been met with allegations of unfair play, accused of receiving and spending significantly larger sums than the Scottish independence movement. Although this is in and of itself hardly illegal, as the Unionist campaign has stayed within the lawfully agreed spending limits, it has nevertheless become a talking point by left leaning separatists who claim that an excessive number of the donations for the Unionists have come from England rather than Scotland. Although there are no prohibitions on campaign donations from outside Scotland for the campaign, this has become a cause celebre for the Scottish separatists, who claim that it is clear sign that England is willing to use its ‘overwhelming’ weight inside the [ROOT.GetName] to keep Scotland and Wales down if they need to. Despite promises that no public funding would take place, there are now discussions whether it needs to happen regardless, to provide the referendum with an image of fairness and boost confidence in its outcome, although there are sentiments within the government that we will only need to give to the Unionist campaign to ensure that it can convince the Scottish people to remain. Regardless, this is a clear demonstration of the interest to preserve the union."
 britain.336.o1:0 "A demonstration of the clear interest in preserving the [ROOT.GetName]"
 britain.336.o2:0 "Make sure the Unionist campaign is as well funded as it needs to be"
 britain.336.o3:0 "We must ensure a fair campaign, even if it benefits the separatists"
 britain.337.t:0 "Former SNLA Terrorists Popping up Among Independence Activists"
 britain.337.d:0 "A series of revelations by The Sun have put the Scottish independence movement on the backfoot, as multiple activists involved in campaign organizing have been outed as former members of the Scottish National Liberation Army, a terrorist outfit that carried out a number of bombings on government infrastructure back in the nineties. Although most of the figures involved were caught, tried, and sentenced, and have since been released, it nevertheless remains a bad look for the Yes to Scotland campaign to employ convinced terrorists in their electoral campaign. Already, these revelations have made headlines in newspapers up and down the country, and a number of the former terrorists have already resigned their positions. A select few have, however, gone on the defensive, claiming that they have served their sentences and rejected violent means for change, stating that as free citizens, they have a right to be involved in the democratic process. As arguments fly back and forth, the Yes to Scotland campaign have taken a mixed approach, discharging the most prominent figures while retaining a number of members without or with less violent convictions. Meanwhile, the Unionist campaign is using this for all it’s worth, hoping that [ROOT.GetLeader] will echo their excoriating criticism."
 britain.337.o1:0 "Make sure to grill the independence campaign over this"
 britain.337.o2:0 "They have served out their sentences, let the people judge for themselves"
 britain.338.t:0 "Federal Reforms Bolster Unionist Cause"
 britain.338.d:0 "Good news for the government, as it seems the federal reforms passed under the Labour Party have taken some of the wind out of the sails of the Scottish independence movement. With Holyrood having much greater ability to determine Scottish policy, and perhaps most crucially, the strengthening of Scottish influence in the national government, it appears that there is just less enthusiasm than feared for breaking the final bonds with London. Although the debates are still well ongoing, and advisors urge the government not to consider this the end of the independence debate, polling seems to indicate that the broad population of Scotland, even the most ardent separatists, are generally satisfied with federalism compared to the more limited state of prior devolution, making the Scottish independence movement have to work even harder to secure the majority that they’re seeking. Unionists, even outside the Labour Party, have certainly embraced the popularity of federalism and are shifting their campaigns to make greater use of its popularity, ensuring that the Scottish people won’t forget that a continued federal union will, ultimately, let them get the best of both worlds, while preserving our careful unity on the British isles."
 britain.338.o1:0 "The proper solutions can always be found through collaboration"
 britain.339.t:0 "Conspiracy Theories About MI5 Involvement in Campaign Spreads"
 britain.339.d1:0 "Rumours are circulating throughout Scottish circles that the MI5 are taking an active role in the independence debate, either by tarnishing the independence movement, or by more direct election interference. Originating on forums on the Royal Mail Cybercommunications Service, these rumours have managed to spread beyond online circles despite the best efforts of platform moderators, and now seem to hold quite a bit of the Scottish populace in their thrall. Election workers across the country, preparing for the referendum, have been either accosted by radical nationalists claiming to stand for the democratic process, or otherwise had to deal with concerned voters who want to be confident that their vote will count. Although these conspiracy theories thankfully have not amounted to any violence against the democratic process, there are concerns that should the government not address the public unease, some will eventually arise. Government spokespeople are looking for the line to take when questioned by journalists, and [ROOT.GetLeader] must decide whether it is worth it to indulge crazed theories spread by online discontents, or if the government just needs to trudge on and let the campaign return to discussing serious topics."
 britain.339.d2:0 "Rumours are circulating throughout Scottish circles that the MI5 are taking an active role in the independence debate, either by tarnishing the independence movement, or by more direct election interference. Originating on forums on the British Mail Cybercommunications Service, these rumours have managed to spread beyond online circles despite the best efforts of platform moderators, and now seem to hold quite a bit of the Scottish populace in their thrall. Election workers across the country, preparing for the referendum, have been either accosted by radical nationalists claiming to stand for the democratic process, or otherwise had to deal with concerned voters who want to be confident that their vote will count. Although these conspiracy theories thankfully have not amounted to any acts of violence against the democratic process, there are concerns that should the government not address the public unease, some will eventually arise. Government spokespeople are looking for the line to take when questioned by journalists, and [ROOT.GetLeader] must decide whether it is worth it to indulge crazed theories spread by online discontents, or if the government just needs to trudge on and let the campaign return to discussing serious topics."
 britain.339.o1:0 "No reason to feed absurd intranet theories"
 britain.339.o2:0 "If this is what we're up against, it's a mighty good idea"
 britain.339.o3:0 "We must do our utmost to preserve trust in the process"
 britain.340.t:0 "Cross-national Families Raise Concerns Over Post-Independence Outcome"
 britain.340.d:0 "One of the oldest borders of Europe has once more come into attention, as various groups have brought concerns by families on both sides of the Anglo-Scottish border that should Scotland gain independence, these families would experience much greater difficulty keeping in contact and visiting one another. As such, they have sent an appeal to both the Scottish independence movement and to the government of [ROOT.GetLeader] to pledge themselves to the maintenance of open borders if the Scottish people vote to leave the Union. Despite the bickering of more hardline separatist groups, either fearful of continued English ‘interference’ in an independent Scotland or just bigoted, the majority of the Scottish independence movement have committed themselves to the preservation of an open border, but a number of British politicians seem a lot more skeptical of the notion. Claiming that Scotland might adopt looser border policies than Britain has, a number of Conservative and SDP politicians have stated that border controls between the Anglo-Scottish border might become a necessity, and as such, urge the government to not pledge itself to anything until the independence referendum is settled, one way or another, despite the inconveniences this may cause for the cross-national families."
 britain.340.o1:0 "Naturally we will do our best to maintain an open border with Scotland"
 britain.340.o2:0 "We will have to see what becomes feasible in negotiations"
 britain.341.t:0 "Scottish Parties Attend IndyRef Television Debate"
 britain.341.d:0 "Much advertised in the run-up, the televised debate between the various leaders of the Scottish Parties came with a splash, facing independence leaders like Alex Salmond and Robin Harper against representatives of the national parties, from the staunchly unionist Murdo Fraser to the left wing federalist Colin Fox, to discuss the future course of Scotland. Unsurprisingly, a key point of the discussion proved to be the impending vote on Scotland’s affiliation with the rest of Britain, but the moderators were also keen to discuss other matters, from the economy to foreign policy to local issues, while discussing what independence or continued union would do for each of the subjects. Although the Scottish separatists were technically outnumbered, they managed to hold their ground, and accentuate differences between the unionist parties, who spent as much time disagreeing with one another as they did the Scottish separatists, particularly over questions of economics, where the far distance between their parties saw Labour and the Conservatives break out in fierce debates. Nevertheless, the debate has shifted the needle, and the performance of [ROOT.GetLeader]’s deputy will be sure to affect the government’s campaign going forward."
 britain.341.o1:0 "Emphasize our long history of togetherness"
 britain.341.o2:0 "Emphasize the threat posed by communism"
 britain.341.o3:0 "Emphasize the need for workers' unity"
 britain.341.o4:0 "Emphasize our joint British nationality"
 britain.341.o5:0 "Emphasize our commitment to devolution"
 britain.341.o6:0 "Emphasize the valuable contributions of Scotland to the [ROOT.GetName]"
 britain.342.t:0 "Unionist Rallies Held Across Scottish Cities"
 britain.342.d:0 "As the day of the independence referendum comes ever closer, a number of unionist groups have organized simultaneous rallies across Scottish towns and cities to demonstrate their support for the continued union with Britain. Despite controversy, organisers turned away the participation of groups such as the British National Party, though the Orange Order remained a visible presence at many of these rallies, particularly in Glasgow, where the organization has its Scottish stronghold. With the great attendance at these rallies, the unionist campaign has been invigorated, a good sign going into the final few days of the independence campaign. Although the separatist campaign have attempted to organize counterrallies, these have been of mixed size, from a sizable turnout in Glasgow in opposition to the Orange Order, to more scattered responses elsewhere, owing to the short window of opportunity. Cheered on by unionist political figures, the brunt of the media attention has been on the unionist rallies however, giving the impression of a strong unionist sentiment in Scotland, which may very well be the case."
 britain.342.o1:0 "May we all hold together in these uncertain times"
 britain.343.t:0 "Scotland Goes to Vote"
 britain.343.d:0 "After countless hours of campaigning, of debating, and of careful preparations for the vote that will determine the future of the [ROOT.GetName], election day has finally arrived. Party leaders both local and national have spent the day passing out pamphlets in the hopes of convincing as many wavering voters as possible, while electoral officials do their utmost to keep overeager campaigners the legal distance from polling places. The process is not without its kinks, however, as rumours yet proliferate that the British government will attempt to subvert the process one way or another, most recently expressed in the unsubstantiated claim that predominantly nationalist areas will not be provided with enough pencils for everyone to vote, prompting voters to bring their own to make sure they can get their votes in. With no observers whether foreign or domestic validating those claims, confidence in the electoral process thankfully remains high, and most voters cast their ballots without concern. Reportedly, turnout is unusually high, with long lines outside polling places. As election day progresses, and the press remains prohibited from any coverage that may sway the vote, all [ROOT.GetLeader] has left to do is to wait, and hope that the unionist campaign was a success."
 britain.343.o1:0 "Scotland votes to stay!"
 britain.343.o2:0 "Scotland votes to leave!"
 britain.344.t:0 "Government Pledges to Address IndyRef Complaints"
 britain.344.d:0 "The victory of the unionist campaign has left the [ROOT.GetName] in a more confident place, as Scotland has opted to remain part of the union, bringing a conclusion to the present debate of Scottish independence. As the nationalist parties have accepted the result, the leader of the SNP, Alex Salmond, has stepped down, claiming the time is nigh for new leadership to continue championing the rights and wishes of the Scottish people within the [ROOT.GetName], and to continue the campaign for a free and independent Scotland. All the while, [ROOT.GetLeader] has in a speech to the British public thanked them for their faith in the democratic process, and promised to represent all Scotsmen, both unionist and nationalist. Furthermore, the Prime Minister extended a pledge to address some of the root concerns of the independence movement, like insufficient powers to Holyrood or the extensive levels of deprivation suffered by some regions, with a series of plans to be drafted over the coming months. The position of the government has undoubtedly been strengthened by this victory, and the position of Scotland within Great Britain is secured."
 britain.344.o1:0 "We truly are better together"
 britain.345.t:0 "Government Initiates Cross-Border Negotiations with Scotland"
 britain.345.d:0 "Shocking the whole of Britain, Scotland has opted to vote for its independence. As promised at the start of the referendum, this result is considered binding, and as such, [ROOT.GetLeader] has led a delegation of government officials to meet with their Scottish counterparts to discuss the practicalities of independence, to determine the practical course of the issues debated during the referendum campaign. The result has prompted deep reflection within the realm of Westminster politics, with many politicians and political aides debating where it all went wrong. All the while, celebrations have broken out on the Scottish side of the new border, as nationalist voters fill the streets and the pubs to mark the victory of their protracted political campaign. Despite all that, not everyone in Westminster has accepted the fact that Scotland is being cut loose, and call upon [ROOT.GetLeader] to be assertive about British interests and the rights of those who continue to consider themselves British within the young Scottish state. Nevertheless, for the first time since 1707, two nations now call the island of Great Britain their home again, and must now figure out how to best be neighbors."
 britain.345.o1:0 "We must accept the choice of the Scottish people"
 britain.345.o2:0 "We will continue to assert our interests in Scotland"
 britain.346.t:0 "Surveillance of Peaceful Political Groups Ended"
 britain.346.d:0 "The Defense of the Realm Act of 1997, introduced by David Owen’s government, had good intentions in its conception. Unfortunately, its execution has gone past what any reasonable democracy can permit. Surveillance of peaceful political groups and individuals, such as the Communist Party, becoming commonplace, while the state spends large sums on procuring informants without any real security need. These unreasonable developments have turned the security apparatus’ function away from safeguarding democracy towards harassment and pure government overreach, and to bring this to an end, reform must come. Under a new bill introduced by Prime Minister [ROOT.GetLeader], state surveillance of non-violent groups will end, and provenly violent groups may be surveilled only with a judge’s warrant provided reasonable suspicion. This makes the process of rooting out violent extremists much easier, more lawful, and focuses our resources on real targets. Bringing the act through Parliament was a hard-fought battle, with members of the Conservatives and SDP fighting tooth and nail to preserve the act in its original form, but with help from Labour and our own maneuvering, we managed to pass it. We are not like the Communist dictatorships across the channel; the surveillance state of Britain will end here, forever."
 britain.346.o1:0 "Only those seeking to harm need our attention"
 britain.386.t:0 "Robert Griffiths Steps Down as General Secretary of the CPGB"
 britain.386.d:0 "Robert Griffiths, our faithful General Secretary, and stalwart leader during the revolution, has resigned from his office in a quiet ceremony. Feeling the years of responsibility weigh down on him as he approaches 70 years of age, Griffiths believed now was the right time to bring younger comrades into the Party’s leadership positions, including his own. As such, a new congress of the CPGB has been called to elect the next General Secretary and determine the future of Britain and its revolution. Many had expected the party establishment would rally behind a leading comrade with great experience, but they have instead chosen the comparatively young railworker Edward Dempsey as their champion. Dempsey has been a rising star in the movement, having garnered a reputation for ideological solidarity with our European allies, although it seems that his inexperience has also harmed him, as other leading members of the party have thrown their hats in the ring. Scottish newspaper editor of the Morning Star William Bonnar has secured the support of the neocommunist wing of the party, arguing it is time to ease up on several ‘revolutionary excesses’ now the Union of Britain is secure. Meanwhile, former Green Party member Derek Wall has found support from those opposing the other options, proposing a curious eco-centric marxist model, although his relative obscurity makes him a risky choice, as does his past in a party that ultimately represented the environmentally conscious members of the bourgeoisie."
 britain.386.o1:0 "Dempsey, to continue the revolution!"
 britain.386.o2:0 "Peace is here with Bonnar!"
 britain.386.o3:0 "For the unity of red and green, Wall!"
 britain.387.t:0 "Regionalist Parties Join the Progressive Alliance"
 britain.387.d:0 "While our party seeks to represent the proletariat of Britain, we have always struggled to branch out of select working class strongholds throughout its constituent countries. Now, however, thanks to hard work and long negotiations, the CPGB has managed to broaden its reach. A new progressive alliance with multiple parties, including the SNP, Plaid Cymru in Wales, and even the Green Party of England and Wales, has been established, naturally to be led by the unifying force of the CPGB. Following great perseverance and a little bit of crucial support from the security apparatus and their persuasive talents, these parties have pledged to support the transition of Britain from a capitalist state into socialism, in exchange for guaranteed representation in parliament in the new nation and further rights to their autonomous regions. Meanwhile, many of the old parties of England have begun to fade away, losing support and falling into irrelevance, including the Liberals and the Conservatives of old. They fall with no tears shed, as these groups are no longer necessary in the new Britain, while our new fraternal allies have made the right choice to march together with us towards a brighter tomorrow."
 britain.387.o1:0 "Together, we ensure Britain is truly free"
 britain.388.t:0 "Communist Party Militants Light Saint Paul's Cathedral on Fire"
 britain.388.d:0 "The party continues to push through the revolution against obsolete elements of society, taking a page from Mao’s cultural revolution and its noble campaign against the ‘Four Olds’, that being old ideas, culture, customs, and habits that all represent anti-revolutionary ideals. To continue this push, General Secretary Seumas Milne has inspired the party to fight harder against our old institutions, lighting a raging fire of revolutionary zeal. One of the main targets of this campaign has been the fading Church of England, an institution that has fallen from grace and must be made an example of. Following months of agitation, a group of radical militants, affiliated with the Young Communist League, have taken matters into their own hands and set Saint Paul’s Cathedral in central London ablaze. As the fires raged, and the fire brigade was instructed by the Party to only keep the blaze contained, a large rally was held by the YCL in concert with its affiliate student groups just outside the inferno, acting as a human wall around the burning edifice. While there may be countless reactionaries who are upset over the Cathedral's destruction, they must understand that we no longer need the church in the new Britain, and that time has left them behind."
 britain.388.o1:0 "The flames of the revolution burn bright, comrades!"
 britain.389.t:0 "'Witan for the Cleansing of the English Tongue' Established"
 britain.389.d:0 "English has been warped and twisted by the French dogs to our south, a state that cannot stand if we are to free Britain. In our struggle to reshape English to fit our goals, High Chancellor Braiser has made the ‘Witan for the Cleansing of the English Tongue’, a board that will help us to clean English of French undermining and bring it much more in line with our Germanic sister-tongues found in Northern Europe. This board, made up of statesmen chosen by Brasier, as well as skilled wordsmiths who have shown their trueness and trustworthiness, will be the driving birr in reshaping the English tongue as we know it. Following the settling of the Witan, the teaching world and the news will be made to follow the new ways of English as outlined by the Witan, and those who do not follow will beget the utmost aftermaths. This work will not be done in a few years, and could take hundreds of years to fulfill, but it shall always be one of the utmost goals of the Phoenix Front and its foray to root out the lingering dirt in Britain. With our standing hope that by 2050, all of Britain will speak cleaner English, free of Normanist influence, we work tirelessly to lead our land into a stronger morrow."
 britain.389.o1:0 "For a stronger English tongue!"
 britain.390.t:0 "Houses of Parliament Abolished"
 britain.390.d:0 "Compromise, debate, democracy, all of these ideas have brought about Britain's current ruin and stagnation, dragging our proud nation into the dirt of degeneracy by giving space to corrosive forces like communists and liberals. Now, with a truly nationally minded government in charge, we can begin our work to rectify these problems, as High Chancellor Theresa Brasier has announced the full abolishment of the Houses of Parliament. Instead, the responsibilities of governance will be transferred to a recently established series of all-powerful ministries, all appointed by the High Chancellor. This new government has abolished the sluggish debates of the old institutions, removing the useless oversight from traitorous opposition members and allowing our government to act with swiftness and efficiency. Unfortunately, the complete abolition of the legislative branch would prove to be too unpopular with the British public, so a new National Foregathering will be established instead, in order for venerable and experienced party members to provide the High Chancellor and the ministers with their important perspectives. This new institution will pacify those still fond of democracy in our nation, while allowing the High Chancellor to reward her most loyal and efficient supporters with the prominence they deserve. With our work in motion, we can truly cleanse Britain from the insidious democratic institutions once and for all."
 britain.390.o1:0 "The ideals of old will be washed away!"
 britain.391.t:0 "Witan for the Cleansing of the English Tongue Releases Update to the English Dictionary"
 britain.391.d:0 "In an anwardening to þe new wordbook of þe clænsed Ænglisc Tung, þe Witan for þe Clænsing of þe Ænglisc Tung has laðed a new swinging makeofer of þe staffcraft of þe Ænglisc tung. Onniming þe furðer staffs of þe Scedlandisc sisterlig-tungs, þe staffs Æ, Ø, Å, Þ, and Ð haf findled þeir way into þe Ænglisc tung, most seendlig in þe næme of þe tung itself. Furðermore, forebeets and afterbeets of Frankisc frumscaft hafe been trimmed fullig frum þe tung, to be uted wið more suitable, Germanisc makes. Most harkworðig, ak, has been þe oferclæping of þe weeldcraftig hoose itself, nu onniming þe ekenæme of þe Phønix Fylking, scowglassing þe hoose’s bond to þe clænsing. As þe ric þruhwuns to wend to tireless work of þe Witan, and þe fold does its utmost to keep up wið þe wends we are doing to our tung, þe Witan and þe Hige Þæne abide bonded to seeing þe undertaking to its upscot, bringing þe hwole ric in wið þem."
 britain.391.o1:0 "Footmeal, we're ednewing þe goste of our ric"
 britain.392.t:0 "Government Mandates English Language Proficiency for Public Sector Jobs"
 britain.392.d:0 "Supposedly in response to public sentiments, the government has passed legislation instating requirements for proficiency with the English language across the public sector. Commenting on the new legislation, [ROOT.GetLeader] has remarked that this move will strengthen the citizenry's trust and confidence in their meetings with the government. This law is not expected to affect the forward-facing council offices or government bureaucracy majorly, but the Trades Union Congress has raised concerns that the phrasing of the legislation will also affect menial employees of the state-owned enterprises who otherwise perform well without the required language proficiency, and cause thousands to lose their jobs. Likewise, concerns abound in Scotland and Wales that this will marginalize their languages further, despite carve-outs for the other nations of Great Britain within the new legislation. The government has not paid this criticism much mind, remaining insistent that the law will help tie the country together once more, a position that has received significant support not just from conservative voters, but also the nationalist strata of British society more broadly, who regard this as an important step towards restoring the country's national pride."
 britain.392.o1:0 "The English language belongs to all of us"
 britain.393.t:0 "[ROOT.GetLeader] Summons Extraordinary Conservative Conference"
 britain.393.d:0 "Despite the pressing nature of government, [ROOT.GetLeader] has nevertheless taken the time to focus on the state of the Conservative Party. Although the return to government has put a damper on the party's notorious factionalism, it has evidently not reduced it enough to the Prime Minister's satisfaction, prompting this latest move. Going into the conference, the intentions of [ROOT.GetLeader] have been clear: to controversially assert the One Nation Conservatives' line as that of the entire Conservative Party. Expectedly, the Dries have not been willing to accept this move lying down, and have organized themselves to vigorously oppose One Nation's proposals. Nevertheless, with one faction holding the Prime Ministry, there is a clear imbalance of power between the two major groups, prompting the Dries to attempt to rally the myriad of smaller factions to prevent One Nation from asserting total dominance over the party, promising to preserve political pluralism and the minority factions' right to continue organizing. As Conservatives from across Britain congregate in the Ridgeway Centre of Milton Keynes, all of Britain watches to see if this will finally be the conference that brings the Tories back together."
 britain.393.o1:0 "The Conservative Party is reunified, at long last"
 britain.393.o2:0 "We could not reshape the party in our image this time"
 britain.394.t1:0 "British Mail Opens its First Countryside Banks"
 britain.394.t2:0 "Royal Mail Opens its First Countryside Banks"
 britain.394.d1:0 "In a return to past practices, British Mail has been given permission to operate banking services once more, and the postal service has been swift at implementing their new services. Starting out in neglected, rural communities, British Mail's new banking service has already been warmly received by many, offering better interest rates than their private sector counterparts and more generous lending conditions. This warm reception is not shared by the City of London, where a number of leading banks have criticized the law as gross distortion of the market, accusing the government of undermining credit institutions and ultimately the fiscal stability of the country. These criticisms are being echoed by both intrasigent members of the Conservative Party, as well as the Liberal Party, who have attempted to pressure the government into reversing the law, or putting up guard rails to prevent British Mail from using public leverage to outcompete the private banking system. Despite the opposition [ROOT.GetLeader] has been unwilling to budge, stating that this will in time revitalize the private economy of Britain, and that competition from the public sector will ultimately ensure a better banking service for all."
 britain.394.d2:0 "In a return to past practices, Royal Mail has been given permission to operate banking services once more, and the postal service has been swift at implementing their new services. Starting out in neglected, rural communities, Royal Mail's new banking service has already been warmly received by many, offering better interest rates than their private sector counterparts and more generous lending conditions. This warm reception is not shared by the City of London, where a number of leading banks have criticized the law as gross distortion of the market, accusing the government of undermining credit institutions and ultimately the fiscal stability of the country. These criticisms are being echoed by both intrasigent members of the Conservative Party, as well as the Liberal Party, who have attempted to pressure the government into reversing the law, or putting up guard rails to prevent Royal Mail from using public leverage to outcompete the private banking system. Despite the opposition [ROOT.GetLeader] has been unwilling to budge, stating that this will in time revitalize the private economy of Britain, and that competition from the public sector will ultimately ensure a better banking service for all."
 britain.394.o1:0 "The hearts of our communities will beat strongly again"
 britain.395.t:0 "Mass Sell-off of Council Housing"
 britain.395.d:0 "Long at the heart of Conservative policy, the government has after much patience and pushback made it possible for residents of council housing to purchase their council homes at cheap prices, only covering a fraction of the true market values. As rates of homeownership are swiftly rising, these reforms have split the political Britain down the middle, as the left are deeply concerned that the loss of council housing will only drive up prices, making it more difficult for working people to secure housing in the future, all the while the right are celebrating the mass growth of home owners, claiming that this has opened a pathway to wealth for millions of people. It appears however that the direct beneficiaries of the new right-to-buy scheme are greatly supportive of it, with the criticisms from Westminster not having much purchase, even with those Labour voters making use of the scheme. Despite reports springing up of landlords buying out entire apartments and increasing the rent, it would seem that the right-to-buy has come to stay, and the hopes of [ROOT.GetLeader] is that many of these new homeowners will, in time, become a strong new Conservative constituency."
 britain.395.o1:0 "A strong middle class will preserve our society forevermore"
 britain.396.t:0 "National Council of Culture Officiated by Government Officials"
 britain.396.d:0 "To ensure that the government's efforts towards national unity will endure far beyond the term of the government itself, [ROOT.GetLeader] has established the National Council of Culture, intended to promote British art and culture. With everything from art grants to mandatory school programmes, the Council has been endowed with wide-ranging powers to shape the cultural fabric of the country. Although artists across Britain are enthused about the opportunity for more funds, some, like left wing filmmaker Ken Loach, have commented that this will allow for greater political control over the cultural process, expressing concerns about the government's flirtations with nationalist ideology. Despite that, the National Council is already getting to work drafting up its first educational material in partnership with the Ministry of Education, soon to be implemented in schools across the country, all the while processing a growing number of art grant applications, ensuring that the National Council of Culture may claim a central role in British social life going forward."
 britain.396.o1:0 "With a shared perspective can we be one nation, together"
 scotland.1.t:0 "The Constitutional State of Scotland"
 scotland.1.d:0 "As the initial euphoria of the independence referendum settles, the political parties have met at Holyrood Palace to discuss the first drafts for an independent Scottish constitution. The question that hangs over all other discussions, however, is that of whether Scotland should retain the royal family. Although long supported by almost the entire political spectrum, Queen Elizabeth's attempted coup d'etat against the British government has put a damper on support for the proposal, prompting the SNP to reconsider its historically monarchist stance and instead advocate a republic, supported by the Labour Party. This proposition is fiercely opposed by the two parties that once made up the Scottish Conservatives, both of whom argue that the royal family is central to Scottish identity and history, and that indeed the British royal family originally came from Scotland. With the recently formed Liberal Democratic Alliance splitting either way, time will tell whether the Republicans can seize the momentum, or if Scotland will remain true to its heritage."
 scotland.1.o1:0 "We will become a republic, free of crowned heads"
 scotland.1.o2:0 "We still respect the House of Windsor"
 scotland.2.t:0 "First Independent Scottish Elections"
 scotland.2.d:0 "Scotland is heading to the polls to determine its first post-independence government, with a fractured field competing for the leadership of the young country. Following independence, the Scottish National Party has broken into its left and right wing factions, with the right reorganising under the Christian Democratic, nationalist Independent Alliance for Scotland. Proposing retaining a large extent of welfare, the Independent Alliance has also attracted notability for wanting to enshrine the constitutional role of the Church of Scotland, as well as its socially conservative stances. Likewise, the Tories have split in twain, with Murdo Fraser and Ruth Davidson each leading a fraction of the party competing for power, proposing stronger ties with Britain, and a variety of free market reforms, although there is great disagreement over the role of welfare in the new Scotland. Inversely with all the others, the Social Democrats and Liberal Parties have banded together in the Liberal Democratic Alliance, attempting to secure a strong center-left position, especially popular in the more rural regions of Scotland. Naturally, the enduring SNP are in contention as well, attempting to build an independent, equal, and progressive Scotland. Finally, Scottish Labour, long the most radical section of the British party, is running on an extensive programme of economic socialization, and even the adoption of economic planning, a radical proposition outside Labour's strongholds in the industrial heartlands."
 scotland.2.o1:0 "The Independent Alliance"
 scotland.2.o2:0 "The Scottish Progressives"
 scotland.2.o3:0 "The Liberal Conservatives"
 scotland.2.o4:0 "The Liberal Democratic Alliance"
 scotland.2.o5:0 "The Scottish National Party"
 scotland.2.o6:0 "Scottish Labour"
 scotland.3.t:0 "Scottish National Party Moderates Revolt Against Alex Salmond"
 scotland.3.d:0 "In one of the most severe political conflicts since Scottish independence, Prime Minister Alex Salmond is faced by a revolt from his own party members over the matter of social policy. Accusing the prime minister of taking a far too conservative stance on feminism and sexual minority rights, a number of Scottish National Party progressives have rallied around the young MSP Nicola Sturgeon as a replacement candidate to Salmond. Although Sturgeon has historically been a close supporter of Salmond, she has herself commented that unburdened by the dictats of Westminster, Scotland can and must do better for marginalized communities than it historically has, all but endorsing the leadership struggle. Alex Salmond has however retained strong support among the old guard of the party, recognizing him as the man who led Scotland into independence, and furthermore he continues to command a strong public profile. As fierce politicking erupts among the SNP's parliamentary caucus, the other parties, the press, and the British are watching closely to see if the first leader of independent Scotland can hold on as he always has."
 scotland.3.o1:0 "The Moderates manage to unseat Salmond"
 scotland.3.o2:0 "Alex Salmond Manages to Hold on"
 scotland.4.t:0 "Determining Scotland's International Alignment"
 scotland.4.d:0 "Following our successful acquisition of independence, debate has fallen onto what Scotland's geopolitical position needs to be. Historically, a significant portion of the Scottish independence movement has advocated neutrality, but geopolitical developments have opened the door for a different trajectory that nevertheless allows the fulfillment of the ideal of neutrality. The British Isles Protection Union has, so far, united Britain and Ireland in a geostrategic alliance, and this is an alliance that could, in theory, encompass us as well, and back channels with the British government hint that London might accept our entry into the Protection Union. This decision does not have universal support, as there are those who wish to either pursue true neutrality, or break with it and align with one of the world powers. As such, the government must decide if realignment with Britain is within Scotland's interests, or if diplomatic flexibility is the better option."
 scotland.4.o1:0 "We should seek to join the Protection Union"
 scotland.4.o2:0 "It is better to retain a diversity of options"
 scotland.5.t:0 "Scotland Applies for Membership in the British Isles Protection Union"
 scotland.5.d:0 "A proposal has been received from Edinburgh by the Foreign Office, with [SCO.GetLeader]'s government asking to rejoin the British Isles Protection Union. Commenting on the 'noble purpose' of the Protection Union, and remarking that Scotland remains committed to the security and independence of all nations within the British Isles, the proposal would see Scotland become a full signatory of the Christmas Day Treaty, with all the rights and responsibilities that membership entails. Although the Ministry of Defence relishes the opportunity for multiple reasons, from regaining access to Scottish military facilities to resolving the gaping hole in our security that Scottish independence presented, there are voices in parliament that are outraged that Scotland has the gall to ask for British protection after voting for independence, remarking that they should instead have voted to remain in the Union. Ultimately, the decision is the government's, but it is reassuring that Scotland wishes to remain neighborly despite everything that has happened."
 scotland.5.o1:0 "Though we may now be neighbours, we can still be friends"
 scotland.5.o2:0 "They leave us and yet ask for our protection?! Ridiculous!"
 
 ### National Focuses ###
 ENG_british_factories:0 "British Factories"
 ENG_british_factories_desc:0 "Our industrial sector has taken a significant hit after the collapse of European Democracy and not long after, the United States. It is imperative to alleviate the current dismal situation Britain is in. Our government faces two choices: Either directly invest in British companies and the military, or encourage and support the technological sector."
 ENG_dual_military_industry:0 "Dual Military Industry"
 ENG_dual_military_industry_desc:0 "Britain as a whole needs its economy stimulated. Uniting a Divided Kingdom will be far more beneficial to us in the long run. We will invest in military factories across the nation and provide job security for thousands."
 ENG_half_mast:0 "Half Mast"
 ENG_half_mast_desc:0 "Tragedy struck the United Kingdom not long ago, and now as all Union Jacks fly at half mast, we must ask ourselves grave questions."
 ENG_strengthen_the_foreign_office:0 "Strengthen the Foreign Office"
 ENG_strengthen_the_foreign_office_desc:0 "Weakened during the collapse of Western democracy, the Foreign Office should be restored to its rightful place as an influential department of our government."
 ENG_truly_british_military:0 "A Truly British Military"
 ENG_truly_british_military_desc:0 "Death or Glory. The motto of our army hasn’t changed as it faces those who wish to undermine our great nation. All our soldiers shall be proud that they are British, and defend our Isles!"
 ENG_new_industrial_revolution:0 "New Industrial Revolution"
 ENG_new_industrial_revolution_desc:0 "'Technology, technology, technology'. That is the new motto the British government has adopted in its new comprehensive plan to promote the British technological sector. Long-term investments in crucial companies, network infrastructure, and scientific departments will guide Britain into prosperity and a new era."
 ENG_building_factories:0 "Building Factories"
 ENG_building_factories_desc:0 "Britain still lags behind other nations in construction technology and efficiency. A nation-wide initiative of distributing heavy machinery and technical know-how among construction teams and companies will kickstart a new industrial revolution."
 ENG_industrial_universities:0 "Industrial Universities"
 ENG_industrial_universities_desc:0 "Funds have been allocated to finance new universities across the nation specializing in industrial technologies. By strengthening our research capabilities in this field, we will in return increase the output of our factories."
 ENG_automation_technology:0 "Automation Technology"
 ENG_automation_technology_desc:0 "Promoting and streamlining automated assembly technology will significantly increase the production of British goods. This is the future, and soon manual production will be a thing of the past."
 ENG_promote_computer_development:0 "Promote Computer Development"
 ENG_promote_computer_development_desc:0 "The British computer industry was struck hard and slumped in the 1980s and 1990s. Seeing as computers are integral to the economy of the future, investments have been made in this field. Already, British units are starting to see a boost in sales both domestically and internationally."
 ENG_broad_technology_program:0 "Broad Technology Program"
 ENG_broad_technology_program_desc:0 "Not just computers, but other forms of industrial technology will be highly beneficial to our new industrial revolution."
 ENG_state_investment:0 "State Investment"
 ENG_state_investment_desc:0 "'Build, build, build!' That is the new motto the British government has adopted in its new comprehensive plan to promote British industry. Large investments and construction projects will provide employment and boost our economy. However, only limited funds are available. It is necessary to decide where to invest..."
 ENG_scottish_military_industry:0 "Scottish Military Industry"
 ENG_scottish_military_industry_desc:0 "Scotland’s industry has been hit particularly hard by the economic collapse of the 90s. Many workers were laid off, aggravating Scottish tensions. By prioritizing military industry within Scotland, we can provide jobs and put our military production far away from the continent in case of possible conflict."
 ENG_scottish_dockyards:0 "Scottish Dockyards"
 ENG_scottish_dockyards_desc:0 "Scotland has always been a hub for shipbuilding and an important port for the Royal Navy. Citing a need for protecting our coasts, Scotland is a perfect staging ground for our expansive dockyard project. This will ensure our Navy will once again rule the waves."
 ENG_defending_scotlands_coast:0 "Defending Scotland's Coast"
 ENG_defending_scotlands_coast_desc:0 "By concentrating our military and naval production in Scotland, the region has become a prime target for any potential invasion of our Home Islands, which would cripple any war effort. We will turn Scotland into an unassailable fortress and defend her coast."
 ENG_offshore_oil:0 "Offshore Oil"
 ENG_offshore_oil_desc:0 "While we have been drilling for oil off the coast of Scotland for many years now, surely there is more just waiting to be discovered..."
 ENG_royal_scottish_guards:0 "Royal Scottish Guards"
 ENG_royal_scottish_guards_desc:0 "Our efforts to revitalize Scotland have borne fruit, with Scottish men eagerly pledging loyalty to Britain and to serve at the pleasure of the nation."
 ENG_revive_scotland:0 "Revive Scotland"
 ENG_revive_scotland_desc:0 "With more direct intervention from London, providing stimulus packages and infrastructure revival projects, we will provide further job security and economic stability. Finally, Scotland will be revitalized as the booming economic hub of Britain."
 ENG_national_naval_industry:0 "National Naval Industry"
 ENG_national_naval_industry_desc:0 "The British people pride themselves on an extensive history of naval supremacy. Our current situation is however sorely lacking. Investing in British dockyards will provide much-needed jobs and bolster our ailing navy. Perhaps that glorious history will no longer be confined to the past..."
 ENG_british_infrastructure_initiative:0 "British Infrastructure Initiative"
 ENG_british_infrastructure_initiative_desc:0 "A proposed British Infrastructure Initiative will work to improve infrastructure across the nation, working both with large and small businesses to deliver results."
 ENG_english_military_industry:0 "English Military Industry"
 ENG_english_military_industry_desc:0 "England is and always will be the true financial and industrial heart of Britain. Our first stimulus package will be for military industry within England itself, kickstarting our economy and military capability."
 ENG_english_factories:0 "English Factories"
 ENG_english_factories_desc:0 "English factories are the best of the best, and make the best of the best. That's why we will help fund and invest in English made products, boosting our consumer market."
 ENG_urban_development:0 "Urban Development"
 ENG_urban_development_desc:0 "All over England, once proud cities are decaying, their abandoned factories rotting as the number of potholes grows ever larger, while people's living conditions are worsening. A massive program of urban renewal is needed to restore Mother England to her former glory."
 ENG_rural_development:0 "Rural Development"
 ENG_rural_development_desc:0 "Many rural areas have fallen behind, and are connected by roads and rail older than many of the farmers themselves. We must invest in these areas, so that England’s green and pleasant lands may proudly provide our country with quality foodstuffs once more."
 ENG_revive_england:0 "Revive England"
 ENG_revive_england_desc:0 "Our efforts have worked. Factories are churning out English goods, people have jobs, the economy is soaring. The English people shall rise from the ashes as a revived industrial superpower."
 ENG_let_her_in:0 "Let Her In"
 ENG_let_her_in_desc:0 "Our glorious Queen has dissolved Parliament. She shall rule by decree from now onwards."
 ENG_empower_the_house_of_lords:0 "Empower the House of Lords"
 ENG_empower_the_house_of_lords_desc:0 "The House of Commons is a relic of an unstable and uncertain past. Britain's House of Lords shall have more power and sway within the national government."
 ENG_pass_british_security_act:0 "Pass British Security Act"
 ENG_pass_british_security_act_desc:0 "All citizens of the United Kingdom shall be observed closely. In case of possible unpatriotic activities, We shall vastly expand our CCTV network and give the Government Communications Headquarters wide-ranging powers to ensure security and continuing stability in her Majesty's Realm."
 ENG_threaten_the_social_democrats:0 "Threaten the Social Democrats"
 ENG_threaten_the_social_democrats_desc:0 "Social Democrats are convinced that the Queen aims to end the freedom of the British people. We should threaten them before such a dissident party does something stupid."
 ENG_threaten_the_conservatives:0 "Threaten the Conservatives"
 ENG_threaten_the_conservatives_desc:0 "Sidelined by the Social Democratic Party, and now unable to form government again for a long time, Conservatives are itching for a revolt against Our new order."
 ENG_far_right_alliance:0 "Far Right Alliance"
 ENG_far_right_alliance_desc:0 "Unlike the rebellious establishment parties, the far right are more willing to accept Our glorious order. We shall appeal to their sense of pride and patriotism, and align their leaders to the royalist cause!"
 ENG_puppet_parliament:0 "Puppet Parliament"
 ENG_puppet_parliament_desc:0 "Britain's old Parliament created instability. A new parliament under the Queen's iron fist shall follow with true obedience."
 ENG_new_privy_council:0 "New Privy Council"
 ENG_new_privy_council_desc:0 "This new privy council shall only advise the Queen, not attempt to directly influence her decisions. For the Queen was born to rule with the iron fist she has now been granted... and no one will get in her way."
 ENG_abolish_house_of_commons:0 "Abolish the House of Commons"
 ENG_abolish_house_of_commons_desc:0 "What is the point of absolute royal rule if Parliament is still allowed to operate? The House of Commons is but a centuries old vestige of a time when the Royal House had to make concessions to an uppity citizenry. Those times have passed, and with the people's loyalty to Her Majesty cemented we need not maintain such archaic institutions."
 ENG_ban_leftist_parties:0 "Ban Leftist Parties"
 ENG_ban_leftist_parties_desc:0 "With their incessant demands for 'equality' and 'democracy', the Left have hindered Our efforts significantly, and thus must be cut out of British politics forever. The SDP and Labour have played out their part, and will go into the dustheap of history."
 ENG_purge_republicans:0 "Purge Republicans"
 ENG_purge_republicans_desc:0 "Even worse than simple leftists, Republicans must be executed by the Queen's orders. These dissidents have no place in Britain, only wishing to undermine Her Majesty."
 ENG_war_advisor:0 "War Advisor"
 ENG_war_advisor_desc:0 "Within the Privy Council, a war advisor shall inform the Queen of what military actions could be taken outside of Britain's borders... to protect the people of course."
 ENG_economic_advisor:0 "Economic Advisor"
 ENG_economic_advisor_desc:0 "Within the Privy Council, an economic advisor shall inform the Queen of what economic reforms could be enacted within Britain. We shall call upon a most loyal subject from the private sector, to ensure that Her Majesty's will is aided only by the best and brightest of Her realm."
 ENG_more_welfare:0 "More Welfare"
 ENG_more_welfare_desc:0 "Her Majesty's economic advisor believes it would be best to increase welfare for the British people. She agrees. Thus, more funding shall be allocated to the public services, to always remind the people of Her Majesty's boundless grace and generosity."
 ENG_her_majestys_representative:0 "Her Majesty's Representative"
 ENG_her_majestys_representative_desc:0 "Since Our righteous coup against Parliament, the international community has looked at Britain with disgust. For some reason they view Us as lesser because of Our glorious absolute rule. With a new foreign representative however, this should all change."
 ENG_less_welfare:0 "Less Welfare"
 ENG_less_welfare_desc:0 "Her Majesty's economic advisor believes it would be best to decrease welfare for the British people. She agrees. After all, the many entitlement programmes in Britain are such a drain on the national economy, and would be of better use elsewhere."
 ENG_lock_her_out:0 "Lock Her Out"
 ENG_lock_her_out_desc:0 "Elizabeth was humiliated when she was locked out of Parliament by her supposedly loyal government. The coup has failed, and the British people must seriously ask themselves what kind of government they want."
 ENG_snap_election:0 "Snap Election"
 ENG_snap_election_desc:0 "We need an election to decide the future of this country, and we need it now!"
 ENG_a_peoples_government:0 "A People's Government"
 ENG_a_peoples_government_desc:0 "Jeremy Corbyn's movement took the United Kingdom by storm. But now we should be working towards enacting even more radical reforms than he proposed... which unfortunately means he eventually has to go."
 ENG_align_with_trade_unions:0 "Radicalize the Trades Union Congress"
 ENG_align_with_trade_unions_desc:0 "Organisations such as the Trades Union Congress help, instead of harm British society. Having historically been tied to the Labour Party and the SDP, the time has come for the champions of working people in Britain to wake up from their slumber, take their rightful place, and claim a more paramount role in society."
 ENG_begin_the_revolution:0 "Begin the Revolution"
 ENG_begin_the_revolution_desc:0 "While Jeremy Corbyn may be the most left-wing Prime Minister to date, he is clearly not enough, and the people have begun to look to more radical parties for answers. The CPGB, led by Robert Griffiths, will provide them exactly the answers they’re seeking. The time has come, and finally there shall be a red Britain!"
 ENG_democratic_policies:0 "Democratic Policies"
 ENG_democratic_policies_desc:0 "As the results from the snap election are coming in, we can breathe easy with the knowledge that the United Kingdom truly is a bastion of democracy in a totalitarian Europe."
 ENG_conservative_government:0 "Conservative Government"
 ENG_conservative_government_desc:0 "The Conservative Party has been elected. Previously regarded as 'the natural party of government,' the Conservative Party has despite its internal divisions at last returned to Number 10, ready to pursue an agenda to lead a strong and stable government that can strengthen traditional British values, as well as upholding market-based economy to benefit Middle England and beyond."
 ENG_Dry_Tories:0 "'Dry' Conservatives"
 ENG_Dry_Tories_desc:0 "The champions of free market economics have taken the day, as a government centered around the 'Dry' Tories has been formed. Forming the nucleus of the Conservative Party since the days of Margaret Thatcher's tenure as party leader, the Dries seek to radically transform the British economy in a laissez-faire direction, while safekeeping traditional British institutions in an uncertain 21st century."
 ENG_traditional_british_values:0 "Traditional British Values"
 ENG_traditional_british_values_desc:0 "Britain's traditional values have been chipped away through progressive reforms, breaking down faith in the nuclear family, the church and even loyalty to Her Majesty. This threatens to completely undo the societal cohesion of our fair land, and so we must preserve these pillars of British society, to restore the proper order of the land."
 ENG_lower_taxes:0 "Restore Individual Property"
 ENG_lower_taxes_desc:0 "Ever since Mrs. Thatcher sat as party leader, there has been a strong Monetarist faction of Tories. With a simple slogan like 'The British people deserve more cash in their pockets,' we can fulfill a conservative dream long denied and return onto the Britons what is theirs."
 ENG_liberalize_School_laws:0 "Liberalize School Laws"
 ENG_liberalize_School_laws_desc:0 "Parents have had far too little control over the education of their children, and the government far too much. If we open the doors for more private and charter education, center the education system around the individual wants and needs of British families, we can ensure a more multifaceted education system."
 ENG_increased_police_presence:0 "Cops in Shops"
 ENG_increased_police_presence_desc:0 "Decades of SDP-mismanagement have made crime endemic throughout Britain. The police should be far more visible in the streets of our communities, with a bobby helmet on every street corner, to keep the ruffians and hooligans in check and ensure that all Britons can feel safe in their neighbourhoods."
 ENG_bastion_of_europe:0 "Bastion of Europe Project"
 ENG_bastion_of_europe_desc:0 "Communism remains a potent force just south of the Channel, and as Europe's last bastion of democracy, it is our responsibility to help the Europeans set themselves free from Communist tyranny. By broadcasting the truth across the Channel, in all the languages of the EUSR, we will let the European public know that they're not alone, and that tyranny can be defeated."
 ENG_increase_military_spending:0 "Match Democratic League Defense Spending"
 ENG_increase_military_spending_desc:0 "Despite our once central position in NATO, the military has been allowed to decline for decades, putting us at risk from a Red Invasion, and keeping us from our international obligations to the democratic world. No longer! The Democratic League continues to hold the torch of liberty high, and our reentry into the democratic world will be inevitable if we can only prove our commitment."
 ENG_privatize_state_businesses:0 "Privatize State-Owned Enterprises"
 ENG_privatize_state_businesses_desc:0 "Labour and the SDP have hand in hand held the responsibility for the decline of British industry, with their hare-brained schemes of state ownership locking the economy into stagnation and decline. If we wish to reverse this decline, the time is nigh to harness the awesome power of the free market. The capital we can attract through privatisation will rejuvenate Britain, and bring back prosperity to our shores!"
 ENG_tackle_union_militancy:0 "Tackle Union Militancy"
 ENG_tackle_union_militancy_desc:0 "The British Trade Union movement have more than once been an impediment for economic growth in the country, championing the sectional interests of their workers over the well being of the whole nation, and being quite willing to cause fights over it. Although the right to free association is central for a democracy, these associations should not be hostile towards that democracy. The backs of the militant union movement must be broken, so that Britain may become prosperous."
 ENG_prioritise_social_responsability:0 "Prioritize Social Responsibility"
 ENG_prioritise_social_responsability_desc:0 "For too long, we have entrusted the care of the weakest to a big government, distant from the concerns of the British public and their real needs. It's time to turn that around, and create the big society that accurately responds to these needs. By helping the British people care for one another, we can not just save public funds, but strengthen our collective national cohesion, and ensure we may all thrive in this green and pleasant land."
 ENG_one_nation_tories:0 "One Nation Conservatives"
 ENG_one_nation_tories_desc:0 "The inheritors of Benjamin Disraeli and Rab Butler, the One Nation Tories have managed to reclaim Number 10 for the Conservative Party. Proponents of a paternalistic, patriotic conservatism, the One Nation Conservatives aim to decentralize British capitalism, in order to dramatically expand the middle class, while paving over the supposed divisions in British society, to ensure that Great Britain may remain one nation."
 ENG_promote_nationwide_devolution:0 "Promote Nationwide Devolution"
 ENG_promote_nationwide_devolution_desc:0 "Far too much power has been centralized in London, and far too often has devolution become the rallying cry of divisive separatists. To let every Briton feel like they own a stake in our great nation, we must devolve greater powers to local government bodies, to ensure that neither centralizing impulses nor nationalist troublemakers can interfere with the daily life of the British public."
 ENG_clamp_down_on_parallel_societies:0 "Clamp Down on Parallel Societies"
 ENG_clamp_down_on_parallel_societies_desc:0 "Across our country, there exists large communities uninterested in participating in the greater whole of our society. These parallel societies are not just corrosive to national unity, they also undermine the democratic participation of their members. We must ensure that everyone in Britain feels British first and foremost, and that no community may inculcate its members with values antithetical to those of the whole country."
 ENG_resolve_conservative_identity_crisis:0 "Resolve the Conservative Identity Crisis"
 ENG_resolve_conservative_identity_crisis_desc:0 "More than thirty years out of power has torn our once grand party asunder, leaving it with a scattering of disconnected ideas. Our return to power has not just given us the opportunity to end this period of confusion, but allowed us to cement our vision for the party as its central ideological tenents. Though this may be a risky course, it is worth it to ensure that the Conservative Party can reclaim its former glory."
 ENG_reinstate_national_service:0 "Reinstate National Service"
 ENG_reinstate_national_service_desc:0 "Though derided by liberals and socialists as government compulsion, something must be said for the character-building abilities of National Service. If all British men spend a year of their life in military service, we can do much to tie our divided nation back together, and ensure a strong national defence in the process."
 ENG_reconfigure_the_postal_service:0 "Reconfigure the Postal Service"
 ENG_reconfigure_the_postal_service_desc:0 "Once the heart of every community, the postal service has been turned into nothing more than a courier service. If we are to restore the social fabric of the country, as well as local economies everywhere, it is paramount that postal offices be allowed to operate as banking and credit services once more, allowing communities to nurture their businesses and their private lives, just as they once could."
 ENG_break_down_monopolies:0 "Break Down Monopolies"
 ENG_break_down_monopolies_desc:0 "Monopolism, both private and public, brings the economy under control of distant entities uninterested in the well-being of the average Briton. As such, the only way to bring wealth back to our communities is to shatter these monopoly companies, and divest their wealth into the small and medium businesses that serve as the lifeblood of the nation. Only that way can the rising tide lift all boats."
 ENG_develop_conservative_mutualism:0 "Develop Conservative Mutualism"
 ENG_develop_conservative_mutualism_desc:0 "Everywhere socialism has taken root, it has been because of the existence of a large, dispossessed working class. If we are to preserve our way of life, we must ensure that everyone feels they own a share of the prosperity capitalism generates. By selling off council housing to its residents, by helping small businesses take shape, and by ensuring that share ownership is distributed as widely as possible can we ensure a permanent middle class, capable and interested in resisting the allure of the left."
 ENG_ringfence_social_benefits:0 "Ringfence Social Benefits"
 ENG_ringfence_social_benefits_desc:0 "Though the government must pursue fiscal prudence, it needs not do that in such a manner that the needy shall suffer unduly. When carrying out necessary budget cuts, our government will endeavor to ensure that these will not effect essential services helping so many people make ends meet. The NHS shall remain untouched, and benefits will continue to be handed out to those who deserve them, ensuring tranquility and stability for the public."
 ENG_reknit_british_moral_fabric:0 "Reknit the British Moral Fabric"
 ENG_reknit_british_moral_fabric_desc:0 "Without shared values and commitments, a nation is nothing more than borders on a map. The most important goal of our government is to ensure that the whole of the British nation may believe in our values of democracy and civil liberties, and ensure that the government lives up to those values. We will have failed just as much if people cannot see themselves in the nation that they live in."
 ENG_liberal_democrat_government:0 "Liberal Government"
 ENG_liberal_democrat_government_desc:0 "The Liberal Party has been elected. The second-oldest party of the country, the Liberals seek to chart a more economically and politically liberal course, while devolving vast powers to local governments and the public."
 ENG_strengthen_local_councils:0 "Strengthen Local Councils"
 ENG_strengthen_local_councils_desc:0 "There is little point in local government if all it is there for is to implement the directives of Westminster. Let us set the councils free, and allow them to find the best solutions for their areas. They know so much more about what will need to be done than the distant bureaucrats of London."
 ENG_reform_planning_act:0 "Reform the Planning Act"
 ENG_reform_planning_act_desc:0 "The SDP have put up far too many regulations to new building, constricting economic development and keeping housing prices artificially high. The Planning Act must be drastically streamlined, red tape must be cut up, and developers should be set free to work with their local communities directly, rather than having to fight across a multitude of regulatory boards. Though this may be unpopular, we know that it is right."
 ENG_pass_freedom_act:0 "Pass the Freedom Act"
 ENG_pass_freedom_act_desc:0 "Successive governments have taken extensive steps to bring the security situation in the country under control, but with calm returning to the isles, there is no need for most of these measures. The time is nigh to sundown all of these measures, so that the nation may breathe freely once again."
 ENG_atlantic_cooperation:0 "Revive Liberal Internationalism"
 ENG_atlantic_cooperation_desc:0 "Since the days of Lord Palmerstone, Britain has proudly been on the forefront of global democracy. Though things have certainly declined in our absence, it is nigh time to return to the world stage and stand up for liberty and human rights. May the democracies of the world never again stand alone!"
 ENG_left_and_right_policies:0 "A Fair Deal for All"
 ENG_left_and_right_policies_desc:0 "The economy has diverged too far from the golden mean, and understandably suffered. Only through a Fair Deal can we strenghten both British business and British workers, revitalize the economy, and ensure that Britain can regain the prosperity that once made it the workshop of the world."
 ENG_lower_company_taxes:0 "Close Tax Loopholes"
 ENG_lower_company_taxes_desc:0 "A Fair Deal means freedom to do what you wish, without overbearing interference, but it also means giving onto society what is owed. The British tax code is far too riddled with holes and gaps left over from old reforms, leaving the government with less money than it is owed. By closing these loopholes we can ensure that fairness goes both ways, and ensure more resources for public benefits."
 ENG_unravel_NHS_red_tape:0 "Unravel NHS Red Tape"
 ENG_unravel_NHS_red_tape_desc:0 "The NHS was originally a Liberal idea, proposed by William Beveridge as a key part of the agenda to reconstruct the country after WW2. Unfortunately, successive Labour governments turned the public health system into a lumbering behemoth, incapable of either responding to people's needs or carry out its mission in anything resembling an efficient manner. By unravelling the red tape and involving private actors, we can ensure strong care for the patients for much cheaper prices."
 ENG_financial_stability_council:0 "Establish the Council of Financial Stability"
 ENG_financial_stability_council_desc:0 "Successive governments have fumbled in the blind, economically speaking, following the siren song of ideology rather than sound economic practice. By establishing an official guidance council to help steer economic policy, we will be able to ensure that fiscal prudence will govern the country, no matter which government is elected."
 ENG_empower_the_voters:0 "Empower the Voters"
 ENG_empower_the_voters_desc:0 "Voters deserve more influence over the country, as democracy cannot just be reduced to electing a government every four years. Giving them a direct say over the country, letting them put forward petitions that the government has to respond to, and making referendums binding will do much to make British democracy a living, breathing creature."
 ENG_social_democratic_government:0 "Social Democratic Government"
 ENG_social_democratic_government_desc:0 "The Social Democrats have been elected. Formed by the Gang of Four - of whom David Owen ultimately proved the most notable member - as Labour was taken over by the hard-left Bennite faction, the Social Democrats have since enjoyed considerable political success, whose legacy of welfare reform and steady governance from the centre the party now hopes to continue."
 ENG_national_identity_registrer:0 "Establish the National Identity Register"
 ENG_national_identity_registrer_desc:0 "Still relying on a scattered identity registration system, the public sector is bogged down verifying that citizens are who they are through incredibly disparate means. By consolidating all these measures into a single National Identity Registry, citizens will have much easier access to public services, and we will have less trouble keeping track of them."
 ENG_condemn_trotskyist_labour:0 "Condemn Trotskyist Labour"
 ENG_condemn_trotskyist_labour_desc:0 "Despite the proclamations of the mainstream Labour Party that they are merely 'Democratic Socialists,' it's clear that lie only goes skin-deep. The continued presence of the so-called Trotskyist 'Militant Tendency' within the Labour Party proves that they remain quite willing to entertain extremists within that party, and demonstrates why all democratically minded Britons must reject them."
 ENG_prevent_strategy:0 "Implement the Prevent Strategy"
 ENG_prevent_strategy_desc:0 "Extremism is the greatest danger against democracy, and has continued to rear its head on both left and right as the government has restored order to the country. Though it comes in different shapes than the violence of the nineties, it remains an ever-present danger against British society. By intervening early, when the youth are still malleable, we shall cut off the recruitment avenues of the extremists and raise the next generation as stalwart democrats."
 ENG_right_collective_barganing:0 "Formalize Sectoral Bargaining"
 ENG_right_collective_barganing_desc:0 "The Nordic Countries, before the advent of socialism, had found the most certain way to balance economic justice with economic progress. Through a system of sectional bargaining, we shall bring an end to the need for strikes, and ensure a more amicable economy for all parties involved."
 ENG_owens_legacy:0 "Uphold Owen's Legacy"
 ENG_owens_legacy_desc:0 "Prime Minister David Owen left a lasting mark on the United Kingdom and its people. Serving for decades, he was an inspiration for so many aspiring politicians, and proved an unwavering symbol of democracy in a continent that wound up abandoning it."
 ENG_moderate_welfare_promises:0 "Expand the Economic Development Agencies"
 ENG_moderate_welfare_promises_desc:0 "Intended to revitalize and specialize the British economy, the Economic Development Agencies unfortunately became a regulatory roadblocker, instead of the force for growth they should have been. By redefining their responsibilities and letting them work more closely with private and public entities, they will finally attain the function intended for them."
 ENG_bolster_our_nuclear_arsenal:0 "Bolster our Nuclear Arsenal"
 ENG_bolster_our_nuclear_arsenal_desc:0 "Nuclear disarmament has long been a popular stance among the British public, and a key part of the discussion around our nuclear weapons. This position, while well-meaning, is utterly naive in a world where Britain can only count on herself for protection. We must instead increase funding to Trident, to ensure that Britain remains safe."
 ENG_green_new_deal:0 "Green New Deal"
 ENG_green_new_deal_desc:0 "Though the economy may be in shambles, the Social Democratic Party sees an avenue not just to revitalisation, but also keeping it modern for decades to come. With a Green New Deal, we can create a multitude of jobs and put it on the forefront of the green transition, creating capabilities that will be invaluable both at home and abroad"
 ENG_reach_out_to_corporations:0 "Reach out to the Corporations"
 ENG_reach_out_to_corporations_desc:0 "British business should be an invaluable partner to the British government, and yet we have refrained from fully embracing the benefits of this partnership so far. The collaboration with the EDAs was only the beginning, a full concord with the corporate sector, emphasising both social responsibility and freedom of business, will ensure strong and credible growth for the forseeable future."
 ENG_entrench_party_of_government:0 "Entrench our Natural Party of Government"
 ENG_entrench_party_of_government_desc:0 "Although in power for decades, the Social Democratic Party remains challenged so long as it is only one option of the political establishment, and doesn't cement itself as such. With the Conservative Party facing existential questions about their future, it seems obvious to answer those by proposing the wayward Tories a unification. There is much we can agree on, after all."
 ENG_labour_government:0 "Labour Government"
 ENG_labour_government_desc:0 "The Labour Party, the self-proclaimed representatives of the British working class and the political wing of the labour movement, have regained power. Although a factionalised political party, the whole of Labour can agree that the time is nigh to enact socialist reform in Britain, to build the new Jerusalem long promised by party leaders"
 ENG_moderate_policies:0 "The Merry Men"
 ENG_moderate_policies_desc:0 "The moderate wing of the Labour Party, the Merry Men, have formed a government. Centered around the moderate socialist vision of deceased party leader Robin Cook, the Merry Men stand ready to implement their program of nationalization and demilitarization of Britain, while strengthening welfare and the existing democratic institutions."
 ENG_media_reform:0 "Enact Media Reform"
 ENG_media_reform_desc:0 "Far too much of the press is controlled by private media moguls, inherently hostile to our agenda and the betterment of the British working class. By instating ownership limits on both print and broadcast media, we can ensure a wider and more democratic debate"
 ENG_labour_welfare_program:0 "Strengthen Social Protections"
 ENG_labour_welfare_program_desc:0 "No matter how much the SDP government claimed to be in favour of the welfare state, the actual state of social care leaves much to be desired. Only with more welfare and more spending can we correct their failures, and build a Britain that works for the many instead of the few."
 ENG_less_military_spending:0 "Modernize Armed Forces"
 ENG_less_military_spending_desc:0 "War certainly isn't approaching, so there is no point to this bloated army of ours. Rationalising military spending will ensure that there is sufficient money for other, more beneficial endeavors, and prove to Europe that we have no aggressive intentions."
 ENG_modernize_undermocratic_institutions: "Reform the Undemocratic Institutions"
 ENG_modernize_undermocratic_institutions_desc:0 "The promise to abolish the House of Lords is about as old as the Labour Party. Upon the recommendations of a cross-factional slate of politicians and experts, it has been decided to replace the organ with a properly, directly elected Senate, which will preserve the scrutinising benefits of the House of Lords, while strengthening the representation of regional interests."
 ENG_boster_trade_education:0 "Bolster Trade Education"
 ENG_boster_trade_education_desc:0 "Education in the trades is the foundation for any industrial economy, and yet the trades educations have been left behind as the industrial economy has been. If we wish to revitalize the world outside of London finance, encouraging more people to take up the trades, and providing them with the quality educations they need, would get us far."
 ENG_labour_minor_nationalisation:0 "Restore the National Enterprise Board"
 ENG_labour_minor_nationalisation_desc:0 "Once steering the British economy towards greater development, the National Enterprise Board was regrettably shut down by the SDP before it could really rationalise the British economy. Mixing economic planning with private initiative, the steady hand of the National Enterprise Board will be able to steer the British economy back to prosperity."
 ENG_national_urban_renewal_scheme:0 "Enact the National Urban Renewal Scheme"
 ENG_national_urban_renewal_scheme_desc:0 "It is a regrettable fact that British cities have been allowed to decline, with many people living in slum-like conditions while high streets deteriorate. As the party that built a record one million homes when the Second World War had devastated our economy, we cannot tolerate continued decline. The time is nigh to repair and restore housing across the nation, so that Attlee's record may be topped and the British people live in proper conditions."
 ENG_economic_advisory_council:0 "Establish the National Advisory Committee"
 ENG_economic_advisory_council_desc:0 "Restoring the National Economy is no easy task. By establishing a British Economic Advisory Council, we can enlist the help of the brightest economists in Britain, who shall work towards guiding the government towards beneficial economic policies. With this, we can put Britain’s derelict industries to work once more to ensure prosperity for all."
 ENG_rebuild_labour_coalition:0 "Rebuild the Labour Coalition"
 ENG_rebuild_labour_coalition_desc:0 "When the Gang of Four and the Revisionists broke from the Labour Party, they unfortunately brought with them scores of the labour movement. With the success of the latest Labour government, and our moderate stances compared to the Tribune Group, we have good chances to lure these defectors back and reclaim our mantle as the undisputed leader of British labour!"
 ENG_radical_policies:0 "The Tribune Group"
 ENG_radical_policies_desc:0 "The Tribune Group has led the Labour Party to victory. Founded in support of the socialist Tribune Magazine, the Group has defined the direction of the party since Tony Benn became Labour leader. Now, the party takes power with radical ideas for reshaping British politics at home and abroad. Champions of the recently popularized republican cause, Labour has promised a referendum on the British monarchy, the nationalization of industry, and much stronger and encompassing social state."
 ENG_republic_referendum:0 "The Commonwealth of Britain Act"
 ENG_republic_referendum_desc:0 "Originally drafted and proposed by Tony Benn, Queen Elizabeth II's attempted coup has demonstrated the necessity of the introduction of the Commonwealth of Britain Act even beyond the ranks of Republican stalwarts. Adopting a formalised constitution long overdue, the act would see Britain transformed into a federal republic, free of crowned heads and archaic institutions. May our Commonwealth rise, and prove democracy ever stronger."
 ENG_build_ties_with_left:0 "Build Ties with the Broad Left"
 ENG_build_ties_with_left_desc:0 "Long marginalised by the political establishment, the British communist movement has been invaluable in contributing to the history of the British left. Out of political exile, the Communist Party of Great Britain will not just shore up our left flank, but will in time come to accept the democracy we have built."
 ENG_rights_of_immigrants:0 "Enshrine the Rights of Immigrants"
 ENG_rights_of_immigrants_desc:0 "Despite their invaluable contributions to British society, many immigrants nevertheless remain in legal limbos, or are poorly regarded by their neighbours. The Labour Party must stand for all members of the working class, no matter their origins. As such, upon the guidance of Diane Abbott, the Labour Party will introduce legislation to finally ensure that migrants may know they will always have a home in Britain."
 ENG_reconcile_with_eu_nations:0 "Reconcile with the European Union"
 ENG_reconcile_with_eu_nations_desc:0 "While the distance between us has grown significantly, there is yet interest in Brussels for a good relationship with Britain, and Britain still needs access to Europe's markets to revive the economy. Though this will certainly be controversial with the whole political spectrum, we're going to need a proper deal with Europe in order for Britain to thrive."
 ENG_new_national_welfare_service:0 "New National Welfare Services"
 ENG_new_national_welfare_service_desc:0 "Although the NHS is the cornerstone of the British social system, it was only ever supposed to be the beginning. Proposals for a National Care Service and a National Education Service, among many other, have been made again and again, and with a Labour government finally in place, it is nigh time to make these more than just proposals."
 ENG_new_nhs:0 "Restore the NHS"
 ENG_new_nhs_desc:0 "Once a pride of the nation, our National Health Service is today in dire need of a strong revival. A massive funding-increase is needed to restore this illustrious institution, and the wealth of the recently abolished monarchy will be just the trick it needs. The British people will finally have the proper healthcare it deserves again."
 ENG_democratic_planning_structures:0 "Instate Democratic Planning Structures"
 ENG_democratic_planning_structures_desc:0 "A planned economy has been the aim of the Labour Party since the Attlee government, and in accordance with the Alternate Economic Strategy adopted by the Tribune Group and the CPGB, the time is nigh to make that happen. A planning board directly accountable to the British electorate will be established, and businesses both private and public will be made subject to its decrees. At long last, the Labour Party may 'secure for the workers by hand or by brain the full fruits of their industry and the most equitable distribution thereof', as has always been the goal"
 ENG_coop_union_rights:0 "Strengthen Cooperative and Union Rights"
 ENG_coop_union_rights_desc:0 "If the Labour Party has made one mistake in its pursuit of socialism, it has been its centralising tendencies. All hitherto attempts have had inadequate success because we have been unwilling to center socialism in the daily lives of the people, an error that can only rectified if we enshrine by legislation the rights of organised labour and the cooperative movement to contest the dominance of the capitalist system."
 ENG_dismantle_security_state:0 "Dismantle the Security State"
 ENG_dismantle_security_state_desc:0 "Heavy-handed measures have been taken by an Owen government willing to sell out the rights of the people in the hopes of security. As the crisis has passed, and as proof has emerged that negotiations always remains the most useful way to secure peace and tranquility, the time is nigh to do away with this nightmare law and restore the civil liberties of the British people."
 ENG_hold_scottish_indyref:0 "Scottish Independence Referendum"
 ENG_hold_scottish_indyref_desc:0 "With the long-standing issues with Scottish home rule not subsiding on their own, it increasingly appears that the only solution to the discontent in the country is an independence referendum. Long championed by the Scottish National Party, it seems we may give them what we want, but no matter the outcome of the referendum, the issue will hopefully be put to rest for good. May the Scottish people choose right."
 ENG_northern_ireland_negotiations:0 "Northern Ireland Negotiations"
 ENG_northern_ireland_negotiations_desc:0 "With the threat of a Communist revolution no longer visible as it was in the 1980s, perhaps it's time to renegotiate Northern Ireland... even if it costs us the alliance with Ireland."
 ENG_strengthen_the_protection_union:0 "Strengthen the Protection Union"
 ENG_strengthen_the_protection_union_desc:0 "An independent Ulster is here to stay, and we see no issue with that. For now we should be strengthening the ties between our three proud nations."
 ENG_government_of_strength:0 "Government of Strength"
 ENG_government_of_strength_desc:0 "Tory governments have for many decades failed to realise that an iron fist is necessary to uniting this divided kingdom. But if we are to survive in this red world, a firm hand is needed on the rudder to preserve Great Britain."
 ENG_privatise_the_nhs:0 "Privatise the NHS"
 ENG_privatise_the_nhs_desc:0 "Ridiculous leftists want to strengthen the National Health Service. But Mrs. Thatcher had the right idea: Privatisation is the proper British way. The free market is the best way to ensure quality service in all fields, including healthcare."
 ENG_strengthen_our_army:0 "Strengthen our Army"
 ENG_strengthen_our_army_desc:0 "In the face of such a dangerous Communist threat, and our own Prime Minister murdered by the reds, we need a stronger army to defend our island."
 ENG_nuclear_initiative:0 "Nuclear Initiative"
 ENG_nuclear_initiative_desc:0 "Nuclear weapons will continue to keep us safe. The reds will think twice to attack our fair land if we can back our words with nuclear weapons."
 ENG_christian_britain:0 "Christian Britain"
 ENG_christian_britain_desc:0 "The United Kingdom is not Hindu, Muslim, Atheist, Jewish or any other religion. This is a Christian nation... and it will forever be a Christian nation."
 ENG_sabotage_the_conservative_leadership:0 "Sabotage the Conservative Leadership"
 ENG_sabotage_the_conservative_leadership_desc:0 "The Conservative Party has failed to secure our nation against outside threats. It's time we had real leadership."
 ENG_false_flag:0 "False Flag"
 ENG_false_flag_desc:0 "Britain isn't simply going to accept a new ruling government. We need a certain... spark, to get things rolling."
 ENG_new_election:0 "New Election"
 ENG_new_election_desc:0 "Now they will elect a new Prime Minister, a strong Prime Minister. One who will not let our tragedy continue. With the surge in support for the far-right parties, it is merely a question of if and not when the inept Tories will be swept aside by the forces of patriotism."
 ENG_far_right_control:0 "Far-Right Control"
 ENG_far_right_control_desc:0 "A far-right party has been elected for the first time in British history."
 ENG_paramilitary_brigades:0 "Paramilitary Brigades"
 ENG_paramilitary_brigades_desc:0 "Paramilitary brigades will help us restore order and harmony on the streets. A few roughed up leftists should remind the rest of them not to protest our glorious regime any longer."
 ENG_strengthen_our_party:0 "Strengthen our Party"
 ENG_strengthen_our_party_desc:0 "For now the party isn't strong enough to control all branches of government. This will change soon enough..."
 ENG_royal_guidance:0 "Royal Guidance"
 ENG_royal_guidance_desc:0 "We need the royal family to be our allies. Having been the cornerstone of British society for centuries, their support is needed to legitimize our regime. After all, since old King Edward VIII was sympathetic to the cause, surely his niece must be as well."
 ENG_out_with_royalty:0 "Out With Royalty"
 ENG_out_with_royalty_desc:0 "Windsors will only get in our way. With the Queen's failed power grab in mind, and her son's rabid tree-hugging tendencies, we cannot trust them to be loyal to our regime. It's time for an end to the monarchy as we know it."
 ENG_anti_immigration_policies:0 "Anti-Immigration Policies"
 ENG_anti_immigration_policies_desc:0 "Those damn pests from outside our borders are threatening our traditional, pure British way of life. Get them out as soon as possible, and don't let any more in."
 ENG_new_educational_material:0 "New Educational Material"
 ENG_new_educational_material_desc:0 "A renewed national curriculum will allow us to consolidate control within the first years of a child's schooling, up until graduation. Soon all of Britain shall be chanting our slogans, with no opposition to be seen."
 ENG_cut_off_the_channel:0 "Cut Off the Channel"
 ENG_cut_off_the_channel_desc:0 "The English Channel allows both immigrants and invading enemies to cross into our precious homeland. Grand fortifications must be erected to deter any and all who would dare violate Britain."
 ENG_ban_atheism:0 "Ban Atheism"
 ENG_ban_atheism_desc:0 "Atheists wish to see the destruction of the Church of England, and all traditional foundations of British society. We must ban Atheism before it's too late."
 ENG_unify_the_nationalist_parties:0 "Unify the Nationalist Parties"
 ENG_unify_the_nationalist_parties_desc:0 "There are many far right parties that exist within our country. However, most of them are insignificant, little more than bands of bored football hooligans. With our control over the government assured, we should subordinate these groups to our party, and wipe out the ones who refuse."
 ENG_adopt_national_economics:0 "Adopt National Economics"
 ENG_adopt_national_economics_desc:0 "'Free Trade' has only served to weaken us, forcing us to rely on other countries for goods that we could be making ourselves. Let us resolve to create a truly National Economy!"
 ENG_powerful_union:0 "Powerful Union"
 ENG_powerful_union_desc:0 "Leaders from the United Kingdom, Ireland and Ulster gathered in the 1980s to discuss a solution to the Troubles, in order to prevent a socialist uprising. Now the protection union has continued to last as a strong barrier against tyranny. It would be disastrous to do away with it."
 ENG_ulster_investment:0 "Ulster Investment"
 ENG_ulster_investment_desc:0 "Our government will invest in Ulster. Despite the deep-running ethnic tensions there, or perhaps because of those, shoring up the Ulster economy is important to securing the continued existence of the Protection Union."
 ENG_irish_investment:0 "Irish Investment"
 ENG_irish_investment_desc:0 "Our government will invest in Ireland. Despite our long-standing alliance, actual relations with the Irish remain tense, and exist more out of an anti-communist obligation than warm hearted feelings between our nations. By investing in their economy, we may hopefully make them feel a bit more open to us Great Britons."
 ENG_new_training_exercises:0 "New Training Exercises"
 ENG_new_training_exercises_desc:0 "From the UK to Ireland and Ireland to Ulster, all soldiers will be trained by those with the highest qualifications. This will also help tying the Protection Union much closer together and bridge the gaps between Briton and Irishman!"
 ENG_joint_naval_force:0 "Joint Naval Force"
 ENG_joint_naval_force_desc:0 "This proposed joint naval force shall prove to the world that we are ready to defend our coastlines, no matter the cost."
 ENG_the_phoenix_front_craze:0 "The Phoenix Front Craze"
 ENG_the_phoenix_front_craze_desc:0 "A bewildered political establishment never expected it. Conservative darling Theresa Brasier's radical Phoenix Front swept away all opposition at the recent elections, and now we are ready to enact major reforms."
 ENG_unite_with_corporations:0 "Unite With Corporations"
 ENG_unite_with_corporations_desc:0 "By securing positive relationships with large businesses, the political influence of our opposition will be greatly diminished. The added benefits to the national economy will also be welcomed, as we establish a Britain free of communistic influences."
 ENG_establish_concentration_camps:0 "Establish Concentration Camps"
 ENG_establish_concentration_camps_desc:0 "Arabs, homosexuals, non-Christians and more heathen demographics shall be... sent away for the time being. Their degenerative influence on British society shall not be missed."
 ENG_persecute_leftist_activists:0 "Persecute Leftist Activists"
 ENG_persecute_leftist_activists_desc:0 "It is truly disgusting how the left continues to voice dissent in the face of our strong and united government. They should be thrown in jail."
 ENG_phoenix_television:0 "Phoenix Television"
 ENG_phoenix_television_desc:0 "While the idea of a public broadcaster is an excellent one, the BBC is overrun by Bolsheviks spreading lies and misinformation to the British society. Instead, we shall establish a new public broadcaster, ready to tell the people the truth about our government. The voice of Britain will reach all households across our home island!"
 ENG_visible_army:0 "Visible Army"
 ENG_visible_army_desc:0 "No longer will the army be sidelined. Citizens will now see soldiers marching down their streets everyday, finally knowing that they are safe from terrorists."
 ENG_govern_by_social_darwinism:0 "Govern by Social Darwinism"
 ENG_govern_by_social_darwinism_desc:0 "The strong rule over the weak. This is a simple law of nature. We are strong, and so we must rule."
 ENG_train_a_new_generation:0 "Train a New Generation"
 ENG_train_a_new_generation_desc:0 "Once our new curriculum, cleansed of all bolshevik influences, is implemented in the schools, the young will be fighting for us, leading for us."
 ENG_out_with_the_protection_union:0 "Out With the Protection Union"
 ENG_out_with_the_protection_union_desc:0 "The British Isles Protection Union is an outdated institution, established only to create the illusion that we were fighting against communism."
 ENG_invite_scandinavia:0 "Invite Scandinavia"
 ENG_invite_scandinavia_desc:0 "Britain and Scandinavia have historically been tied closely together, and although many of those ties were abandoned during the late 80s and early 90s, they could easily be rekindled. We should invite the Scandinavians of an agreeable disposition to our new alliance."
 ENG_invite_morocco:0 "Invite Morocco"
 ENG_invite_morocco_desc:0 "With both of our nations being Atlantic powers, we have a common interest in keeping the Atlantic Ocean clear and open for shipping. We should put out feelers to the Moroccans, and see if they’re interested in an alliance."
 ENG_one_with_the_church_of_england:0 "One With the Church of England"
 ENG_one_with_the_church_of_england_desc:0 "The Church of England is a necessary religious foundation for our government. Already under the control of Her Majesty the Queen, it will easily be reforged into a tool to ensure that Britain remains true to both God and state."
 ENG_influence_clergy:0 "Influence Clergy"
 ENG_influence_clergy_desc:0 "Through intimidation, bribery and blackmail, the clergy of Britain shall be under our firm control. After all, even men of God have their weaknesses, and we shall find them and then ruthlessly exploit them to ensure that the Church of England shall forever be loyal to the state."
 ENG_protect_the_monarch:0 "Protect the Monarch"
 ENG_protect_the_monarch_desc:0 "The leftist seditionists came way too close to abolishing the monarchy, but thankfully that never came to pass. Queen Elizabeth II is here to stay, as is the Windsor family."
 ENG_keep_the_lords_in_line:0 "Keep the Lords in Line"
 ENG_keep_the_lords_in_line_desc:0 "Just because we support the monarchy does not mean the nobility will get any special privilege. The loyal may stay, the rest must go."
 ENG_isolate_britain:0 "Isolate Britain"
 ENG_isolate_britain_desc:0 "Our people should not be subject to foreign influences and degenerate propaganda. Isolation from much of the outside world is a preferable alternative."
 ENG_invite_australia:0 "Invite Australia"
 ENG_invite_australia_desc:0 "Australia and Britain have always been tied closely together, and despite the dissolution of the Commonwealth, our two nations are still dear to one another. If the Australians would agree, we would be honoured to stand side by side with them once again."
 ENG_invite_south_africa:0 "Invite South Africa"
 ENG_invite_south_africa_desc:0 "South Africa has long been an isolated country, but we have not forgotten our historic ties to the South Africans. Let us break this isolation and reach out to the South Africans, and hope that they will take our hand once again."
 ENG_invite_iran:0 "Invite Iran"
 ENG_invite_iran_desc:0 "While Iran and Britain have had a sordid history, fifty years have passed since the last bump on the road. Hopefully, the time passed has made the Iranians forgive us, so that they would be willing to join in our alliance and be a strong bastion in the Middle East."
 ENG_irish_trade:0 "Irish Trade"
 ENG_irish_trade_desc:0 "More economic connections to Ireland should be established. With the Emerald Isle so close by, it only makes sense to strengthen our trade relations so all can reap the benefits."
 ENG_befriend_brazil:0 "Befriend Brazil"
 ENG_befriend_brazil_desc:0 "Brazil is the largest country in South America. If we could align them, we could gain a powerful ally. Let's arrange a meeting with [BRA.GetLeader] and set up amicable relations that hopefully may bloom into something more some day."
 ENG_trade_with_brazil:0 "Trade With Brazil"
 ENG_trade_with_brazil_desc:0 "Brazil is host to an immense wealth of natural resources. If we could just get cheap access to those, both of our economies could experience a tremendous amount of growth."
 ENG_befriend_mexico:0 "Befriend Mexico"
 ENG_befriend_mexico_desc:0 "In the aftermath of the collapse of the United States, Mexico grew to be one of the powerhouses of the North American continent. As the former United States' future becomes more and more uncertain, with the successors squabbling for power, Mexico could make a valuable friend."
 ENG_trade_with_mexico:0 "Trade With Mexico"
 ENG_trade_with_mexico_desc:0 "Mexico is a highly populated country, and with the economic growth they've experienced over the last few decades, it has become an excellent export market for British goods. We should strike up some mutually beneficial trade agreements with them."
 ENG_befriend_west_africa:0 "Befriend West Africa"
 ENG_befriend_west_africa_desc:0 "West Africa is one of the strongest countries in Africa, and despite their historic ties being closer to France than Britain, they may make us a good friend in the 21st century yet. Extending them a hand might be all that’s needed."
 ENG_trade_with_west_africa:0 "Trade With West Africa"
 ENG_trade_with_west_africa_desc:0 "West Africa is a developing country, and thus yearning for capital with which to modernize and develop. Britain has exactly that, and all we would need ask in exchange would be access to their plentiful natural resources. A few trade deals with the West African government is all that’s needed to acquire those."
 ENG_defend_the_streets:0 "The Royal Army"
 ENG_defend_the_streets_desc:0 "Should we find our enemies pouring into our lands, we shall defend every town, every house and every street with our blood. We will never surrender!"
 ENG_the_finest_equipment:0 "The Finest Equipment"
 ENG_the_finest_equipment_desc:0 "A modern army cannot fight with pride alone. Our soldiers deserve reliable rifles, vehicles, and support weapons equal to any enemy they may face."
 ENG_rolling_forwards:0 "Rolling Forwards"
 ENG_rolling_forwards_desc:0 "Mobility will decide the battles of the future. By investing in motorised support and rapid deployment, the British Army will be able to strike before our enemies can settle their lines."
 ENG_new_and_more_rifles:0 "New and More Rifles"
 ENG_new_and_more_rifles_desc:0 "The infantryman remains the backbone of the army. New small arms, produced in greater numbers, will ensure every British soldier enters battle properly equipped."
 ENG_advanced_r_and_d:0 "Advanced R&D"
 ENG_advanced_r_and_d_desc:0 "The next war will be won as much in laboratories and design bureaus as on the battlefield. Expanded military research will keep Britain ahead of its rivals."
 ENG_militarize_milton_keynes:0 "Militarize Milton Keynes"
 ENG_militarize_milton_keynes_desc:0 "Milton Keynes was built for modernity, and now it shall serve modern war. Its planned roads, warehouses, and industry can be adapted into a vital military production hub."
 ENG_project_sahara:0 "Project SAHARA"
 ENG_project_sahara_desc:0 "Standing for Survival, Armour, Health, and Rescue Array, Project SAHARA will ensure that no matter the circumstance our boys will be protected and come back home safe and sound."
 ENG_twenty_first_century_army:0 "21st Century Army"
 ENG_twenty_first_century_army_desc:0 "Britain cannot rely on old methods in a new century. With modern equipment, doctrine, and training, the Royal Army will be remade for the wars ahead."
 ENG_rebuilding_the_rac:0 "Rebuilding the RAC"
 ENG_rebuilding_the_rac_desc:0 "The Royal Armoured Corps has long carried the weight of Britain's mechanised might. It must be rebuilt, reorganised, and prepared to lead the army's advance once again."
 ENG_armored_infantry:0 "Armored Infantry"
 ENG_armored_infantry_desc:0 "Infantry cannot keep pace with modern armoured warfare on foot. Protected carriers and fighting vehicles will let our soldiers move with the spearhead instead of following behind it."
 ENG_mechanized_vanguard:0 "Mechanized Vanguard"
 ENG_mechanized_vanguard_desc:0 "A fully mechanised vanguard will give Britain the speed and shock needed to break through enemy lines and exploit every opening."
 ENG_modernize_the_challenger_tank:0 "Modernize the Challenger Tank"
 ENG_modernize_the_challenger_tank_desc:0 "The Challenger remains a symbol of British armoured strength, but even symbols require improvement. Updated systems and better support will keep our tanks dominant on the battlefield."
 ENG_embrace_nato_spearhead_doctrine:0 "Embrace NATO Spearhead Doctrine"
 ENG_embrace_nato_spearhead_doctrine_desc:0 "The lessons of NATO's spearhead formations remain valuable. Concentrated armour, rapid movement, and close coordination will allow us to punch through any opposing force."
 ENG_expand_the_chiefs_of_staff_committee:0 "Expand the Chiefs of Staff Committee"
 ENG_expand_the_chiefs_of_staff_committee_desc:0 "Modern war demands unified planning across every service and theatre. An expanded Chiefs of Staff Committee will give Britain's military strategy the coordination it requires."
 ENG_section_atlantis:0 "Section ATLANTIS"
 ENG_section_atlantis_desc:0 "The Atlantic remains Britain's lifeline to the wider world. Section ATLANTIS will prepare plans for operations across the ocean and the fractured lands beyond it.\n\nCampaign decisions: [ROOT.GetENGSectionAtlantisStatus]"
 ENG_section_antila:0 "Section ANTILA"
 ENG_section_antila_desc:0 "South America cannot be ignored in any global strategy. Section ANTILA will study the region, its approaches, and the forces Britain may need there.\n\nCampaign decisions: [ROOT.GetENGSectionAntilaStatus]"
 ENG_section_aurora:0 "Section AURORA"
 ENG_section_aurora_desc:0 "Europe lies just across the Channel, dangerous and unstable. Section AURORA will prepare the plans needed should Britain be forced to act on the continent once more.\n\nCampaign decisions: [ROOT.GetENGSectionAuroraStatus]"
 ENG_section_hyperion:0 "Section HYPERION"
 ENG_section_hyperion_desc:0 "Asia's balance of power grows more important each year. Section HYPERION will ensure Britain has the intelligence and operational planning needed to project influence there.\n\nCampaign decisions: [ROOT.GetENGSectionHyperionStatus]"
 ENG_section_notus:0 "Section NOTUS"
 ENG_section_notus_desc:0 "The Pacific may be distant, but distance has never excused British unpreparedness. Section NOTUS will focus our planning on far eastern waters and island campaigns.\n\nCampaign decisions: [ROOT.GetENGSectionNotusStatus]"
 ENG_legacy_of_the_sas:0 "Legacy of the SAS"
 ENG_legacy_of_the_sas_desc:0 "The Special Air Service has earned a reputation few units can match. By preserving and expanding its methods, Britain will retain an edge in the most dangerous operations."
 ENG_who_dares_wins:0 "Who Dares, Wins"
 ENG_who_dares_wins_desc:0 "Boldness, discipline, and initiative define our special forces. Those who dare shall continue to win for Britain in the shadows and on the front lines alike."
 ENG_the_royal_marines:0 "The Royal Marines"
 ENG_the_royal_marines_desc:0 "Britain's commandos must remain ready to strike from the sea at a moment's notice. The Royal Marines will be strengthened for raids, landings, and hard fighting ashore."
 ENG_by_sea_by_land:0 "By Sea, By Land"
 ENG_by_sea_by_land_desc:0 "Amphibious warfare requires mastery of both ship and shore. With better equipment and training, our marines will carry British power from the waves onto hostile ground."
 ENG_special_operation_task_force:0 "Special Operation Task Force"
 ENG_special_operation_task_force_desc:0 "Britain's elite formations are most effective when they act together. A dedicated task force will unite their talents for the missions conventional units cannot perform."
 ENG_sovereignty_of_the_waves:0 "Sovereignty of the Waves"
 ENG_sovereignty_of_the_waves_desc:0 "Our island's security begins at sea. Restoring command of the waves will protect our coasts, our trade, and Britain's place in the world."
 ENG_rebuild_the_surface_fleet:0 "Rebuild the Surface Fleet"
 ENG_rebuild_the_surface_fleet_desc:0 "The Royal Navy's surface fleet has withered for too long. New ships and renewed investment will return visible British strength to the oceans."
 ENG_a_new_generation_of_destroyers:0 "A New Generation of Destroyers"
 ENG_a_new_generation_of_destroyers_desc:0 "Destroyers are the workhorses of a modern fleet. A new generation will defend our task forces, patrol our waters, and carry British resolve wherever needed."
 ENG_permanent_naval_funding:0 "Permanent Naval Funding"
 ENG_permanent_naval_funding_desc:0 "A navy cannot be rebuilt through temporary enthusiasm. Permanent funding will give the Admiralty the confidence to plan, build, and maintain a fleet worthy of Britain."
 ENG_modern_missile_cruisers:0 "Modern Missile Cruisers"
 ENG_modern_missile_cruisers_desc:0 "Missile cruisers can project force far beyond the horizon. By developing modern cruisers, we will give our fleets the firepower to dominate any theatre."
 ENG_commission_new_supercarriers:0 "Commission New Supercarriers"
 ENG_commission_new_supercarriers_desc:0 "Carrier aviation remains the clearest expression of naval power. New supercarriers will let Britain bring air power to distant seas."
 ENG_the_trident_shield:0 "The Trident Shield"
 ENG_the_trident_shield_desc:0 "Britain's nuclear deterrent is the final shield of the realm. Protecting and modernising Trident will ensure no enemy can threaten our survival without consequence."
 ENG_subsurface_power_projection:0 "Subsurface Power Projection"
 ENG_subsurface_power_projection_desc:0 "Submarines give Britain reach, secrecy, and strategic weight beneath the waves. Expanding their role will let us project power without warning."
 ENG_any_task_anywhere:0 "Any Task, Anywhere"
 ENG_any_task_anywhere_desc:0 "The Royal Navy must be ready for every mission, from deterrence patrols to distant interventions. With a balanced fleet, Britain can answer any task, anywhere."
 ENG_expand_submarine_capabilities:0 "Expand Submarine Capabilities"
 ENG_expand_submarine_capabilities_desc:0 "Better sensors, quieter hulls, and improved weapons will make our submarines deadlier and harder to find. Beneath the sea, Britain will hold the advantage."
 ENG_to_strangle_a_nation:0 "To Strangle a Nation"
 ENG_to_strangle_a_nation_desc:0 "Control of the seas can decide a war before armies ever meet. Our submarine fleet will be prepared to cut enemy supply lines and choke hostile economies into submission."
 ENG_flying_aces:0 "Flying Aces"
 ENG_flying_aces_desc:0 "The RAF's greatest strength has always been the skill of its pilots. Renewed training and recruitment will ensure Britain produces aces worthy of its proudest traditions."
 ENG_modernize_the_dowding_system:0 "Modernize the Dowding System"
 ENG_modernize_the_dowding_system_desc:0 "Radar and command networks once saved Britain from invasion. A modern Dowding System will bind our defences together against the threats of the new century."
 ENG_next_generation_fighters:0 "Next Generation Fighters"
 ENG_next_generation_fighters_desc:0 "Air superiority cannot be taken for granted. Next generation fighters will give the RAF the speed, sensors, and weapons needed to rule Britain's skies."
 ENG_ensure_number_parity:0 "Ensure Number Parity"
 ENG_ensure_number_parity_desc:0 "Quality matters, but too few aircraft can still be overwhelmed. We must expand production until the RAF can meet its enemies in both skill and numbers."
 ENG_battlefield_operations:0 "Battlefield Operations"
 ENG_battlefield_operations_desc:0 "Air power must support the soldiers fighting below. A focus on battlefield operations will give our ground forces the close support they need to win."
 ENG_air_to_ground_saturation:0 "Air to Ground Saturation"
 ENG_air_to_ground_saturation_desc:0 "When British aircraft appear overhead, enemy formations should have nowhere to hide. Saturating the battlefield from the air will break attacks before they reach our lines."
 ENG_unmanned_operations:0 "Unmanned Operations"
 ENG_unmanned_operations_desc:0 "Unmanned aircraft can scout, strike, and patrol without risking British pilots. Investing in these systems will expand the RAF's reach across every battlefield."
 ENG_precision_strikes:0 "Precision Strikes"
 ENG_precision_strikes_desc:0 "A single accurate strike can achieve what mass bombing once required. Precision weapons will let Britain hit vital targets while conserving lives and materiel."
 ENG_strategic_operations:0 "Strategic Operations"
 ENG_strategic_operations_desc:0 "Wars are not won only at the front. By striking command centres, industry, and infrastructure, the RAF can weaken an enemy's will and capacity to fight."
 ENG_deep_raids:0 "Deep Raids"
 ENG_deep_raids_desc:0 "The enemy rear must never feel safe. Long-range raids will carry British air power deep beyond the front, disrupting plans before they become threats."
 ENG_logistical_targeting:0 "Logistical Targeting"
 ENG_logistical_targeting_desc:0 "An army without supplies is only a crowd with weapons. Targeting railways, depots, and convoys will starve enemy offensives before they begin."
 ENG_strikes_from_the_stars:0 "Strikes from the Stars"
 ENG_strikes_from_the_stars_desc:0 "Satellites, missiles, and advanced guidance systems are reshaping air warfare. Britain must learn to strike with precision from heights once thought unreachable."
 ENG_reaping_the_whirlwind:0 "Reaping the Whirlwind"
 ENG_reaping_the_whirlwind_desc:0 "If our enemies choose war, they shall feel the full fury of the RAF. Relentless bombing will leave them to reap the whirlwind they have sown."
 ENG_state_of_the_art_artillery:0 "State of the Art Artillery"
 ENG_state_of_the_art_artillery_desc:0 "With superior firepower and precision firing, we can hit our targets without endangering our boys."
 ENG_weapons_development:0 "Weapons Development"
 ENG_weapons_development_desc:0 "Defense contractors are already designing the next weapon upgrades for our arsenal. More reliable, powerful and accurate guns will make sure we get the job done in every environment we would find ourselves in."
 ENG_land_fort_project:0 "Land Fort Project"
 ENG_land_fort_project_desc:0 "A great construction effort will be undertaken to ensure that every enemy attempting to set foot on British soil will be beaten back across the Channel by our superior defenses."
 ENG_british_tanks:0 "British Tanks"
 ENG_british_tanks_desc:0 "British tanks are notably inferior to Canadian or German models, particularly in terms of reliability and speed. Further improvements in tank design need to address these glaring issues."
 ENG_training_program:0 "Training Program"
 ENG_training_program_desc:0 "British soldiers shall be the finest in the world. Drilled and taught in the newest tactics, to be combat ready in an ever changing world. The combination of ground, navy and air power will strike fear in the enemies of Britain."
 ENG_defend_the_oceans:0 "The Royal Navy"
 ENG_defend_the_oceans_desc:0 "Britain is an island nation, surrounded by water on all sides. This water wall has proven an impregnable defense over the centuries, only crossed nearly a thousand years ago. If it is to resist for the next one thousand years, the British navy must be restored."
 ENG_glorious_navy:0 "Glorious Navy"
 ENG_glorious_navy_desc:0 "Britannia once ruled the waves, and if we are to do so again, we must have the newest ships. Modernizing our destroyers would provide a keystone to naval defense both near and far."
 ENG_modern_vessels:0 "Modern Vessels"
 ENG_modern_vessels_desc:0 "No world-class navy is complete without capital ships. The age of the Battleship came to an end long ago, but that merely paved the way for a new kind of ship: The Aircraft Carrier. With a mighty fleet of these, Britain can project power anywhere in the world!"
 ENG_old_and_new_strategies:0 "Old and New Strategies"
 ENG_old_and_new_strategies_desc:0 "As our engineers and shipbuilders are hard at work restoring our navy, we must not forget the brains to our naval brawn. Let's give the Admiralty a call and invite them over for a meeting in Whitehall for a discussion about British naval strategy for the 21st century."
 ENG_protect_colonial_establishments:0 "Protect Overseas Establishments"
 ENG_protect_colonial_establishments_desc:0 "Despite the loss of colonial territory during the latter half of the 20th century, the sun does not yet set on the British Empire. Outposts such as the Falkland Islands yet remain under direct control from London. For the sun to never set, we should make sure that our control remains unchallenged going forward, and fortify them against an increasingly hostile world."
 ENG_broad_dockyard_construction:0 "Broad Dockyard Construction"
 ENG_broad_dockyard_construction_desc:0 "A world-class navy needs world-class dockyards to supply it with ships and repairs, and yet our dockyards have been allowed to deteriorate over the last couple of decades. We must embark on a grand programme of dockyard expansions, to ensure that the British navy has what it needs to once more rule the waves."
 ENG_defend_the_skies:0 "The Royal Air Force"
 ENG_defend_the_skies_desc:0 "The 20th century proved that there's a third dimension to warfare: The airspace. Today, even the mightiest armies and navies can be destroyed by air power. If we are to protect Britain from foreign threats, we must remember that we shall rule the third dimension too."
 ENG_legacy_of_the_battle_of_britain:0 "Legacy of the Battle of Britain"
 ENG_legacy_of_the_battle_of_britain_desc:0 "The battle of Britain was our finest hour, as we despite all odds proved that the torch of freedom in Europe could not be extinguished. We must learn from this victory and what earned it for us, and apply it once again for the 21st century."
 ENG_modern_bombers:0 "Modern Bombers"
 ENG_modern_bombers_desc:0 "Fighters only make up half of what an air force needs to do. With a modern fleet of bombers, Britain will be able to batter all her enemies into submission, just as Sir Arthur Harris did 70 years ago."
 ENG_scientific_advisors:0 "Scientific Advisors"
 ENG_scientific_advisors_desc:0 "With Britain developing into one of the major technological and scientific centers of the world, we have become a hotspot of highly skilled professors and personnel. Exchange programs have been put in place, with many of these scientific advisors boosting our industry and research facilities. Truly, Britain has entered the future."
 ENG_minor_economic_reforms:0 "Minor Economic Reforms"
 ENG_minor_economic_reforms_desc:0 "To resolve Our current economic situation, some reforms are needed. We shall make some slight reductions to Union influence on the economy, and remove some unnecessary regulations, to ensure that business can do what it needs to reenergize the British economy."
 ENG_elite_society:0 "Elite Society"
 ENG_elite_society_desc:0 "British society should not be showcased as poverty-stricken and rundown. At least, the world's media will only see our elite side... that of the royals and their benefactors."
 ENG_empower_corporations:0 "Empower Corporations"
 ENG_empower_corporations_desc:0 "We are willing to work with various domestic and international corporations to strengthen Our economy. After all, there is no need to discriminate against foreign businesses so long as they are willing to benefit Her Majesty's realm."
 ENG_the_queens_estates:0 "The Queen's Estates"
 ENG_the_queens_estates_desc:0 "We shall not allow foreign business interests to subvert the British economy and subordinate it to their whims. This is the Queen's land. It will always be hers, and any outside interference shall be met with the harshest rejection."
 ENG_one_coalition:0 "One Coalition"
 ENG_one_coalition_desc:0 "A coalition of parties across the political spectrum will project an image of stability and relative freedom to not just the British people, but the world."
 ENG_restore_economic_confidence:0 "Restore Economic Confidence"
 ENG_restore_economic_confidence_desc:0 "Soon all shall see these isles as productive, economically efficient, and most of all... they will view Britain once again as a world power."
 ENG_spy_on_the_people:0 "Spy On the People"
 ENG_spy_on_the_people_desc:0 "The British Security Act gave our intelligence agencies various new capabilities, but this reform should even further expand those to cover a wider range of monitoring."
 ENG_national_royal_holiday:0 "National Royal Holiday"
 ENG_national_royal_holiday_desc:0 "With the Spectre of Republicanism still hanging over Britain, a few additional measures might be needed to remind the people of Her Majesty’s grace and benevolence. An annual holiday is an excellent opportunity for bringing all of Britain together to celebrate our traditions and the monarchy itself!"
 ENG_the_queens_soldiers:0 "The Queen's Soldiers"
 ENG_the_queens_soldiers_desc:0 "While Her Majesty technically is the Commander-in-Chief of the army, archaic legislation still prevents Her Majesty from utilizing her army without the assent of Parliament. Needless to say, such obstructionism does not befit Our new United Kingdom and will be overturned."
 ENG_appease_scotland:0 "Appease Scotland"
 ENG_appease_scotland_desc:0 "Tensions in Scotland have reached a breaking point with the new absolute powers granted to our Queen. If We were to somehow appease them, surely these tensions would gradually disappear... but the English people would feel sidelined as well."
 ENG_one_union_under_england:0 "One Union Under England"
 ENG_one_union_under_england_desc:0 "Queen Elizabeth II is Queen of England and England only. All those who think this nation should appease terrorists in Scotland and Wales, are no better than the terrorists themselves."
 ENG_recover_from_backlash:0 "Recover From Backlash"
 ENG_recover_from_backlash_desc:0 "The English people were angered by our royal leader's gesture of goodwill. We must remind them that Her Majesty is not just a puppet of the regional administrations, but instead the Queen of the English, the Scots and the Welsh all alike."
 ENG_rebuild_scotland:0 "Rebuild Scotland"
 ENG_rebuild_scotland_desc:0 "The war with Scotland was horrific for many of its people, who only wanted peace under our glorious Queen. Her Majesty is naturally magnanimous in victory, and will thus divert some funds towards the reconstruction of Scotland."
 ENG_days_of_glory:0 "Days of Glory"
 ENG_days_of_glory_desc:0 "Her Majesty once reigned over a magnificent Empire, stretching from the Caribbean, around the world to the Pacific Ocean. These days of glory are long gone due to the failures of democracy. Now the world shall see a renewed age of British glory... and this time we won't be stopped."
 ENG_queen_of_northern_ireland:0 "Monarch of Northern Ireland"
 ENG_queen_of_northern_ireland_desc:0 "Ulster's independence was a mistake, aimed at securing control for the corrupt political parties of the time. It must be returned to our divided Kingdom."
 ENG_operation_green:0 "Operation Green"
 ENG_operation_green_desc:0 "Almost a hundred years ago, spineless men signed away an integral part of the Realm: Ireland. The time has come to rectify that mistake. Once more the British Isles shall be united under one flag."
 ENG_the_spanish_marriage:0 "The Spanish Marriage"
 ENG_the_spanish_marriage_desc:0 "Spain is one of the few European countries that have been able to preserve its monarchy, and now stands strong against the twin scourges of Republicanism and Communism. A marriage with the Spanish royal family would secure a strong alliance between our two nations."
 ENG_target_canada:0 "Target Canada"
 ENG_target_canada_desc:0 "Canadian traitors left our Empire long ago, having forgotten their centuries of loyalty to the Crown. Scorning Her Majesty like that won't reap them any benefits, however. The Royal Army will make sure of that."
 ENG_british_caribbean:0 "British Caribbean"
 ENG_british_caribbean_desc:0 "The 'democratic' leaders of days gone by rapidly granted independence to the Caribbean islands. These jewels of the ocean were once possessions of a proud Empire, and they will be again."
 ENG_pressure_the_argentines:0 "Pressure the Argentines"
 ENG_pressure_the_argentines_desc:0 "Argentina continues to claim the Falkland Islands as their own. They shall revoke these claims, or else."
 ENG_the_west_african_colonies:0 "The West African Colonies"
 ENG_the_west_african_colonies_desc:0 "Nations like Nigeria and Ghana have failed without British oversight."
 ENG_british_south_africa:0 "British South Africa"
 ENG_british_south_africa_desc:0 "Since when could anyone in that region govern for themselves without mass corruption and poverty? It is clear that only tragedy has befallen South Africa in the time since they departed Our rule, their lands plagued by racism and endless strife. Her Majesty will put an end to that and bring the South Africans back under her benevolent rule."
 ENG_british_north_africa:0 "British North Africa"
 ENG_british_north_africa_desc:0 "Once Britain ruled the Mediterranean, but in a series of humiliations they all slipped from Our grasp. In particular, the Egyptian government made Britain look weak and incapable of maintaining its Empire. Time for payback."
 ENG_arabian_memories:0 "Arabian Memories"
 ENG_arabian_memories_desc:0 "The British Empire once controlled these jewels of Asia. Restoring them to Her Majesty's realm will put their natural resources, particularly their oil, back under British control, which would only make a welcome addition to Our imperial ambitions."
 ENG_ultimatum_to_cyprus:0 "Ultimatum to Cyprus"
 ENG_ultimatum_to_cyprus_desc:0 "After changing hands between various nations, Cyprus must be returned to the United Kingdom... the easy way or the hard way."
 ENG_empress_of_india:0 "Empress of India"
 ENG_empress_of_india_desc:0 "The British Raj was once Our prized possession. Now it is a mess of socialist dictatorships and endless poverty. Now they can see what lack of European rule does to their precious nations."
 ENG_pacific_empire:0 "Pacific Empire"
 ENG_pacific_empire_desc:0 "All former lands of the Empire in Oceania must return! Britannia will rule the Pacific as she rules the Atlantic!"
 ENG_demand_somaliland:0 "Demand Somaliland"
 ENG_demand_somaliland_desc:0 "We don't want all of Somalia, just the rightful region we once controlled. But if those idiots in Mogadishu refuse, then we may have to take it all."
 ENG_thirteen_colonies:0 "Thirteen Colonies"
 ENG_thirteen_colonies_desc:0 "The United States was the first domino of Our empire to fall, the one to prove it possible. While the old United States of America have been relegated to the dustheap of history, there yet remains a few successors claiming that mantle. We will finally have our revenge."
 ENG_the_hong_kong_mistake:0 "The Hong Kong Mistake"
 ENG_the_hong_kong_mistake_desc:0 "What was our idiotic government thinking when it simply gave away the beautiful city of Hong Kong?"
 ENG_republican_values:0 "Republican Values"
 ENG_republican_values_desc:0 "All citizens of this Kingdom must come to realise that their monarchy has never served them, and they themselves are slaves. We must begin preparations for a Republican transition, both by aligning the public and preparing the government."
 ENG_radical_economic_reforms:0 "Radical Economic Reforms"
 ENG_radical_economic_reforms_desc:0 "With the Trades Union Congress aligned, we can begin reforms to establish a revolutionary socialist economy. Our reforms shall touch every sector of the economy, bringing popular control over capitalist industries left alone for too long."
 ENG_limit_press_coverage:0 "Limit Press Coverage"
 ENG_limit_press_coverage_desc:0 "The Sun, the Telegraph, the Daily Mail, all parts of a greater Capitalist plot to completely and utterly control public opinion and convince the people to act against their objective interests. As such, too much freedom for the media will hinder our efforts to overthrow the current oligarchy. Only if the capitalist media is silenced can the British people be emancipated."
 ENG_establish_nationalisation_ministry:0 "Establish Nationalisation Ministry"
 ENG_establish_nationalisation_ministry_desc:0 "The British People's Nationalisation Ministry will directly organise and fund the nationalisation of various economic sectors."
 ENG_nationalise_energy:0 "Nationalise Energy"
 ENG_nationalise_energy_desc:0 "Current corporate control over our energy grid is atrocious. Mismanagement of power plants and price gouging energy bills have done an immense disservice to the British people. As such, it is imperative that the energy sector is brought under state ownership."
 ENG_nationalise_infrastructure:0 "Nationalise Infrastructure"
 ENG_nationalise_infrastructure_desc:0 "Private ownership has only allowed our infrastructure to fall apart at the seams, damaging our economy and reducing the quality of our public transportation. The only logical conclusion is that all infrastructure of this nation must be state owned."
 ENG_increase_healthcare_coverage:0 "Increase Healthcare Coverage"
 ENG_increase_healthcare_coverage_desc:0 "Unfortunately, recent economic downturns have left many British people without affordable healthcare. This situation must change as soon as possible."
 ENG_withdraw_european_ambassadors:0 "Withdraw European Ambassadors"
 ENG_withdraw_european_ambassadors_desc:0 "The European Union is simply a Soviet tool to control all people of Europe with their iron fist. We should withdraw our ambassadors from the continent as a show of defiance against this blatant tyranny."
 ENG_meet_with_the_queen:0 "Meet With the Queen"
 ENG_meet_with_the_queen_desc:0 "Unlike our more mainstream Communist 'friends', the British revolutionary socialist movement is not a barbaric one. Instead of beheading our royals as so many of them do, we will meet with the Queen and discuss the peaceful and democratic abolition of her family's rule."
 ENG_abolish_the_monarchy:0 "Abolish the Monarchy"
 ENG_abolish_the_monarchy_desc:0 "Our representatives have met with the Queen and she has agreed to the royal family's abolition, choosing to spend the rest of her life in the English countryside as a loyal British citizen."
 ENG_nationalise_royal_estates:0 "Nationalise Royal Estates"
 ENG_nationalise_royal_estates_desc:0 "Now that the monarchy is out of the way, we can begin nationalising all royal estates. Their mighty palaces and lands will be put to use for the British people instead!"
 ENG_industrial_workers_of_britain:0 "Industrial Workers of Britain"
 ENG_industrial_workers_of_britain_desc:0 "Now that we are firmly on the path to Socialism, we should ensure that the trade unions of Britain truly represent all the workers, and make membership mandatory! Workers of the British Republic unite!"
 ENG_invite_socialist_american_scientists:0 "Invite Socialist American Scientists"
 ENG_invite_socialist_american_scientists_desc:0 "Scientists from across the Atlantic Ocean are eager to meet their British counterparts, previously restricted by geopolitical issues."
 ENG_draft_a_socialist_constitution:0 "Draft a Socialist Constitution"
 ENG_draft_a_socialist_constitution_desc:0 "For far too long, Britain has been governed by an archaic set of traditions and customs, allowing the moneyed class to run roughshod over a legally unprotected working class. Finally our new nation shall have a proper law of the land."
 ENG_dissolve_parliament:0 "Dissolve Parliament"
 ENG_dissolve_parliament_desc:0 "The last remnants of Britain's oligarchic democracy shall be swept away..."
 ENG_british_workers_congress:0 "British Workers' Congress"
 ENG_british_workers_congress_desc:0 "To replace the House of Commons and House of Lords, the British Workers' Congress will become the legislative branch of our government."
 ENG_confederation:0 "Confederation"
 ENG_confederation_desc:0 "What we all must realize is that any unified British state will disproportionately favour England. For Socialism to blossom in both Wales and Scotland, they need a chance to chart their own path, naturally hand in hand with us. We must begin working towards a Confederal Britain."
 ENG_federation:0 "Federation"
 ENG_federation_desc:0 "While the Scottish and Welsh hold legitimate grievances towards the British state, to merely cut them loose and tell them to go their own way would be an uncomradely decision. Instead, we must make our Republic work for them too, by embracing the idea of a federal system, so we can all build Socialism in Great Britain together!"
 ENG_union_state:0 "Union State"
 ENG_union_state_desc:0 "Britain is a sole beacon of true Socialism, surrounded by enemies on all sides. If we are to persevere through such hostile waters, we must stand together, no matter how much the Scottish and Welsh will niggle about it. Control from London must be strengthened if we are to survive."
 ENG_workers_of_england:0 "Workers of England"
 ENG_workers_of_england_desc:0 "For decades, capitalist lords have trampled over the workers, only allowing England to wither and decay. The workers of England deserve better than this! We must invest massively in restoring the land of the Diggers and make it worthy of the workers who inhabit it!"
 ENG_workers_of_scotland:0 "Workers of Scotland"
 ENG_workers_of_scotland_desc:0 "English dominance has ensured that the proud land of Scotland has, in spite of its diligent and hardworking peoples, always been relegated to playing second fiddle. The workers of Scotland deserve better than this! Colin Fox, leader of the Scottish Labour Party, has a plan to revitalize Scotland as they transition towards independence, one that we would be wise to enact."
 ENG_workers_of_wales:0 "Workers of Wales"
 ENG_workers_of_wales_desc:0 "Ever since being conquered in 1283, Wales has merely been regarded as an extension of England. The workers of Wales deserve better than this! The Welsh transition to independence must be aided, so that Wales is capable of standing on her own feet once more."
 ENG_socialist_devolved_parliaments:0 "Socialist Devolved Parliaments"
 ENG_socialist_devolved_parliaments_desc:0 "While it was proposed, the United Kingdom's successive governments failed to establish devolved parliaments for each nation. Now we can finally fulfil the people's wishes and grant more representation to the Scottish and Welsh people."
 ENG_revolutionary_institutions:0 "Revolutionary Institutions"
 ENG_revolutionary_institutions_desc:0 "New institutions for this federation will unite academics from each British nation, and show that despite our cultural differences, we can all work together."
 ENG_national_reconciliation:0 "National Reconciliation"
 ENG_national_reconciliation_desc:0 "The devolved parliaments were a good start, but it is not enough to mend the wounds caused by the now-disestablished English hegemony in the Union. We must begin a gradual healing process, so that all Britons may feel at home in our Republic."
 ENG_strengthened_red_army:0 "Strengthened Red Army"
 ENG_strengthened_red_army_desc:0 "Our Red Army will be defiant against all threats, from both imperialists and our fellow Stalinist enemies. All it needs is some more men, men that extending conscription a bit can easily get."
 ENG_further_centralisation:0 "Further Centralisation"
 ENG_further_centralisation_desc:0 "London is the beating heart of the Republic, the centre from which the revolution emanates! And yet too large parts of the economy are left to languish in the inefficiency of devolution. We must centralise the union state, only that way may we be sure that the cogs of British industry are oiled sufficiently!"
 ENG_cooperate_with_some_communists:0 "Cooperate With Some Communists"
 ENG_cooperate_with_some_communists_desc:0 "With our system being more aligned with the European communists than confederates and federationists, it is inevitable that we cooperate with certain British communist groups. Just not those directly linked to the Soviet menace."
 ENG_international_revolution:0 "International Revolution"
 ENG_international_revolution_desc:0 "Capitalists shall tremble as we spread the glorious revolution into their borders!"
 ENG_trotskys_way:0 "Trotsky's Way"
 ENG_trotskys_way_desc:0 "Socialism will never prevail without war declared upon imperialists. Always will they strive to undermine and isolate the revolution, shaking one hand will merely allow them to stab us in the back with the other. Trotsky knew the way, only through perpetual revolutionary warfare can we secure a future for the working class."
 ENG_socialism_through_peace:0 "Socialism Through Peace"
 ENG_socialism_through_peace_desc:0 "Socialism is not about war or violence. It is about uniting all humans under one banner of equality. By setting a good example, and turning swords into ploughshares, we may show the working peoples of the world that a better future is not just possible, but achievable."
 ENG_red_ireland:0 "Red Ireland"
 ENG_red_ireland_desc:0 "So long as the dollar-green banner of Capitalism flies over Dublin, the British Revolution may never be safe. Therefore, the British Isles must soon be united under one red banner."
 ENG_end_of_the_warsaw_pact:0 "End of the Warsaw Pact"
 ENG_end_of_the_warsaw_pact_desc:0 "Capitalism is merely one side of the coin, on the other side can its mirror image, Stalinism, be found. Soviet communism will be destroyed, and that degenerated workers state will be set straight, once and for all."
 ENG_crush_spain:0 "Crush Spain"
 ENG_crush_spain_desc:0 "Reactionaries have ruined Spain for countless decades, since the bitter defeat of the Republicans in the civil war. The time has come for round two, and this time, the forces of revolution shall not be held back."
 ENG_red_iceland:0 "Red Iceland"
 ENG_red_iceland_desc:0 "Whoever controls Iceland controls the Northern Atlantic. Held by our enemies, it will only be a vantage point from which to attack the homeland of the Revolution. We will not halt until the entire Arctic is united under our red banner!"
 ENG_death_to_imperialists:0 "Death to Imperialists"
 ENG_death_to_imperialists_desc:0 "We must crush our age-old enemies, the capitalist imperialists which reside in the Americas. Although the United States are gone, their ideals of repression and reaction still live on in the detestable Southern Republic as well as in Canada, the new vanguard of the Imperialist cause."
 ENG_lands_of_the_lost_empire:0 "Lands of the Lost Empire"
 ENG_lands_of_the_lost_empire_desc:0 "India and Australia have remained relatively capitalist nations, with the former only slightly aligning with socialism. While these nations know all too well of British oppression, it’s high time they learn of British Emancipation."
 ENG_cooperate_with_americans:0 "Cooperate With Americans"
 ENG_cooperate_with_americans_desc:0 "Now is the time to unite the strongest revolutionary nations. In the pre-Revolutionary era, the former United States and Britain had a special relationship. With both of us having aligned with Revolutionary Socialism, it is only obvious that this special relationship should be rekindled, so that we may stand together in the 21st century as we did in the 20th."
 ENG_socialist_science:0 "Socialist Science"
 ENG_socialist_science_desc:0 "Science means progress, and what is a revolution without progress? Without the trappings of the endless pursuit of profit, new breakthroughs will be discovered at a pace like never before!"
 ENG_continue_national_development:0 "Continue National Development"
 ENG_continue_national_development_desc:0 "Despite all that we have done for them, the economy still has a long way to go. Our people are in dire need of state intervention, to restore the prosperity that once was once abundant in Britain, but this time it will be for all the people."
 ENG_renewed_patriotism:0 "Renewed Patriotism"
 ENG_renewed_patriotism_desc:0 "All British workers will be proud to wave the flag. Not the flag of the aristocrats, who lorded over them, nor the flag of the capitalists who sent them off to die in distant wars. No, it's the people’s flag, dyed the deepest red by the blood of those who have toiled to make a better future possible, this future."
 ENG_truly_equal_society:0 "Truly Equal Society"
 ENG_truly_equal_society_desc:0 "Equality is the paramount foundation of our socialist movement. We have done away with capitalistic inequality, but we must tread carefully to avoid the pitfalls of a partocratic inequality as well. Only then can we uphold our pledge to the people."
 ENG_secure_revolutionary_nation:0 "Secure Revolutionary Nation"
 ENG_secure_revolutionary_nation_desc:0 "We shall defend our island home, whatever the cost may be. Let the worldwide whirlwinds of danger rage on, for each and every British worker will be able to sleep soundly, knowing that they’re safe from those who would do them harm."
 ENG_storm_buckingham_palace:0 "Storm Buckingham Palace"
 ENG_storm_buckingham_palace_desc:0 "Buckingham Palace is the symbol of the decrepit ruling family that has lorded over Britain for centuries. By storming Buckingham Palace, we will be able to halt any royals from interfering in our revolutionary plans. May the crowned heads tremble, for their time has come."
 ENG_execute_them:0 "Execute Them"
 ENG_execute_them_desc:0 "So long as one Windsor yet breathes, the counter revolutionaries have a potential symbol to rally around. While no doubt a ruthless decision, it is a necessary one. Shoot them all."
 ENG_exile_them:0 "Exile Them"
 ENG_exile_them_desc:0 "While the royal family is truly repulsive, our movement isn't one of barbarians. We'll send them packing to some far-flung nation never to be seen again."
 ENG_build_a_one_party_state:0 "Build a One Party State"
 ENG_build_a_one_party_state_desc:0 "With all obstacles to our revolution removed, we stand at the precipice of the next step of our revolutionary transition: One revolutionary party shall rule over all British peoples."
 ENG_state_industries:0 "State Industries"
 ENG_state_industries_desc:0 "All industry must be owned and operated by the state, with zero exceptions. British industry will be made to serve the British people, all directed by a newly established State Planning Committee, made in the Soviet image."
 ENG_indoctrination_program:0 "Indoctrination Program"
 ENG_indoctrination_program_desc:0 "Everyone shall realise the glory of Communism, and how poor their lives were before this revolution. All dissenting media will be shut down, and the BBC will be reformed to lead the charge on this grand campaign of enlightenment."
 ENG_pro_soviet_propaganda:0 "Pro-Soviet Propaganda"
 ENG_pro_soviet_propaganda_desc:0 "The Soviet Union is a force for good in this world of imperialist villains, and our state media should showcase that. Had it not been for the example set by the USSR, Britain might yet have languished beneath the boots of bourgeois faux-democracy and capitalist exploitation. We must always remember this."
 ENG_communist_ministries:0 "Communist Ministries"
 ENG_communist_ministries_desc:0 "The many ministries of Britain are powerless institutions, only given the bare minimum of power needed to ensure that the pockets of the bourgeoisie are always lined, with few regulatory powers, if any. New ministries will allow us to control the populace, for their own good, of course."
 ENG_strengthen_links_with_the_eu:0 "Strengthen Links With the EU"
 ENG_strengthen_links_with_the_eu_desc:0 "If we are to eventually join the European Union, we must first strengthen our ties with member states like France, Germany and Italy."
 ENG_join_the_eu:0 "Join the European Union"
 ENG_join_the_eu_desc:0 "Britain is stronger in the European Union. Tying ourselves to the Union will only be beneficial to the British economy, and increased connections to Europe will end the isolation the Bourgeois lackeys of the SDP imposed upon our country. The Internationale unites the human race!"
 ENG_overthrow_the_academic_elite:0 "Overthrow the Academic Elite"
 ENG_overthrow_the_academic_elite_desc:0 "With their unbreakable connections to innately reactionary institutions like Eton, the pretentious academic elite of Britain are holding back a full revolution for the British people. Even if it might hurt our scientific efforts in the short run, we must rid ourselves of their influence."
 ENG_peasants_revolution:0 "A Very British Maoism"
 ENG_peasants_revolution_desc:0 "A British revolution must be a peasant's revolution. After all, some of the first Communists in Britain were the Diggers, who fought to maintain the Common lands from the greed of the aristocracy, and so the primacy of the farmers must be upheld."
 ENG_workers_revolution:0 "Emulate the Soviet Model"
 ENG_workers_revolution_desc:0 "The working class of Britain have long been the driving force of social progress in Britain, and with the success of their revolution, more must be done to cement it. The USSR has proven the best way to developed socialism, and Georgy Malenkov has overseen the greatest period of economic development in human history. We would do well to emulate it."
 ENG_total_revolution:0 "Reject 'Popular' Revisionism"
 ENG_total_revolution_desc:0 "The socialist mission has been dilluted by reformists and revisionists alike, turning its working class mission into a vague 'feel-good' philosophy, blind to its necessary class mission. We must return the proletariat to its central place in the revolution, and disavow all petite bourgeois and rural class enemies that have been falsely embraced."
 ENG_join_warsaw_pact:0 "Join the Warsaw Pact"
 ENG_join_warsaw_pact_desc:0 "By officially allying with the Soviet Union and all Communist European nations, we will secure an international revolution for our children and theirs."
 ENG_lead_a_progressive_alliance:0 "Lead a Progressive Alliance"
 ENG_lead_a_progressive_alliance_desc:0 "Despite our dominance over the government, the CPGB does not control all aspects of civil society. There are many trade unions and regional interest groups like the SNP that still exist outside of our umbrella. Rather than dissolve them outright, we should work alongside them, and bring them into the fold."
 ENG_british_soviet_training_exercises:0 "British-Soviet Training Exercises"
 ENG_british_soviet_training_exercises_desc:0 "Military cooperation between the British Socialist Republic and the Soviet Union will allow for greater strength and cohesion between our militaries."
 ENG_soviet_investment:0 "Optimal Planning"
 ENG_soviet_investment_desc:0 "The economy needs to develop, and Soviet-style technocracy prove that the working class and intelligentsia accomplish most together. By structuring the economy in accordance with the principles of optimal planning, we can not just revive the British economy, but also integrate our economy closer with the socialist bloc."
 ENG_local_red_councils:0 "Local Red Councils"
 ENG_local_red_councils_desc:0 "By solidifying our influence in local councils, we can control the populace directly, rather than having to navigate through bureaucracy."
 ENG_scottish_peoples_state:0 "Scottish People's State"
 ENG_scottish_peoples_state_desc:0 "The Scottish people should forever feel at home in our Republic, never sidelined as a 'minority'. Their contributions towards the establishment of Socialism have been immeasurable, and to rectify this historic wrong would be the least we could do for them."
 ENG_a_united_britain:0 "A United Britain"
 ENG_a_united_britain_desc:0 "'Strong and peaceful, wise and brave. Fighting the fight for the whole world to save. We the people shall ceaselessly strive, to keep our great revolution alive.' With these words, we may always remember that we are one revolutionary nation, indivisible and stronger than ever before!"
 ENG_agriculture_focus:0 "Agriculture Focus"
 ENG_agriculture_focus_desc:0 "Britain has long been dependent on foodstuff imports to fulfill its needs. This government must focus on developing Britain's agricultural sector as soon as possible, so that we may once again fulfill our own basic needs."
 ENG_rural_conscription:0 "Rural Conscription"
 ENG_rural_conscription_desc:0 "Recruiting soldiers from the rural areas would be beneficial for a multitude of reasons. With them being at the heart of our revolution, it only makes sense that they shall hold up the sword and the shield that protects it."
 ENG_red_militias:0 "Red Militias"
 ENG_red_militias_desc:0 "Even though it may not be the most advanced army, the Red Militias of Britain shall be the proudest and most devoted of any nation. If a foe of the revolution nears, they shall be drowned beneath ferocity of our brave comrades in the Militias."
 ENG_destroy_the_four_olds:0 "Destroy the Four Olds"
 ENG_destroy_the_four_olds_desc:0 "Back in the 1960s, the Chinese government recognised four elements of their society that needed to be purged: old ideas, old culture, old customs, and old habits. We Britons have also strained under these 'Four Olds', and the time has come to build a new British culture free from the chains of our past!"
 ENG_consolidate_communist_rule:0 "Consolidate Communist Rule"
 ENG_consolidate_communist_rule_desc:0 "As Comrade Stalin once did, so have we done. Our party rules over all, with no opposition to be seen. All forces of counter-revolution have been routed, and the influence of the Party can be felt in every city square, every street, every village, the hammer and sickle flying proudly above each and every one of them."
 ENG_join_china:0 "Apply for CONEFO Membership"
 ENG_join_china_desc:0 "It is China, not the Soviet Union, that knows the true path of Communism in this modern age. Even if they may be half a globe away, it is imperative that we stand together in these trying times."
 ENG_unite_the_isles:0 "Unite the Isles"
 ENG_unite_the_isles_desc:0 "How can we call ourselves the Union of Britain if the British Isles aren't fully united under our flag? The Emerald Isle yet languishes under the yoke of Nationalism, and only we have what it takes to liberate them."
 ENG_irish_coexistance:0 "Irish Coexistence"
 ENG_irish_coexistance_desc:0 "For decades soldiers of the IRA fought for national liberation against the United Kingdom and to sought to expell imperialist presence from the Emerald Isle. We should seek to distance ourselves from the goals of the past and foster peaceful coexistence with Ireland."
 ENG_defend_our_commune:0 "Defend Our Commune"
 ENG_defend_our_commune_desc:0 "We will defend our commune from all external threats. Britain shall become an unassailable fortress in the North Sea, a bulwark of the Revolution. Shielded by our firm defences and revolutionary fervor, Britons never ever ever shall be slaves again."
 ENG_crush_all_capitalists:0 "Crush All Capitalists"
 ENG_crush_all_capitalists_desc:0 "No more peace and isolation from the world. All capitalists must be destroyed as quickly and efficiently as possible. Our armed forces shall take up their arms, and only when the last capitalist has been hanged and the last imperialist shot shall our armies lay them down again."
 ENG_further_economic_reform:0 "Further Economic Reform"
 ENG_further_economic_reform_desc:0 "We still haven't completed all of our economic reforms. In this time of national development, perhaps we have the perfect opportunity to fulfill promises."
 ENG_monitor_our_people:0 "Monitor Our People"
 ENG_monitor_our_people_desc:0 "Enough has been done to shore up our defenses against outside threats, but counter-revolutionary wreckers and saboteurs still linger at home. The already wide-ranging powers of MI6 must be expanded even further. No one is safe from the all-seeing eye of the Party."
 ENG_red_navy:0 "Red Navy"
 ENG_red_navy_desc:0 "Britain is becoming a true island fortress, one that even the most well-armed of reactionaries would fear attack. We're just missing one piece of the puzzle: A strong navy, an impenetrable steel wall guarding the British Isles. The British Red Navy will be reorganized, so it may soon make the seas run red. Britannia rules the waves!"
 ENG_war_with_spain:0 "War With Spain"
 ENG_war_with_spain_desc:0 "Spain has been a herald of reaction ever since 1939, and was one of the few European countries to avoid revolution during the 80s. A blight upon Europe, Spain must be liberated immediately."
 ENG_war_with_american_imperialists:0 "War With American Imperialists"
 ENG_war_with_american_imperialists_desc:0 "America, the bastion of capitalism shall finally be destroyed by the mighty hand of British communism."
 ENG_war_with_american_traitors:0 "War With American Traitors"
 ENG_war_with_american_traitors_desc:0 "They claim to be the true revolutionaries, communist or socialist. But everyone knows that the Commonwealth is simply a revisionist haven."
 ENG_reform_the_commonwealth:0 "Reform the Commonwealth"
 ENG_reform_the_commonwealth_desc:0 "The democracies of the world need to stand together now more than ever. The Commonwealth of Nations must return! Its dissolution decades ago was a clear mistake."
 ENG_a_new_alliance:0 "Join the Democratic League"
 ENG_a_new_alliance_desc:0 "As we have only recently broken from our isolation, the world is not yet ready for a new British-led military alliance. Canada has since taken up the mantle of Leader of the Free World, and we should join them in the defense of democracy."
 ENG_avenge_europe:0 "Avenge Europe"
 ENG_avenge_europe_desc:0 "Revenge for all the lives and pride lost. Revenge for all those suffering under the jackboot of dictatorship. Revenge for those who were displaced. Revenge for those unfairly robbed. The litany of Soviet sins is long, and revenge shall be served up for each and every one."
 ENG_invest_in_ireland:0 "Invest in Ireland"
 ENG_invest_in_ireland_desc:0 "The Protection Union is like a chain, and a chain is only as strong as its weakest link. Ireland is in dire need of some direct British investment. By strengthening the Irish economy we can strengthen the entire Protection Union."
 ENG_isolationist_foreign_policy:0 "Isolationist Foreign Policy"
 ENG_isolationist_foreign_policy_desc:0 "The British nation does not need any nation outside its isles. We should follow the Swedish example, and declare ourselves neutral. Nevermore shall sons of Britain, be they Irish, English, Scottish or Welsh, die in useless foreign entanglements."
 ENG_scientific_endeavours:0 "Scientific Endeavours"
 ENG_scientific_endeavours_desc:0 "Scientific progress is the backbone of any democratic society. Britain is home to countless universities, all churning out the Einsteins and Hawkings of tomorrow. We shall support them in this endeavour, so they may enrich our democracy with the science of tomorrow."
 ENG_soldiers_of_democracy:0 "Soldiers of Democracy"
 ENG_soldiers_of_democracy_desc:0 "British and Commonwealth soldiers will all fight for one thing... freedom. The freedom to live their lives as they please, and for others to do the same. The freedom to vote, to disagree with the government without fear of punishment. The freedom to be free, no matter who they may be."
 ENG_economic_recovery:0 "Economic Recovery"
 ENG_economic_recovery_desc:0 "Isolationism from the violence of the world will allow us to develop our economy. Funds otherwise intended for the armed forces will be put to much better use rebuilding Britain."
 ENG_create_war_council:0 "Create War Council"
 ENG_create_war_council_desc:0 "This war council will provide us with the critical intel on any potential targets, allowing us to consider all options quicker and easier. No more shall the armed forces be obstructed by political peaceniks, Britain's defense shall be the first priority of our new government!"
 ENG_restrict_trade:0 "Restrict Trade"
 ENG_restrict_trade_desc:0 "Buy British! We don't need any other nations interfering with our economy, and we certainly do not need their inferior goods clogging our shelves. Britain can do just fine on her own!"
 ENG_ultimate_power_to_the_generals:0 "Ultimate Power to the Generals"
 ENG_ultimate_power_to_the_generals_desc:0 "Previous governments have sidelined the military. However, we know the true capabilities of a strong and capable army, and how it can... pacify the people."
 ENG_fascist_fleet:0 "National Fleet"
 ENG_fascist_fleet_desc:0 "The spineless liberals and Bolsheviks who previously ruled over Britain allowed our majestic navy to rot in our ports and harbours. The British Navy which once ruled the seas will soon rule them again, under admirals with unmatched patriotism and love for our country!"
 ENG_legacy_of_mosley:0 "Legacy of Mosley"
 ENG_legacy_of_mosley_desc:0 "Mosley was a true leader for the British people, but was sadly misunderstood and politically ruined by the war with Germany. This government understands that Oswald Mosley represented all that was good with British values, and his legacy shall be a beacon of hope for our citizens."
 ENG_unite_the_nation:0 "Unite the Nation"
 ENG_unite_the_nation_desc:0 "Britain must come together for a brighter future! It matters not if you're Scottish, English, Welsh or anything else, for Britain transcends and unites us all. Anyone who thinks differently knows where the door is."
 ENG_purge_leftist_elements:0 "Purge Leftist Elements"
 ENG_purge_leftist_elements_desc:0 "We won the elections fair and square, but yet the Leftists keep up their feeble protests against our glorious rule. So much for the tolerant left. As they say, no tolerance for the intolerant, and they will learn shortly what their intolerance will bring upon them."
 ENG_new_house_of_lords:0 "New House of Lords"
 ENG_new_house_of_lords_desc:0 "A House of Lords loyal to our administration will do wonders for total consolidation of power. We will need to 'encourage' a few of the Lords to step down, and allow new faces to take their place, but surely they will be more than grateful to be able to serve Britain well that way."
 ENG_referendum_in_ulster:0 "Referendum in Ulster"
 ENG_referendum_in_ulster_desc:0 "Ulster is rightfully territory of the British state, but we'll give them the opportunity for a peaceful solution to this pressing issue. No need doing with steel what can be done through intimidation"
 ENG_atlantic_supremacy:0 "Atlantic Supremacy"
 ENG_atlantic_supremacy_desc:0 "This ocean belongs to us. The Atlantic must be made a British lake again, and the Union Jack must wave above each and every single one of her islands, as is our right."
 ENG_crush_communists:0 "Crush Communists"
 ENG_crush_communists_desc:0 "This continent belongs to us. Europe has been defiled by Communist degeneracy, and as Britain lords over the sea, so must she lord over the Continent, and wipe it clean of all signs of Communism. Only then will Britain retake her place as the premier world power."
 ENG_eyes_and_ears:0 "Eyes and Ears"
 ENG_eyes_and_ears_desc:0 "Nothing can be kept secret from the State. We shall remind this country of exactly that. That terrorists, wherever they may hide, may never be safe. That degenerates, no matter how secretive they consider themselves, will always be found. Brasier is always watching, always listening."
 ENG_purge_scottish_rebels:0 "Purge Scottish Rebels"
 ENG_purge_scottish_rebels_desc:0 "While we could never have expected a peaceful settlement to the 'Scotland issue', the army could just purge all rebels from the region and do away with their dissident movement."
 ENG_repudiate_normanism:0 "Repudiate Normanism"
 ENG_repudiate_normanism_desc:0 "The English have nothing at all in common with the French. Their culture is inferior to ours in every way. Despite this, the old 'Norman' kings of centuries past attempted to pervert our culture with their foreign ways. At long last, we will purge all traces of 'Normanism' from ourselves, and ensure a pure English culture will be passed down to our children."
 ENG_occupy_northern_ireland:0 "Occupy Northern Ireland"
 ENG_occupy_northern_ireland_desc:0 "We will crush the arrogant Ulster government, and the Irish if it comes down to it. Britain Prevails!"
 ENG_industrial_isles:0 "Industrial Isles"
 ENG_industrial_isles_desc:0 "Britain is an industrious nation and shall stay that way for centuries to come. All the world shall come to envy our incredible productive machinery, producing quality goods in quantities hitherto unseen."
 ENG_reclaim_normandy:0 "Reclaim Normandy"
 ENG_reclaim_normandy_desc:0 "Normandy is rightful land of England and hence the British state. Those French pests don't deserve such territories under their control. As William the Conquerer once crossed the Channel to conquer England, likewise shall Brasier cross the Channel to reclaim the homeland of William."
 ENG_anti_air_installations:0 "Anti-Air Installations"
 ENG_anti_air_installations_desc:0 "All the many seas surrounding Britain is no defense against an airborne assault. While brave British airmen before have kept our nation safe, they will need all the help they can get, come a new war. We should install SAM-sites across our country to give them the aid they need."
 ENG_further_air_defence:0 "Further Air Defence"
 ENG_further_air_defence_desc:0 "The more technology progresses, the more range aircraft will get. Not even distance from the European mainland will keep Scotland safe, and so they deserve protection from above as well."
 ENG_british_drones:0 "British Drones"
 ENG_british_drones_desc:0 "Unmanned vehicles present many opportunities for our air force. The ability to assault enemy positions and facilities without risking any British lives is one we would readily acquire. A new generation of Unmanned Aerial Vehicles must be developed, and Britain must be on the forefront of this charge."
 ENG_join_the_new_internationale:0 "Join the New Internationale"
 ENG_join_the_new_internationale_desc:0 "Fortunately, we are not the only leftists who refuse the tyranny of the Warsaw Pact. An alliance of true socialists has recently been created, and we would do well to join them."
 ENG_second_british_technical_and_scientific_mission:0 "Second British Technical and Scientific Mission"
 ENG_second_british_technical_and_scientific_mission_desc:0 "In the darkest days of World War II, our brightest minds cooperated with the Americans to develop technology to help fight the Nazis, culminating in the development of radar. With looming threats near our shores once again, we must seek every technological advantage we can get."
 ENG_cooperate_on_atlantic_security:0 "Cooperate on Atlantic Security"
 ENG_cooperate_on_atlantic_security_desc:0 "Keeping the Atlantic Ocean open is perhaps our most vital strategic goal, else we may be cut off from the rest of our allies. Working with the rest of our allies, we can keep the Atlantic secure from any threat."
 ENG_support_the_legitimate_government:0 "Support the Legitimate Government"
 ENG_support_the_legitimate_government_desc:0 "The time has come for America to unite under the banner of socialism! We must do everything in our power to support the American People's Commonwealth in their quest of unification."
 ENG_join_conefo:0 "Join CONEFO"
 ENG_join_conefo_desc:0 "China is a shining example to the rest of the world of the might of the peasantry. They and Indonesia have formed an alliance of like-minded nations, and we would be wise to join them."
 ENG_building_a_new_power_bloc:0 "Building a New Power Bloc"
 ENG_building_a_new_power_bloc_desc:0 "Though our Chinese ally may be mighty, they are also half a world away. We must strengthen our own position and become the beacon of Maoism in the Western Hemisphere."
 ENG_finding_european_allies:0 "Finding European Allies"
 ENG_finding_european_allies_desc:0 "Aside from a few scattered liberation movements like the Red Army Faction, Maoism has never truly taken root in Europe. Still, we must reach out to whatever allies we can find if we hope to build a credible alternative to the Warsaw Pact."
 ENG_reconcile_with_former_colonies:0 "Reconcile with Former Colonies"
 ENG_reconcile_with_former_colonies_desc:0 "Truly the British Empire is a mark of shame upon our people. Even after its collapse in the 20th century, our former colonies have suffered immensely from poverty and political meddling from the West. We must strive to make amends, and, if we're lucky, make new friends with our old subjects."
 ENG_shake_hands_with_the_warsaw_pact:0 "Shake Hands with the Warsaw Pact"
 ENG_shake_hands_with_the_warsaw_pact_desc:0 "There is no greater force for the liberation of mankind than the Warsaw Pact. At long last, we shall join our European brothers to secure the revolution!"
 ENG_anglo_european_training_exercises:0 "Anglo-European Training Exercises"
 ENG_anglo_european_training_exercises_desc:0 "With the old government's retreat into isolationism back in the 1980s, our military doctrines have become stagnant and outdated. We will seek joint training exercises with our allies, and prepare for the final conflict."
 ENG_seek_warsaw_pact_investment:0 "Seek Warsaw Pact Investment"
 ENG_seek_warsaw_pact_investment_desc:0 "Though our economy has recovered somewhat from the turmoil of the preceding decades, we are always looking for new investments to grow our industry. We will once again become the Workshop of the World!"
 ENG_the_number_one_airstrip_of_europe:0 "The Number One Airstrip of Europe"
 ENG_the_number_one_airstrip_of_europe_desc:0 "Should the worst come to pass and bombers fly over Europe once again, we will be ready."
 ENG_join_the_democratic_league:0 "Join the Democratic League"
 ENG_join_the_democratic_league_desc:0 "Despite everything, democracy prevails in [ENG.GetNameDef]! However, we must admit that we are in no position to declare ourselves the leader of the free world, at least for now. Let us join forces with our favorite son, and defend democracy together!"
 ENG_joint_atlantic_naval_exercises:0 "Joint Atlantic Naval Exercises"
 ENG_joint_atlantic_naval_exercises_desc:0 "In days past, we worked alongside the Americans to defend the Atlantic from any external threat. Now we must work with Canada to continue doing the same."
 ENG_new_arsenal_of_democracy:0 "New Arsenal of Democracy"
 ENG_new_arsenal_of_democracy_desc:0 "Canada's economy has seen incredible growth since the collapse of the old United States, but they are still far behind the industrial might of Moscow or Berlin. With Canadian investment, let us jumpstart our economy so we may once again be the Workshop of the World!"
 ENG_restore_the_russian_alliance:0 "Restore the Russian Alliance"
 ENG_restore_the_russian_alliance_desc:0 "Against all odds, the heartland of Communism has liberated itself! They are building a new alliance to combat the epidemic of socialism in Europe, and we shall join them in their noble quest."
 ENG_russian_army_advisors:0 "Russian Army Advisors"
 ENG_russian_army_advisors_desc:0 "Nobody in the world has more experience with land combat than the Russians. Let us invite their foremost experts in warfare and modernize our army for when the time comes."
 ENG_russias_unsinkable_aircraft_carrier:0 "Russia's Unsinkable Aircraft Carrier"
 ENG_russias_unsinkable_aircraft_carrier_desc:0 "While Russia holds land dominance in the east, we shall hold air dominance in the west. Every mile of our isle will become an airstrip if that's what it takes!"
 ENG_reform_the_western_union:0 "Reform the Western Union"
 ENG_reform_the_western_union_desc:0 "Unfortunately for us, there are no alliances with whom we have common cause. No matter, we shall simply make our own. The British are back on the world stage, this time to stay!"
 ENG_seek_scandinavian_allies:0 "Seek Scandinavian Allies"
 ENG_seek_scandinavian_allies_desc:0 "Though most of Europe had fallen under the banner of the Warsaw Pact, Scandinavia remained independent. Let's see if we can bring some of them over to our side."
 ENG_align_with_morocco:0 "Align with Morocco"
 ENG_align_with_morocco_desc:0 "While we are able to effectively project power over the North Atlantic, a lack of southern ports prevents us from projecting power over the South Atlantic. If Morocco were on our side, though, we could use their ports to secure our interests."
 ENG_bring_over_australia:0 "Bring Over Australia"
 ENG_bring_over_australia_desc:0 "If our new alliance is to project global power, we need allies in the Pacific. Though their history over the past few decades has been frought, we should see if their goals align with our own."
 ENG_renew_historys_oldest_alliance:0 "Renew History's Oldest Alliance"
 ENG_renew_historys_oldest_alliance_desc:0 "Signed in 1386, the Treaty of Windsor is the oldest bilateral alliance treaty still in force today. Though Portugal left NATO in the 1970s, this treaty was never formally abandoned, and maybe we can convince Portugal to honour it once again."
 ENG_reconnect_with_south_africa:0 "Reconnect with South Africa"
 ENG_reconnect_with_south_africa_desc:0 "Diplomatically isolated since the end of the Cold War, South Africa is in a unique geopolitical position. Fortunately for them, our desire to secure the Cape of Good Hope could make for a beneficial agreement for both sides."
 ENG_make_amends_with_iran:0 "Make Amends with Iran"
 ENG_make_amends_with_iran_desc:0 "Our history with Iran over the past couple centuries has been... complicated. Still, we can provide them with protection against Soviet influence, and they can provide us with valuable ports to project power throughout the Arabian Sea. Maybe we can let bygones be bygones?"
 ENG_invest_in_the_emerald_isle:0 "Invest in the Emerald Isle"
 ENG_invest_in_the_emerald_isle_desc:0 "Our Irish friends have not seen the same economic recovery we have had over the past few years. Let us invest in them, so we can secure both of our economies."
 ENG_integrate_our_training_programs:0 "Integrate Our Training Programs"
 ENG_integrate_our_training_programs_desc:0 "A chain is only as strong as its weakest link. Though we have been able to upscale our military to safeguard against threats in Europe, Ireland is lagging behind, both in personnel and training. We will integrate our training programs, and prepare Ireland against any threats."
 ENG_coordinate_our_naval_forces:0 "Coordinate Our Naval Forces"
 ENG_coordinate_our_naval_forces_desc:0 "Our navies are perhaps our greatest deterrent to threats from the European mainland, but a miscommunication between us and Ireland could lead to misallocated fleet power or even friendly fire incidents. We shall set up a joint commission to coordinate our naval forces and protect us both from any threats across the Channel or across the Atlantic."
 ENG_strengthen_trade_with_ireland:0 "Strengthen Trade with Ireland"
 ENG_strengthen_trade_with_ireland_desc:0 "The unfortunate reality of isolationism is that many foreign markets remain closed to us. Fortunately, we have our reliable friends in Ireland who will happily buy our goods."
 ENG_integrate_our_security_services:0 "Integrate Our Security Services"
 ENG_integrate_our_security_services_desc:0 "During World War II, one of the largest fears of having a neutral Ireland was that German spies may sneak into Britain through the Northern Irish border. Almost a century later, spies and criminals are able to evade justice through the same border. Let us work with the Irish to set up a joint security service, so that none can escape the law."
 ENG_splendid_isolation_in_the_british_isles:0 "Splendid Isolation in the British Isles"
 ENG_splendid_isolation_in_the_british_isles_desc:0 "In the end, foreign entanglements have only served to hurt Britain. Hundreds of thousands dead against Napoleon, the Kaiser, the Nazis, and for what? Our empire collapsed and Communism conquered Europe. No more will we extend our hands towards an ungrateful world. We will remain on these fair isles, now and forever."
 ENG_restore_pax_britannica:0 "Restore Pax Britannica"
 ENG_restore_pax_britannica_desc:0 "Once, when we were the most powerful empire in modern history, we were able to define the world order at our whim. Those days are long gone, for better or worse, but we Brits remain, and the time has come to decide our place in this rapidly-changing world."
 ENG_a_truly_red_british_isles:0 "A Truly Red British Isles"
 ENG_a_truly_red_british_isles_desc:0 "It seemed impossible, but at last Britain is truly in the hands of the people! However, to our west, Ireland remains in the grasp of capitalism. We must decide how to proceed with this state of affairs before we continue to look outwards."
 ENG_world_revolution:0 "World Revolution"
 ENG_world_revolution_desc:0 "There can be no 'peaceful coexistence' with enemies of the revolution. Capitalism, Imperialism, and Revisionism must be torn down with force!"
 ENG_topple_atlantas_puppet:0 "Topple Atlanta's Puppet"
 ENG_topple_atlantas_puppet_desc:0 "Even after collapse, the old American government still finds time to enforce its will on the weak. Iceland's socialist movement was strangled in its cradle by Donald Rumsfeld, but we will crush their little puppet government."
 ENG_secure_scandinavia:0 "Secure Scandinavia"
 ENG_secure_scandinavia_desc:0 "We are not the only ones with an interest in the North Sea. Scandinavia maintains a strong presence in the region, but unlike Iceland, they may be more amenable to 'diplomacy.'"
 ENG_the_last_bastion_of_imperialism:0 "The Last Bastion of Imperialism"
 ENG_the_last_bastion_of_imperialism_desc:0 "Despite everything, Spain managed to hold back the tide of socialism, with their 'king' hiding in his royal palace while workers bled in the street. Worse still, they remain in a position to threaten our people in Gibraltar. The time has come to liberate Spain from their oppressors!"
 ENG_crush_american_imperialism:0 "Crush American Imperialism"
 ENG_crush_american_imperialism_desc:0 "As long as the Remnants remain, the revolution will always be under threat. The time has come to crush them, once and for all!"
 ENG_crush_american_revisionism:0 "Crush American Revisionism"
 ENG_crush_american_revisionism_desc:0 "Were it not for Harrington, Chomsky, Sanders, and the rest, all of the old United States may have already been liberated by now. On behalf of all true Communists, we shall destroy these Revisionists!"
 ENG_spread_the_revolution_to_the_commonwealth:0 "Spread the Revolution to the Commonwealth"
 ENG_spread_the_revolution_to_the_commonwealth_desc:0 "Though the Commonwealth of Nations was dissolved decades ago, we still have ties to our former colonies, and we bear responsibility for the poverty and corruption that have plagued them since decolonisation. Now we have the opportunity to make amends, and help the people of these nations restore their sovereignty."
 ENG_crush_the_last_vestige_of_reaction:0 "Crush the Last Vestige of Reaction"
 ENG_crush_the_last_vestige_of_reaction_desc:0 "The collapse of the Soviet Union was perhaps the greatest shock of the 21st century so far. In its place, Russia has become a bastion for reactionary movements across the globe. We must put an end to this madness."
 ENG_end_the_soviet_empire:0 "End the Soviet Empire"
 ENG_end_the_soviet_empire_desc:0 "It is truly shameful to have seen the Warsaw Pact claim the mantle of World Revolution. In truth, they only replaced capitalist tyranny with their own. Whether led from Moscow, Berlin, Rome, or Paris, this farce of an organization cannot be allowed to exist any longer!"
 ENG_splendid_coexistence:0 "Splendid Coexistence"
 ENG_splendid_coexistence_desc:0 "We may have our disagreements with other socialist countries, but we are more alike than we are different. Let us make friends, not enemies."
 ENG_trade_with_the_world:0 "Trade with the World"
 ENG_trade_with_the_world_desc:0 "Once, we were known as the Workshop of the World. Back then, the workers received very few benefits to this state of affairs, but now that the workers are in control of the means of production, we can all benefit from increased trade."
 ENG_support_the_red_cross:0 "Support the Red Cross"
 ENG_support_the_red_cross_desc:0 "The International Red Cross and Red Crescent Movement is perhaps the most noble organisation in the world. We must support their mission to provide support to the world's poorest and neediest."
 ENG_international_aid:0 "International Aid"
 ENG_international_aid_desc:0 "Supporting a single organisation is not enough. We must reach out directly to the people who need help the most, and uplift the workers of the world!"
 ENG_a_new_commonwealth:0 "A New Commonwealth"
 ENG_a_new_commonwealth_desc:0 "We are not like the nationalistic reactionaries of old. We believe firmly that anyone can be British, and as such we will open our arms to the refugees of the world."
 ENG_peace_in_the_middle_east:0 "Peace in the Middle East"
 ENG_peace_in_the_middle_east_desc:0 "The Sykes-Picot Agreement is one of our most shameful imperialist actions, carving into existence puppet countries in the Middle East with no regard for ethnic, cultural, or religious boundaries, leading to a century of conflict. Let us intervene to prevent more needless spilling of blood."
 ENG_bastion_of_european_democracy:0 "Bastion of European Democracy"
 ENG_bastion_of_european_democracy_desc:0 "Despite it all, democracy remains a core British value. No matter what fate befalls the rest of Europe, we will always uphold the will of the people."
 ENG_support_iceland:0 "Support Iceland"
 ENG_support_iceland_desc:0 "Though the coup in Iceland was less than ideal, they can still be a valuable partner in defending the North Sea. Let us reach out to them, and give them some support, hopefully this time without another Cod War."
 ENG_friends_in_the_north_atlantic:0 "Friends in the North Atlantic"
 ENG_friends_in_the_north_atlantic_desc:0 "Greenland and the Faroe Islands are in a unique position, given much more autonomy within the Danish Realm than they had in decades prior. Though of course formal diplomatic relations will stay strictly with Copenhagen, let us try to make friends with these local governments."
 ENG_trade_with_democracies:0 "Trade with Democracies"
 ENG_trade_with_democracies_desc:0 "Liberal democracy has had many setbacks over the past few decades, true, but democracy is not dead yet! Opening trade relations with our democratic brethren will bring economic prosperity to us all."
 ENG_grow_londons_financial_district:0 "Grow London's Financial District"
 ENG_grow_londons_financial_district_desc:0 "With New York City under socialist control for decades, London once again became the finance capital of the world. We should strive to push our success even further, and become a true economic hegemon!"
 ENG_rejuvenate_the_lifeblood_of_nations:0 "Rejuvenate the Lifeblood of Nations"
 ENG_rejuvenate_the_lifeblood_of_nations_desc:0 "Through trade, we enrich ourselves and we enrich our partners. Our long period of isolation caused a steep decline in exports, but with our new outlook we can reestablish economic ties with the world."
 ENG_new_expeditionary_forces:0 "New Expeditionary Forces"
 ENG_new_expeditionary_forces_desc:0 "During the earliest days of the Battle of France, we sent 400,000 men to aid the French in their fight against fascism. Now, with conflicts breaking out around the world, we once again have the opportunity to intervene on behalf of the Free World. Let us revive the spirit of the British Expeditionary Force, and protect democracy across the world!"
 ENG_promote_democracy_in_africa:0 "Promote Democracy in Africa"
 ENG_promote_democracy_in_africa_desc:0 "The 20th century was not kind to Africa. Though many nations and many peoples were freed from colonialism, that does not mean they all established free and democratic societies. We must do what we can to promote democracy in Africa; it's only fair for what we've all done to them in the past."
 ENG_a_new_naval_arms_race:0 "A New Naval Arms Race"
 ENG_a_new_naval_arms_race_desc:0 "Two hundred years ago, our navy was so dominant that we were able to effectively match the entire rest of Europe, keeping Napoleon and his thugs off our shores. Those days are gone now, but with war on the horizon, we must ensure that no matter what, Brittania rules the waves!"
 ENG_defend_the_channel:0 "Defend the Channel"
 ENG_defend_the_channel_desc:0 "Only 21 miles off the coast of Dover lies Europe. Should the worst come to pass and our enemies control Calais, we must do everything to keep the Channel under our control."
 ENG_might_makes_right:0 "Might Makes Right"
 ENG_might_makes_right_desc:0 "Our cowardly predecessors had made us weak. If the Reds decided to invade, we may not even be able to defend our own shores! We will not be beaten, by anyone. We will be strong."
 ENG_seize_danish_territories:0 "Seize Danish Territories"
 ENG_seize_danish_territories_desc:0 "The so-called 'Danish Realm' is pathetic, barely holding any sovereignty over their colonies in Greenland and the Faroe Islands. They are ours for the taking."
 ENG_reinforce_gibraltar:0 "Reinforce Gibraltar"
 ENG_reinforce_gibraltar_desc:0 "Spain's stability under Franco was admirable, but Spanish desires for our precious Gibraltar have always kept us wary of each other. We will not take any risks, we must turn the Rock into a veritable fortress."
 ENG_a_play_for_the_mediterranean:0 "A Play for the Mediterranean"
 ENG_a_play_for_the_mediterranean_desc:0 "We may have one secure entrance to the Mediterranean with Gibraltar, and our bases in Cyprus, but we've lost our dominance over that region decades ago. Now, though, we have an opportunity to regain our foothold. Malta and the Suez will be ours once again!"
 ENG_prepare_for_a_second_blitz:0 "Prepare for a Second Blitz"
 ENG_prepare_for_a_second_blitz_desc:0 "Nobody knows the horrors of terror bombing better than us. Even as our cities were turned to rubble, we learned to Keep Calm and Carry On. With war looming, we must take these words to heart once again, and do everything in our power to protect our people."
 ENG_prepare_to_land_in_europe:0 "Prepare to Land in Europe"
 ENG_prepare_to_land_in_europe_desc:0 "70 years ago, we engaged in the largest naval invasion in the history of mankind. Millions of people died in that horrible war, and millions more will die in the next. But we will do our duty, with a stiff upper lip, as we've always done."
 ENG_very_well_alone:0 "Very Well, Alone"
 ENG_very_well_alone_desc:0 "We have no interest beyond our rightful borders. Britain is our only home, and Britain will be eternal."
 ENG_aim_for_autarky:0 "Aim for Autarky"
 ENG_aim_for_autarky_desc:0 "Anything the rest of the world may make, we can make better. Anything we cannot make, well they weren't that important anyway."
 ENG_the_black_spot_of_europe:0 "The Black Spot of Europe"
 ENG_the_black_spot_of_europe_desc:0 "Every morsel of information that enters or leaves our Britain is a potential threat. We will monitor it all, and anything the world or our people do not need to know, will not be known."


###National Spirits###
 idea_de_industrialised_nation:0 "Deindustrialized Kingdom"
 idea_de_industrialised_nation_desc:0 "The United Kingdom, once deemed the Workshop of the World, is no longer a major producer of much of anything. The depletion of cheap, accessible coal, the retreat from global trade, the loss of foreign investments, and a high foreign debt have all served to ground the former workshop to a halt. Across the nation, factories are shuttered, shops struggle to make ends meet, and not even the once-world-leading financial sector has weathered the economic decline particularly well. All that is left is a nation that is increasingly run-down and destitute, kept afloat by high public expenditure and what companies are able to make a living from a market largely limited to the British Isles. Although the British people are taking it with their trademark stiff upper lip, it is clear to everyone that at this point, things can only get better."
 idea_britain_defence_of_the_realm_act_of_1997:0 "Defence of the Realm Act of 1997"
 idea_britain_defence_of_the_realm_act_of_1997_desc:0 "Formulated in response to the wave of extremist terrorism in the nineties, the Defence of the Realm Act has built a comprehensive security apparatus to safeguard the British public. With widespread public surveillance, an empowered constabulatory, and a security apparatus wary of radical political forces, David Owen has managed to bring the crisis to heel. The cost has been, according to its critics, the largest assault on civil liberties in recent history, with persistent criticism from both the Liberal and Labour Parties. To the British public, this latest instance of the Defence of the Realm Act is certainly seeming less and less relevant, as the spectre of political violence is receding further into the background."
 idea_de_industrialised_nation_tory:0 "Deindustrialized Kingdom"
 idea_de_industrialised_nation_tory_desc:0 "The United Kingdom, once deemed the Workshop of the World, is no longer a major producer of much of anything. The depletion of cheap, accessible coal, the retreat from global trade, the loss of foreign investments, and a high foreign debt have all served to ground the former workshop to a halt. Across the nation, factories are shuttered, shops struggle to make ends meet, and not even the once-world-leading financial sector has weathered the economic decline particularly well. All that is left is a nation that is increasingly run-down and destitute, kept afloat by high public expenditure and what companies are able to make a living from a market largely limited to the British Isles. Although the British people are taking it with their trademark stiff upper lip, it is clear to everyone that at this point, things can only get better."
 idea_de_industrialised_nation_one_nation:0 "Deindustrialized Kingdom"
 idea_de_industrialised_nation_one_nation_desc:0 "The United Kingdom, once deemed the Workshop of the World, is no longer a major producer of much of anything. The depletion of cheap, accessible coal, the retreat from global trade, the loss of foreign investments, and a high foreign debt have all served to ground the former workshop to a halt. Across the nation, factories are shuttered, shops struggle to make ends meet, and not even the once-world-leading financial sector has weathered the economic decline particularly well. All that is left is a nation that is increasingly run-down and destitute, kept afloat by high public expenditure and what companies are able to make a living from a market largely limited to the British Isles. Although the British people are taking it with their trademark stiff upper lip, it is clear to everyone that at this point, things can only get better."
