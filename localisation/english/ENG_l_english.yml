###Party Names###
 ENG_tory_socdem_union_long:0 "Democratic Party - Left Wing\n§LThe §HDemocratic Party§! is a big tent political party formed as a union of the §HSocial Democratic Party§! with the §HConservative Party§!. Considered to be the "natural party of government", the §HDemocratic Party§! attempts to court voters from across the political spectrum to maintain its dominance over Parliament.\n\nThough the SDP-Tory merger was in theory an equal merger of two equivalent parties, the center-left of the party, composed of former SDP members, has taken a dominant role. Continuing their support for a social market economy, devolution, and a strong welfare state, the bulwark of the §HDemocratic Party§! has cemented its position as the mainstream of British politics.§!"
 ENG_tory_socdem_union:0 "Democratic Party - Left"
 ENG_tory_socdem_union_national_long:0 "Democratic Party - National Wing\n§LThe §HDemocratic Party§! is a big tent political party formed as a union of the §HSocial Democratic Party§! with the §HConservative Party§!. Considered to be the "natural party of government", the §HDemocratic Party§! attempts to court voters from across the political spectrum to maintain its dominance over Parliament.\n\nThough many of the former Tories maintain their stance among the center-right, a few have reformed leftwards on economic issues to better match the prevailing consensus among voters. These §HNationals§! remain socially conservative while supporting the social market economy as defined by the former SDP.§!"
 ENG_tory_socdem_union_national:0 "Democratic Party - Nationals"
 ENG_tory_socdem_union_natcon_long:0 "Democratic Party - Dry Faction\n§LThe §HDemocratic Party§! is a big tent political party formed as a union of the §HSocial Democratic Party§! with the §HConservative Party§!. Considered to be the "natural party of government", the §HDemocratic Party§! attempts to court voters from across the political spectrum to maintain its dominance over Parliament.\n\nThe §HDry Faction§! of the former §HConservative Party§! has perhaps been the faction most impacted by the merger, as the pivot to the center has limited their influence in Parliament. The farthest right of the §HDry Faction§! supporters have defected to the opposition, but the vast majority are still willing to work within the §HDemocratic Party§! in an attempt to realign the party from center-left to center-right.§!"
 ENG_tory_socdem_union_natcon:0 "Democratic Party - Dry Faction"
 ENG_tory_socdem_union_centrist_long:0 "Democratic Party - One-Nation\n§LThe §HDemocratic Party§! is a big tent political party formed as a union of the §HSocial Democratic Party§! with the §HConservative Party§!. Considered to be the "natural party of government", the §HDemocratic Party§! attempts to court voters from across the political spectrum to maintain its dominance over Parliament.\n\nThe §HOne Nation§! faction of the former §HConservative Party§! were the most in favor of the merger with the §HSocial Democratic Party§!, seeing many similarities in their support for class-collaborationism and tough-on-crime policies. Despite their effective role as junior partners in the big tent that is the §HDemocratic Party§!, the §HOne Nation§! supporters have been given new hope as a vital piece of the coalition of the democratic center.§!"
 ENG_tory_socdem_union_centrist:0 "Democratic Party - One Nation"
 ENG_galloway_party_natbol_long:0 "Workers' Party of Great Britain\n§LThe §HWorkers' Party§! is a socially conservative socialist party formed by §HGeorge Galloway§! in the aftermath of being removed as Chairman of the §HLabour Party§!. Largely seen as a vehicle for Galloway's own opposition to the party that removed him, the §HWorkers' Party§! has been marginalized due to the constitutional enshrinement of the §HLabour Party§! as the sole party of government.§!"
 ENG_galloway_party_natbol:0 "Workers' Party"
 ENG_phonix_fylking_long:0 "Phønix Fylking\n§LThe §HPhønix Fylking§! is a newcomer in British shirecraft, shaped from the downfall of the §HConservative Gathering§! sithe its landslide sye in 2010. Led by radical firebrand §HTheresa Brasier§!, the Fylking looks to reshape Britain in its own look alike, one of English sheerness and hardline isolationism.§!"
 ENG_phonix_fylking:0 "Phønix Fylking"

