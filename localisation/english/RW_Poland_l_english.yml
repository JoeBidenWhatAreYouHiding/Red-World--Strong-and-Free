 rw_poland.1.t:0 "Death of the General"
 rw_poland.1.d:0 "All of Poland has been brought to a standstill today as the news many were awaiting for decades has finally arrived, Wojciech Witold Jaruzelski has passed from this world. Born on the 6th of January 1923 in the town of Kurowo to a family of landowners, Wojciech’s early life would not have shown any signs of where he would end up in the future. Attending a religious school, he would be taught in the spirit of Catholic religiosity and National Democratic ideals, as well as participating in the scout movement which directly claimed the legacy of those that fought against the Bolsheviks in 1920.\n\nWith the outbreak of the Second World War, his family was forced to flee and eventually ended up in Lithuania, from where they were deported to Siberia by the Soviet authorities. After the formation of the nascent and subservient Polish forces in the East, Jaruzelski would train as an officer and move Westwards with the Polish People's Army. Following the end of the war, the future First Secretary would climb through the ranks of both the party and the military, ultimately finding himself as the commander of their combined forces by the time Grigory Romanov of the Soviet Union died and the internal situation in Poland reached a boiling point.\n\nBeing the architect of the Martial Law, General Jaruzelski has been responsible for saving Poland from anarchy and the bloodshed resulting from the inevitable Soviet intervention, at least according to the party’s line. There are many, most of them ordinary Poles, who hold nothing but utmost disdain towards the ‘Butcher of Autumn 1993’. Although the repressions ended by 1998, and Wojciech gave up nearly all of his power by 2005 in favor of a restored civilian government headed by the trusted General Kiszczak, his legacy could still be felt to this day.\n\nAs the ailing state is preparing to bury its architect at the Powązki Military Cemetery, with the funeral expected to be a volatile flashpoint if not handled correctly, many are wondering how long will everything established by Jaruzelski manage to last. Many members of the infamous Military Council of National Salvation are rapidly on their way out from this realm, Patriotic Movement for National Rebirth is barely able to hold onto the political scene, and the socio-economic situation is not getting any better. Something will have to change sooner rather than later."
 rw_poland.1.o1:0 "An end of an era."

 rw_poland.2.t:0 "The Successor to Kiszczak"
 rw_poland.2.d:0 "A year after Poles were mourning, or celebrating, the passing of General Jaruzelski the Polish United Workers’ Party has taken yet another blow. Czesław Kiszczak, the co-architect of the Martial Law and the inheritor of the government left by Wojciech Jaruzelski, has passed away at the age of 90. Although a military man, he was nonetheless overseeing a civilian government which is now tasked with choosing someone to stop the bleeding of the Socialist system and bold enough to rebuild Poland from the ashes of the past.\n\nThe clearest choice according to most party members would be one of the politicians who already grew up after the People’s Republic was established, and while not the youngest now they are still sharp mentally and worked tirelessly through various youth, students, and other organizations to arrive at the position they find themselves in. The first of the suggested trio is Leszek Miller, a close associate of Mieczysław Rakowski - one of the most prominent reformists within our system until his death in 2008, who advocated for some liberalization while preserving the primacy of the party and implementing economic reforms inspired by Rezső Nyers in Hungary. The second is Aleksander Kwaśniewski, emerging through various international tours and interest in new technologies to lead the ‘July 8 Initiative’ - a movement aiming to promote the transformation of the Polish system into a system of diversified trade unions and quasi-councils combined with more freedoms. The last, and youngest, is Włodzimierz Czarzasty - a man whom many have described as the embodiment of the perseverance of the Communist system in its purely bureaucratic, ‘floating along’ form.\n\nThere are some in the wider Patriotic Movement for National Rebirth that are not satisfied with the former possibilities, and have instead suggested two more ‘outlandish’ candidates. The less controversial one, surprisingly, is Tadeusz Makarewicz. As one of the few remaining members of the Military Council of National Salvation, his selection would satisfy the hardheads in the army, even if the Colonel would be more willing to drift towards the technocratic orthodoxy of Malenkovism after his somewhat disappointing diplomatic stint in Bulgaria following Jaruzelski’s reshuffling. While Makarewicz has been mostly concerned with veteran affairs over the past years, the more controversial candidate was busy building her political position by meeting with various radicals. Monika Jaruzelska, the daughter of Wojciech, is seen by some as the only chance to preserve a genuinely Stalinist status quo in the age which has left such ideas behind, not to mention to defend the legacy of General Jaruzelski."
 rw_poland.2.o1:0 "Only Rakowskite reforms can rescue us! Congratulate Miller." #Goulash Communism
 rw_poland.2.o2:0 "Ole Olek! Kwaśniewski for new vigor." #Marxism-Humanism
 rw_poland.2.o3:0 "Comrade Włodek will save us! Czarzasty it is." #Establishment Communism 
 rw_poland.2.o4:0 "Colonel Makarewicz moves us to Soviet orthodoxy!" #Malenkovism
 rw_poland.2.o5:0 "We shall defend the General’s legacy, with Comrade Lady Jaruzelska!" #Stalinism