 ##########################
 
  mexico.2.t:0 "The Ladder of Chaos"
  mexico.2.d:0 "The war in Texas has caused fuel prices to spike and have sent columns of refugees Southwards seeking shelter. President [MEX.GetLeader], in the last few years of their term, is being called to act as chaos ravages the country. The Texan War has thrown our North Regions, which are already unstable, into complete chaos. Drug Cartels are using this chaos to their advantage, staking their claim in the North of the Country and directly challenging the Federal Government as our authority in the region further wanes. This makes the latest of a series of escalations that has pitted the Government against the Cartels in direct battle for the first time in years. The question on everyone's minds is if the Federal Government will try to stop them this time, or just let sleeping dogs lie once more."
  mexico.2.o1:0 "Decisive action is needed, and it's needed now."
  mexico.2.o2:0 "We must remain careful."
  
  mexico.3.t:0 "Cartels Begin Resistance Campaign"
  mexico.3.d:0 "The efforts at retaking control of our Northern Border from the Cartels have thus far not gone the way the Government would have hoped. The highly-entrenched Sinaloa Cartel, with deep connections to the Political and Military elite, are holding their ground as the area around Texas further slides into complete chaos. There still remains an opportunity to cut them off, with an ingenious proposal being to simply foist the Cartel Problem on our Northern neighbors, particularly Texas which is already in chaos and collapsing from an American invasion."
  mexico.3.o1:0 "The time has come to teach the Government a lesson..."
  mexico.3.o2:0 "The time has come to abandon the sinking ship that is Mexico..."
  
  mexico.4.t:0 "The Día de la Sangre Derramada"
  mexico.4.d:0 "Having grown tired of interference from the Federal Government, a wide array of Cartel forces have temporarily banded together to send a message. Federal Forces were quickly overwhelmed as troops from the various Cartels advanced on Mexico City. What then transpired was one of the most horrific events in the history of the nation, as a day-long spree of violence and looting engulfed the Metroplex. The President was not able to be evacuated in time, and was assassinated swiftly, leaving the leadership of the current Government unclear. The Federal Government is headless... literally, and now, it seems like anybody's game for who takes over the ashes of the Mexican Government."
  mexico.4.o1:0 "Dios Mio..."
  
  mexico.5.t:0 "The Government has Failed"
  mexico.5.d:0 "The Cartels have departed from Mexico D.F. and now plan one of the most ambitious operations in modern-day criminal history. They plan to usurp the Federal Government entirely. With no line of Succession laid out and the vast majority of the Government and Congress dead, Northern States have banded together under General Salvador Cienfuegos, a Cartel-backed Military Figure who has declared his intention to restore stability to Mexico. With a leadership vacuum, a variety of radical groups now stand to take control of the remains of the Federal Government, some of them more esoteric than others."
  mexico.5.o1:0 "The Communists rise from the ashes!"
  mexico.5.o3:0 "Zapatistas lead the fight!"
  mexico.5.o4:0 "A reborn Synarchist Movement seizes control!"
  mexico.5.o5:0 "The Republic has Failed, restore the House of Iturbide!"
  mexico.5.o6:0 "The Republic has Failed, restore the House of Moctezuma!"
  
  mexico.6.t:0 "Cartels Seize Nueva Mexico"
  mexico.6.d:0 "Our plan to foist the Cartels on our Yanqui neighbors has not panned out exactly how we've planned. Cartel Forces have abandoned the northern chokepoint to funnel into Nueva Mexico - the part of the old American State of New Mexico we incorporated after 1988. The Texans, despite being on the backfoot as Americans advance, have appeared to cut a deal with El Chapo in exchange for tactic support, viewing him as a step up from the Mexican Federal Government, ensuring that Cartel activity in Texas will be manageable and primarily focused against Atlanta. It appears that our strategy has backfired, and now we are left with a difficult battle to reclaim what we have rightfully taken from the collapsing Yanquis."
  mexico.6.o1:0 "Crush these scum at once!"
  
  mexico.7.t:0 "Victory Against the Government!"
  mexico.7.d:0 "At long last we have destroyed the Federales. Mexico is our domain, our fiefdom, the land of the Cartels. International observers stand horrified. The Cartels who banded together to defeat the Federal Government now stand ready to tear each other to shreds. Mexico sleeps."
  mexico.7.o1:0 "We are living in a Gangster's Paradise."
   
  mexico.70.t:0 "Fate of the Cartels' Rule"
  mexico.70.d:0 "Now comes the bloodshed. There are many directions in which our new Narco-State could go. Many are suggesting restoring 'Free' and 'Fair' Elections to restore a veneer of legitimacy and continuity with the Federal Government. These Elections would naturally be rigged so our allies in the PRI could claim victory. Others are suggesting maintaining the 'Cienfuegato' as a means to unify the disparate Cartel groups. However the Sinaloa Cartel, the largest of the groups represented, is agitating to have 'El Chapo' sworn in as President."
  mexico.70.o1:0 "General Cienfuegos shall continue to rule on behalf of the Cartels."
  mexico.70.o2:0 "'El Chapo' moves to consolidate power around himself!"
  mexico.70.o3:0 "The Cartels inaugurate Manuel Bartlett as Puppet President!"

 
  mexico.8.t:0 "[GetYear] Election"
  mexico.8.d:0 "Once more it is time for Mexicans to head to the polls. President [MEX.GetLeader] is ineligible for a second Six-year Term, making it truly anybody's race. As the votes are counted, it is clear that victory belongs to..."
  mexico.8.o1:0 "Partido Revolucionario Institucional."
  mexico.8.o2:0 "Movimiento Ciudadano."
  mexico.8.o3:0 "Partido de la Revolución Democrática."
  mexico.8.o4:0 "Partido del Trabajo."
  mexico.8.o5:0 "Partido del Trabajo."
  mexico.8.o6:0 "Partido Acción Nacional."

  mexico.9.t:0 "[GetYear] Election"
  mexico.9.d:0 "Once more it is time for Mexicans to head to the polls. President [MEX.GetLeader] is ineligible for a second Six-year Term, making it truly anybody's race. As the votes are counted, it is clear that victory belongs to..."
  mexico.9.o1:0 "Partido Revolucionario Institucional."
  mexico.9.o2:0 "Movimiento Ciudadano."
  mexico.9.o3:0 "Partido de la Revolución Democrática."
  mexico.9.o4:0 "Partido del Trabajo."
  mexico.9.o5:0 "Partido del Trabajo."
  mexico.9.o6:0 "Partido Acción Nacional."
  
  mexico.10.t:0 "Cienfuegos Uprising Crushed"
  mexico.10.d:0 "Victory. The usurpers have been crushed and the Cartels have once more been sent underground. We hope that eventually we may banish this scourge from our land entirely, but for now we remain content destroying those who sought to topple all we have worked to build."
  mexico.10.o1:0 "A blow against the Narcos."
  
  rwmex_news.25.t:0 "Mexican President Murdered by Cartels"
  rwmex_news.25.d:0 "Mexico has been gripped by chaos ever since the start of the American War in Texas, as refugees and skyrocketing Gas Prices shake the Northern Region, leading to Cartels further entrenching them in Mexico's chaotic border region. Federal Responses to this new Cartel War have been... poorly taken, as in a dark new turn for the Mexican War on Drugs, several Cartel groups advanced on Mexico City, entering the Palacio Nacional and killing Mexican President Emilio González Márquez. Márquez himself took over after the assassination of his predecessor Felipe Calderón, and governed through the tumult of countless political assassinations. Videos showing the horrific events have spread throughout the world in what many are dubbing the darkest day in Mexican history. In addition to the execution of the Mexican President, countless deputies and other civil servants, in an incident which is being referred to across the nation as the 'Day of Spilt Blood'. Now, with Mexico's government dead, it is seemingly only a matter of time before the Cartels move to replace the Federal Government wholesale."
  rwmex_news.25.o1:0 "How Dark." 
      
  rwmex_news.26.t:0 "The Cienfuegos Rebellion"
  rwmex_news.26.d:0 "Further complicating the geopolitical quagmire that has emerged between Texas and Mexico, the Northern Regions of Mexico, those primarily bordering Texas, have declared a rebellion from the now-defunct Mexican Federal Government. In the wake of the Mexican Government's murder, popular General Salvador Cienfuegos has declared his intention to succeed the now-nonexistent Mexican Federal Government. This rebellion, while claiming to be against the 'Illegitimate' Government now assembled in Mexico City, appears to be backed entirely by Mexico's vast network of Cartels, primarily the Sinaloa Cartel that remains a massive presence in their core region. The newly-minted 'Mexican Confederation' has risen up in the North of Mexico, and in territories almost exclusively held by the Cartels. While small portions of the Mexican military have defected to Cienfuegos' side, the vast majority of the rebellion is backed by the Mexican Drug Cartels, who have temporarily made peace to focus on defeating the Mexican Government."
  rwmex_news.26.o1:0 "Mexico enters chaos once more." 
  
  rwmex_news.27.t:0 "Nueva Mexico Rebellion"
  rwmex_news.27.d:0 "In a strange new turn in the Mexican War on Drugs, the powerful Mexican Sinaloa Cartel has pooled their vast resources to seize control of the Mexican State of Nueva Mexico. Nueva Mexico is famous for struggling with law enforcement matters, partly due to restless locals who resent the Mexican Federal Government for occupying the territory after the collapse of the United States. The Texan War has spread chaos throughout the disconnected part of Mexican territory, further cementing Cartel control. Ironically, this new Cartel pseudostate has been remarkably friendly with the battered Texan Government. This newly-created 'República de Nuevo México' has cited the 'Illegal Mexican Occupation' as their casus belli for succession, however observers have noted that this declaration is almost entirely as a result of Mexico's war against the Drug Cartels. This new nation is run almost entirely by the Sinaloa Cartel and other sympathetic Criminal Groups who seek to create their own Criminal Paradise away from the Mexican Government's reach. "
  rwmex_news.27.o1:0 "The Drug War enters a strange new phase."
    
  rwmex_news.28.t:0 "Drug Lords Secure Mexico"
  rwmex_news.28.d:0 "It seems that the long and bloody Mexican 'Narco War' has finally come to an end. The remnants of the Mexican Federal Government have fled as a loose alliance of Drug Cartels have now managed to secure the entirety of the former United States of Mexico. Now, General Salvador Cienfuegos, leader of the rebellion has been proclaimed as Mexico's New President in a grand ceremony in Mexico City. Cienfuegos's new regime has been dubbed as a return to the Porfiriato, taking power almost 100 years ago after the fall of the original one. This new shadow Porfiriato, while publicly a Technocratic Military Dictatorship, is secretly backed by a vast coalition of Drug Cartels who banded together to fight the Mexican Government. While many have predicted that with the Mexican Government gone, these once united groups would soon resort to tearing each other apart in a vicious battle for supremacy, the so-called 'Godfather' of the Mexican Cartels appears to have smooth over tensions to keep these disparate groups together."
  rwmex_news.28.o1:0 "Congratulations to Drugs for winning the War on Drugs."
      
  rwmex_news.29.t:0 "'El Chapo' Inaugurated"
  rwmex_news.29.d:0 "It seems that the long and bloody Mexican 'Narco War' has finally come to an end. The remnants of the Mexican Federal Government have fled as a loose alliance of Drug Cartels have now managed to secure the entirety of the former United States of Mexico. General Salvador Cienfuegos, leader of the rebellion, has stepped aside to allow Joaquín Guzmán, better known as 'El Chapo', to be sworn in as Mexican President. 'El Chapo' is the head of the notorious Sinaloa Cartel, which has become the largest power-player in the New Mexico. This brazen seizure of power by Guzmán has thrown a wrench in the previous alliance of Cartels against the Government, and now it seems likely that these once united groups will soon resort to tearing each other apart in a vicious battle for supremacy. 'El Chapo' for his part has dedicated himself to cultivating a positive Public Image, vowing a return to Democracy and the creation of a comprehensive welfare state, however the International Community has been slow to buy Guzmán's philanthropic image."
  rwmex_news.29.o1:0 "Congratulations to Drugs for winning the War on Drugs."
  
  rwmex_news.30.t:0 "Mexican Democracy Restored"
  rwmex_news.30.d:0 "It seems that the long and bloody Mexican 'Narco War' has finally come to an end. The remnants of the Mexican Federal Government have fled as a loose alliance of Drug Cartels have now managed to secure the entirety of the former United States of Mexico. Now, General Salvador Cienfuegos, leader of the rebellion has been instructed to step down and make way for 'Free' and 'Fair' elections to be held. These elections have been won in a landslide by Cartel-backed candidate Manuel Bartlett, who has run under the ticket of the restored PRI. Declaring this to be a triumph of the old Federal Government, casting the slain Government as the true usurpers, Bartlett has restored a semblance of legitimacy to Mexico, even if this new Federal Government is not-so-secretly backed by a vast coalition of Drug Cartels who banded together to fight the Mexican Government when they stepped out of line. With the old Mexican Government gone, it seems likely that these once united groups will soon resort to tearing each other apart in a vicious battle for supremacy."
  rwmex_news.30.o1:0 "The Rule of the Cartels Secured."
  
  rwmex_news.31.t:0 "Cienfuegos Rebellion Ends"
  rwmex_news.31.d_verdugo:0 "The ill-fated rebellion started by Cartel-backed General Salvador Cienfuegos has finally been defeated by the Mexican Government. General Cienfuegos, as well as major players of the failed rebellion were taken into custody today, signalling the end of the so-called 'Mexican Civil War'. This war marked the escalation of the Mexican War on Drugs into a full-scale civil conflict between competing governments. With the Cartel uprising defeated, it appears that the Narcos have been dealt a significant blow. While their attempts to replace the Mexican Government wholesale have failed, the Cartels still remain a powerful albeit weakened force working in the Mexican underground economy. With Mexico now secure, Arnoldo Martínez Verdugo, Mexico's Head of State since the Cartel War, has vowed to create a new form of Latin American NeoCommunism that rejects Soviet Hegemony while upholding Communist values. While traditional Soviet Allies such as Venezuela have laughed at Verdugo's promise of a 'New Socialist Order', several groups across Latin America have reacted with great interest."
  rwmex_news.31.d_zapatista:0 "The ill-fated rebellion started by Cartel-backed General Salvador Cienfuegos has finally been defeated by the Mexican Government. General Cienfuegos, as well as major players of the failed rebellion were taken into custody today, signalling the end of the so-called 'Mexican Civil War'. This war marked the escalation of the Mexican War on Drugs into a full-scale civil conflict between competing governments. With the Cartel uprising defeated, it appears that the Narcos have been dealt a significant blow. While their attempts to replace the Mexican Government wholesale have failed, the Cartels still remain a powerful albeit weakened force working in the Mexican underground economy. With Mexico now secured, Mexico's new Zapatista Government, headed by the mysterious 'Subcomandante Marcos', or Rafael Sebastián Guillén Vicente, has promised to rebuild the nation along Agrarian Socialist lines. Proponents of Communism have sneered, however Mexico's radical transformation has already garnered great interest from Philadelphia."
  rwmex_news.31.d_synarchist:0 "The ill-fated rebellion started by Cartel-backed General Salvador Cienfuegos has finally been defeated by the Mexican Government. General Cienfuegos, as well as major players of the failed rebellion were taken into custody today, signalling the end of the so-called 'Mexican Civil War'. This war marked the escalation of the Mexican War on Drugs into a full-scale civil conflict between competing governments. With the Cartel uprising defeated, it appears that the Narcos have been dealt a significant blow. While their attempts to replace the Mexican Government wholesale have failed, the Cartels still remain a powerful albeit weakened force working in the Mexican underground economy. With Mexico now secured, Mexico's new Synarchist Government has vowed to cleanse Mexico of Sin, vowing harsh crackdowns on the Cartels until their influence can be entirely destroyed. International observers have expressed concerns with the new Mexican Government's Ultranationalistic and Imperialistic aims, with neighbors such as Texas and Arizona reportedly preparing for a resumption of hostilities with Mexico."
  rwmex_news.31.d_monarchist:0 "The ill-fated rebellion started by Cartel-backed General Salvador Cienfuegos has finally been defeated by the Mexican Government. General Cienfuegos, as well as major players of the failed rebellion were taken into custody today, signalling the end of the so-called 'Mexican Civil War'. This war marked the escalation of the Mexican War on Drugs into a full-scale civil conflict between competing governments. With the Cartel uprising defeated, it appears that the Narcos have been dealt a significant blow. While their attempts to replace the Mexican Government wholesale have failed, the Cartels still remain a powerful albeit weakened force working in the Mexican underground economy. To the shock of many, Mexico's new Monarchist Government has secured legitimacy abroad in what may be the most shocking turn-around in the history of the nation. [MEX.GetLeader] remains popular throughout their efforts to rebuild Mexico after a devastating war, however no concrete word has come from the Palace on the possible transition towards a Constitutional Monarchy or the creation of a Prime Minister's office."
  rwmex_news.31.o1:0 "The Drug War moves underground once more."

  
