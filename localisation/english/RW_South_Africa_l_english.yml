 #They say it's never too late to forgive. Take the deal. Save yourself. Blame your predecesors and wash the slate clean. There will be no investigations. No trial. Forgiveness, sealed with a handshake. Pretend we were always friends, pretend we were always against this. There will be awards to be won, books to write, narratives to shape. History will remember you as a hero for what you did. Some will hate you. But they don't have the numbers.
 
 SAF_the_republic_under_seige:0 "The Republic Under Siege"
 SAF_the_republic_under_seige_desc:0 "For six decades, we have survived. For six decades the world came together to root for our downfall. The so-called 'Liberal Democracies' who sneered at our attempts to contain the forces of Communism and Russian Colonialism on this continent found themselves swept away by the same forces. We have survived only because we did not fall into their same decadent trappings. For six decades, we have done what it takes to survive. We won't falter now."
 SAF_begin_dispersal_strategy:0 "Against the Onslaught"
 SAF_begin_dispersal_strategy_desc:0 "We always knew this moment was coming. For 60 years we knew we were one step away from annihilation. We have all the proof we need now to know the truth that we will be washed away by the rising tide unless we prepare. A storm is coming over the horizon. We must be ready for it."
 SAF_arm_white_enclaves:0 "Arm the Enclaves"
 SAF_arm_white_enclaves_desc:0 "In a mass-uprising scenario we know well enough that the vast majority of the country is already lost. White areas in the Cape are our most likely redoubt, however White Enclaves such as Orania also need our assistance in such an event. We must distribute arms and personnel to these settlements so they are not overrun once the onslaught begins."
 SAF_token_concessions:0 "Token Concessions"
 SAF_token_concessions_desc:0 "We can't show weakness. Ok, maybe we can show a little weakness. We can buy ourselves some time by instituting some more token reforms to help ease public anger. Dismantle more systems, send out some cheques. The radicals will undoubtedly be angry, but they must understand the situation we find ourselves in."
 SAF_talk_to_terreblanche:0 "Talk to Terre'Blanche"
 SAF_talk_to_terreblanche_desc:0 "The school of good Public Relations dictates that we can't get too close to the AWB and their enigmatic leader. But the fact is that if we are to survive what's coming, we need the AWB's support. Let them handle the dirty work. The jobs the Government doesn't want to get their hands on. They will be handsomely rewarded."
 SAF_international_outreach:0 "International Outreach"
 SAF_international_outreach_desc:0 "The International Community, in no uncertain terms, hates us. Hates us hates us hates us. But let's be honest here, the remaining forces of the West only hate us because they need to appease their idiot voters. Let's see if we might be able to sway those acting off the official record. Surely our new reforms have bought us some good-will?"
 SAF_beg_the_cia:0 "Our Friends in Langley"
 SAF_beg_the_cia_desc:0 "Those still dedicated to fighting Communist hegemony have no reason to consider South Africa an enemy. While the Central Intelligence Agency is a husk, a shell of its former self. Yet it still survives. Not only that, it's getting stronger by the day, closer and closer to its pre-collapse prime. Perhaps they'd be willing to spare some material in helping our struggle?"
 SAF_recruit_collaborators:0 "Recruit Collaborators"
 SAF_recruit_collaborators_desc:0 "Not all Natives are caught up in the ANC's nonsensical rabble. There are enough allies both domestically and in the Bantustans to dispel the nasty narrative that we are nothing more than intolerant bigots. They hate Communism as much as we do, and they're ready, willing, and able to help in a time of crisis. Let's make some calls, let's take some photographs and shake some hands."
 SAF_frontline_against_communism:0 "The Last Frontline Against Communism"
 SAF_frontline_against_communism_desc:0 "How many dead because of Soviet expansionism, because of genocidal Russian Colonialism and the Red Menace's relentless desire to destroy all that's good and free in this world? Moscow's goons are coming for us, coming to destroy the last torch of Liberty and anti-Communism on this Continent to install another Red puppet. We cannot allow them to do so."
 SAF_good_neighborliness:0 "Good Neighbourliness"
 SAF_good_neighborliness_desc:0 "It's a big load of rubbish that our nation is falling apart at the hinges. Things are smoother than ever in fact. We just hit a bump in the road, that's all. Things are so good we are even thinking of going bigger, showing those Red Commie bastards that there is nothing they can do to stop us. Let's consolidate, take some risks, surely it won't come back to bite us in the ass?"
 SAF_absorb_lesotho:0 "Absorb Lesotho"
 SAF_absorb_lesotho_desc:0 "Lesotho is barely a country. They're completely enclaved by us. They're practically a Bantustan already. We can't afford the risk of another nation susceptible to Communist infiltration and subversion directly inside our nation's border. Phone Lekhanya, let him know that we're going to be taking over."
 SAF_absorb_swaziland:0 "Absorb Swaziland"
 SAF_absorb_swaziland_desc:0 "Similar to Lesotho, Swaziland is already a Bantustan in all but name. Whatever little international legitimacy we have bought by allowing these two nations to continue in their independence has long been overshadowed by the risk of a hostile government using the King's weakness to subvert our government. We must rid ourselves of this uncontrolled variable."
 SAF_restore_direct_rule_in_namibia:0 "Martial Law in Namibia"
 # SAF_restore_direct_rule_in_namibia_desc:0 "Namibian Independence is a farce, its mission of buying us goodwill an unequivocal failure. With the SWAPO threat lapsed and the world focusing on more pressing matters, the Army believes now is a good time to put the delusions of Namibian independence to bed once and for all and reassert control over rightful South African Territory in South West Africa."
 SAF_restore_direct_rule_in_namibia_desc:0 "Recent numbers have indicated that while we have been so noble, so altruistic as to grand Namibia's complete and total independence, the Communists in Angola still dare to trespass on the will of the Namibian people who reject Communism. The Turnhalle Alliance has failed in their mission to keep Namibia safe from Communism. There is no political solution left to the crisis that is brewing in Namibia. We must restore direct control in Namibia to put the Communists down once and for all."
 SAF_tighten_restrictions:0 "Tighten Restrictions"
 SAF_tighten_restrictions_desc:0 "The population has been getting restless after Mandela's disappearance. Riots have become exponentially more common as the Natives abandon their dreams of a peaceful end to the Apartheid system. Violence is becoming more common and our current crowd-control agents aren't getting the job done. We must put Police out on the street, put Crowd Suppression Tactics into force, and pray that we may survive the coming storm."
 SAF_skirmishes_in_angola:0 "Skirmishes in Angola"
 SAF_skirmishes_in_angola_desc:0 "The Angolans are at it again. Raids in Namibia have become concerningly more common ever since we restored Martial Law in South West Africa. We ought to teach Santos a lesson not to mess with the SADF. Time to cross the border once more. Phone up Savimbi, let him know that we're back in business."
 SAF_annex_the_bantustans:0 "Integrate the Bantustans"
 SAF_annex_the_bantustans_desc:0 "The Bantustans have gotten a big head about what they are. We only let them pretend to be their own nations to dupe the foreigners. We can't have them earnestly advocating for their people and defying our will. The time has come to show them who's boss. While we cannot and will not Annex them, we can still redraw their borders and increase settlement efforts."
 

 ##########################
 # EVENTS
 ##########################
 
 rw_south_africa.1.t:0 "The Republic of South Africa in the New Decade"
 rw_south_africa.1.d:0 "South Africa. The world's most despised nation. A pariah state with few friends and innumerable enemies. For decades observers have declared us a powderkeg ready to explode at any second. And yet year after year, Apartheid prevails. Through a tightrope disaster has been avoided, or in the mind of the regime's enemies, delayed. To those who think that we are running on borrowed time, every second the White-Minority goes without wielding to the tide of history pushes South Africa further towards an unspeakable future. Others have come to see the Cape as a lost cause, an evil regime that will continue crushing the Natives under the boots for all eternity, a grim constant in this chaotic world. While Apartheid has changed shape in the years, it remains the unmistakable system that defines modern South Africa. Klerk, realizing that the nation was being pulled towards an unavoidable conflict, aimed to reform the system, if not to preserve its survival, to avoid bloodshed. The looming triumph of Soviet Communism released pressure points the West used to press us, with Communism's final victory further making a peaceful transition impossible. In a desperate rush to maintain the system, de Klerk began dismantling many facets of 'Grand Apartheid' and provided pardons for key leaders in the Opposition such as Nelson Mandela, while still stopping short of legalizing the ANC. While these moves infuriated de Klerk's rightward opposition, which consolidated around the far-right Conservative Party, de Klerk's reforms have been widely credited for either extending Apartheid's shelf-life, or staving off the end of White Minority rule permanently. A compromise which neither side accepted, but both sides tolerated emerged, all as the International Community's attempts at pressuring Pretoria fell flat. By the New Millennium, Apartheid ossified, many within the Opposition giving up the dream of a peaceful transition, or to those who have grown up not knowing anything other than this system, gave up hope that it may be dismantled at all. For the time being, South Africa appears stable. But as tumult mounts, it has become clear that nothing in this world is guaranteed."
 rw_south_africa.1.o1:0 "We shall survive."
 SAF_viewer_discretion_tooltip:0 "§RThe views of the figures portrayed are their own and do not reflect those of the Development Team. Player discretion is advised.§!"
 
 rw_south_africa.2.t:0 "The Modern Voortrekkers"
 rw_south_africa.2.d:0 "The Collapse of the West in the late 80s sent countless fleeing from their homes as they were overrun by degeneracy. Those with deep pockets picked Canada as their destination of choice. But to those unable to stomach the wishy-washee Liberalism of Toronto, there was only one destination that could truly be said to keep the torch of Western Civilization alight. While the Cape was a world away from Europe and America, countless of those unwilling to surrender themselves before the Altar of Communism and Liberalism chose South Africa as their new home. And we were not complaining. The White Population in South Africa has steadily increased due in part to massive influxes of Emigres from Europe, the Former United States, and even what was once Israel, as well as the Government's more nefarious policies. Project Coast secretly sterilized large portions of the Black Population, all while the Government strategically chose to ignore the HIV/AIDS crisis due to them primarily affecting Natives. In the modern day, South Africa has chosen to present itself as the sparkling white homeland of fantasy, a safe-haven from the forces of Socialism that have overrun the Western World, the last slice of civilization not corrupted by the forces of rot. Yet below the surface, South Africa's rot permeates deeper than perhaps any other society in the world. The Black Population is content... or at least that's what the Government says. Standards of living have improved and 'Grand Apartheid' Measures have been relaxed. But as tensions simmer, nobody can be sure if this illusion of Racial harmony can hold."
 rw_south_africa.2.o1:0 "The Beacon of Western Civilization is Alight in the Cape."
  
 rw_south_africa.3.t:0 "Under the Atom's Shield"
 rw_south_africa.3.d:0 "It is no secret that South Africa has many enemies that wish to see our destruction. Ravenous Russian Communists, foolish Western Liberals, our neighbors, the Native population. They all dream of our destruction. During the reign of the 1970s, a decision was made to construct our own Nuclear Program. Using ex-Israeli scientists and material, a clandestine 15-year program allowed South Africa to build six crude atomic bombs. The purpose of attaining these weapons was not to use them, but rather to keep them on the shelf as a powerful card that could be played if things went south. Tentative plans to scrap our arsenal were abandoned after the victory of the Soviet Union, as the Atom's shield remained our last true bargaining chip. Despite our international isolation, our large supply of Uranium has allowed us to continue building these weapons. The Bomb is not just a weapon of mass destruction, it is a political weapon that opens a new possibility, the option for the Republic of South Africa to stipulate its birthright at the negotiating table of the Greats, with nuclear deterrence strategy as its foundation. Of course, the Atom Bomb is not the only dabbling Pretoria has done in the realm of WMDs. Project Coast is renowned in the deepest circles of the Government for their work in creating biological and chemical agents, agents which could be deployed as a final ditch effort in a time of utmost desperation, where all traditional means to ensure the survival of our people have failed. We hope to never find ourselves in such a situation."
 rw_south_africa.3.o1:0 "The South African 'Ploughshare' must be forged into a sword."
   
 rw_south_africa.4.t:0 "De Klerk Addresses the Volksraad"
 rw_south_africa.4.d:0 "The New Decade provides new opportunities and new challenges for the Republic of South Africa. It's safe to say that our situation has neither advanced nor retreated in the years since the new millennium began. Apartheid is as strong - or as weak, depending on your point of view, as ever. De Klerk has ascended to the podium in the House of Assembly to speak to members as the new Decade dawns, speaking on the challenges our nation has in store, and championing the weakened Soviet hold on the world in the wake of Yazov's bloody demise. This televised address aimed to thread the needle, as de Klerk jointly promised Reform to the Native masses while upholding White-Minority Rule in the nation, with de Klerk seemingly giving two different addresses to the different population groups of South Africa. De Klerk's address hasn't really moved the needle. But that's okay. He doesn't need it to. South Africa is the same that it's been in the last 60 years, and it doesn't seem much is going to change that at this point in time. Knock on wood. De Klerk and his advisors realize that South Africa is a living, breathing creature. A creature that for the time being, remains asleep. God help us all if, or more likely when, she wakes."
 rw_south_africa.4.o1:0 "Reform in South Africa is on the way!"
   
 rw_south_africa.5.t:0 "SAP Officers Break Up Yazov Vigil"
 rw_south_africa.5.d:0 "News has come in from the Soviet Union. For once, the news is good. The most powerful man in the world was shot dead in broad daylight. South Africa's number one boogeyman lies bleeding out in the streets, undoubtedly to be replaced by some equally abhorrent Russian tyrant. The Soviet Union, supporter of all things evil in this world, has long kept the ANC's coffers filled and put terror against the good people of South Africa at the top of their agenda. We are not alone in celebrating Yazov's grim demise. Unfortunatley, not all within the country share this jubilation. In East London, crowds gathered to hold a mock funeral for the deceased Soviet Leader. In Port Elizabeth, crowds gathered with candles to celebrate the life of their unlikely champion, not out of a sense of reverence for the man himself, but out of a duty to oppose a man the Aparthied Government so vehemently loathed. Police was quick to break up this rabble once they caught on. They were sure to be careful, almost surgical in breaking up the crowds, not wanting a repeat of Sharpeville. Ultimatley any talk of honouring Yazov was done away with before the night had ended, but the open show of support for our sworn enemy certainly has many within Pretoria on edge."
 rw_south_africa.5.o1:0 "Let the Russian rot."
   
 rw_south_africa.6.t:0 "Crunching the Numbers"
 rw_south_africa.6.d:0 "Computers. They're wonderful things. These new models can calculate just about anything. The bigger they are the more accurate they can be. Of course, we've been cut off from the world of computing wholesale. However through smuggling, bribery, and a fair deal of reverse engineering and jerry-rigging, we have managed to break into the computing game. The Government's latest 'Super Computer' is the size of a room and takes up half of Transvaal's power needs, but it can tell us just how we need to run the country. An incalculable amount of data has been fed into the thing, and it has spit out all manner of calculations. We aren't sure how accurate these numbers are, but from what we've seen so far, we can assume that this machine knows what it's talking about. Of course, the most pressing matter that every South African politician has on their mind, whether they are opposed to it or in favour of it, is whether or not this automated fortune-teller can predict if Apartheid will survive, if it will be discarded into the waste bin of history. It's told us in no uncertain terms that it can hold, under current parameters. Though what the machine can't predict is uncontrolled variables, a stray shot dead by police, an economic crisis led by a number being rounded up wrong. Those, those may spell a disaster we can't recover from."
 rw_south_africa.6.o1:0 "Well, let's hope none of those come up."
   
 rw_south_africa.7.t:0 "Rolihlahla Gone"
 rw_south_africa.7.d:0 "Nelson Mandela is perhaps the world's most tightly-watched prisoner. Every hour of the day he is watched. Every movement is logged. None come to see him without a background search going to the day they were born. That is why what has just transpired is such a shock. Nelson Rolihlahla Mandela, the most infamous political prisoner in the country, vanished tonight, without so much as a trace. Guards initially could not believe it, but after an extensive search of his estate in Houghton, the conclusion was confirmed to be true. Mandela's disappearance was first logged by a private cook who noted that Mandela had not attended supper. Security Cameras captured no break, no filmed footage of the moment Mandela left. Given the extensive perimeter, breaking Mandela out would be quite the challenging operation, one that would require thankless planning and a very visible impact. None of these markers existed. Hours, even days passed. No sign of Mandela emerged. We expected him to pop up in Moscow after a day's flight. But he remains silent. It's like the man just... faded away. Border checkpoints closed. Patrols were set up. No sign of him. No trace. No demands. No statement. No memory."
 rw_south_africa.7.o1:0 "Where are you?"
   
 rw_south_africa.8.t:0 "Search Radius Expanded"
 rw_south_africa.8.d:0 "Nelson Mandela's shock disappearance has put the nation into a frenzy. Between the jubilant crowds celebrating Mandela's evasion of his captors while the Government is preparing for the five-alarm fire that Mandela popping up in Moscow would be. Naturally an extensive manhunt for Mandela started as soon as they realized he was missing. Houghton was put on lockdown, with every road in and out of the affluent suburb put on lockdown. Joburg itself has been swept by cops, every noted safe house raided in an attempt to locate the nation's most wanted fugitive. All to no avail. Efforts to sabotage our policing operations have been widespread, ANC supporters taking every opportunity to help Mandela make his getaway. Stalling, lying, using themselves as bait, sending the Cops on wild goose chases, all of these tactics have been used by people who from what we can tell, are doing this just out of a sense of loyalty to the man himself. Likely escape routes such as Botswana and Mozambique have been shut down, with checkpoints and searches set up at every border station that hasn't been shut down. And yet Mandela has still seemingly slipped through our fingers."
 rw_south_africa.8.o1:0 "He didn't well bloody vanish into thin air now did he?"
   
 rw_south_africa.9.t:0 "Protests Rock the Nation"
 rw_south_africa.9.d:0 "We've tried to contain the situation that has developed in the wake of Mandela's disappearance. It's safe to say we failed. We couldn't possibly have hoped to keep the news of Mandela flying the coop suppressed forever, or even for long. South Africa has mostly kept itself from exploding throughout the 21st Century. Nothing terribly exciting has happened to arouse the passions of the population. Pressure valves existed to vent public anger and the Government operated on a policy of staying still so nobody would notice them. Mandela's disappearance? That's a variable that couldn't be controlled. Throughout major cities crowds have taken to the street to celebrate Mandela's liberation. Others have taken to the streets to protest Mandela's murder at the hands of the Government. Others take to the streets to mourn Mandela's death after a long sickness. Whatever their reasons for their assembly is, it's bad news for the Government. The Police have begun cracking down on crowds in hopes of keeping them from spiralling. Of course, such actions typically act as a self-fulfilling prophecy. The President has been briefed on the situation, many within the Cabinet suggest dusting off old emergency plans as the situation unfolds."
 rw_south_africa.9.o1:0 "The 21st Century has some surprises yet."
   
 rw_south_africa.10.t:0 "Plan 'R' Put in to Effect"
 rw_south_africa.10.d:0 "With chaos spreading across the nation in the wake of Mandela's disappearance, the Cabinet of South Africa, as well as key algorithms, have both come to the same grim conclusion: that the Apartheid System is unlikely to survive the next Decade without significant bloodshed. The President has wasted no time dusting off old plans from the era in which many considered the end to the system to be a foregone conclusion. This plan calls for securing strategic locations and protecting key Afrikaner areas while abandoning the rest of the country, fortifying the Cape and strategically retreating to key locations. Naturally the plan in its totality is nowhere close to full implementation, but the Government, seeing the writing on the wall, is taking steps to implement key components in the plan in the event of a worst-case-scenario. The Military has been put on high-alert as major cities are engulfed by Protests that the Police struggle to contain. To many, the implementation of Plan R is the Apartheid Government's death rattle, to others, a sign that the Government doesn't intend to go down without a fight. But whatever meaning is taken from it, it is clear that the nation is in for dark times ahead."
 rw_south_africa.10.o1:0 "We won't let ourselves be lost to Communism like the rest of the world!"
   
 rw_south_africa.11.t:0 "Secret Meeting with Terre'Blance"
 rw_south_africa.11.d:0 "The Afrikaner Weerstandsbeweging has been kept quiet since the height of Anti-Apartheid tensions, however as the nation once more looks down the barrel of oblivion, the AWB has once more took it upon itself to start stirring up trouble. We can't claim to support what the group is doing, not officially at least. However in private, key Government officials recognize the AWB's use as an unofficial arm of Apartheid. Mothballed equipment has been sold to the AWB through third-party brokers as Government intel is 'Leaked' to the AWB through private channels. Coordination has begun with Law Enforcement and the Military. The President has held a top-secret meeting with Eugene Terre'Blance, the reclusive leader of the AWB, aiming to create a coherent strategy for defending the System in the event of a mass uprising. Though in public, the Government has distanced itself from the AWB, and the AWB loudly and violently disagrees with de Klerk's efforts to 'Reform' the Apartheid system, in private, an understanding has been reached, one that could save the Apartheid system, or end up sealing its fate. Acts of Terror perpetrated by the AWB are more measured, more cautious.  "
 rw_south_africa.11.o1:0 "No Comment."
   
 rw_south_africa.12.t:0 "Ben Nitay Speaks at the United Nations"
 rw_south_africa.12.d:0 "To say that South Africa has atrocious PR is like saying the sky is blue. Gifted communicators are in short supply, however Ben Nitay, the MP for the Western Cape has been rapidly rising through the Governmental ranks, overshadowing the aging 'Verlingite' Pik Botha to become the nation's de-facto Foreign Minister. In a speech before the United Nations, Nitay declared that 'I didn’t intend to come here this year. My country is at war, fighting for its life. But after I heard the lies and slanders leveled at my country by many of the speakers at this podium, I decided to come here and set the record straight. I decided to come here to speak for my people. To speak for my country, to speak for the truth. And here’s the truth: South Africa seeks peace. South Africa yearns for peace. South Africa has made peace and will make peace again. Yet we face savage enemies who seek our annihilation, and we must defend ourselves against them.' While the UN Chamber was practically silent during Nitay's speech, he has gained a large following at home for his full-throated defense of the, with the Government also heavily playing up his Jewish heritage to showcase South Africa's diversity. Other nations, particularly those opposed to Communism, are beginning to see South Africa in a more favourable light ."
 rw_south_africa.12.o1:0 "If the ANC truly wants peace, we will make peace."
   
 rw_south_africa.14.t:0 "Strengthening Bantustan Autonomy"
 rw_south_africa.14.d:0 "The International Community has refused to recognize the legitimacy of our Native Homelands, or as they're known, the Bantustans. Our aim has always been to utilize the Bantustands as a way to increase Black political participation without giving away any White political power in the process. However this aim has not been terribly successful. In many ways, the 'Bantustan' project has been a failure, those leading them perceived as collaborators. The overwhelming majority of inhabitants did not identify in any way with the politics of their homeland, and have almost unilaterally rejected such Homeland proposals. Only around 3% of the population is estimated to have voted in the most recent elections held in the Bantustans. The Native disinterest in this project is a serious problem for our Government going forward. To help allay these issues, de Klerk has announced new Autonomy measures that will hopefully help the Bantustans feel more like their own independent nations. More control over Foreign Policy has been granted while the Bantustan Territories have been granted more autonomy to bring them up to code with the other nominally-Independent Bantustans. Naturally, the International Community has continued to denounce these projects, but do we really care what they think?"
 rw_south_africa.14.o1:0 "Bread, Circuses."
 
 rw_south_africa.15.t:0 "Our Boys in the Company"
 rw_south_africa.15.d:0 "Aside from ourselves, there is only one nation on the planet that can come close to us in terms of being a Pariah State. That nation is, of course, the American Republic, rightful heirs to the old Federal Government. Smeared with Communist scorn, the Remnants have been consistent backers of our cause, helping out in whatever way they could due to shortages of supply and manpower. Men in nondescript glasses and Trench Coats assemble in Pretoria, helping us in the struggle against Communism in any way they meaningfully can. From shaping narratives, to rooting out insurgents, to evading international sanctions, the CIA has proven invaluable in keeping Apartheid running through the tumult of the modern day. Espionage efforts target the ANC without end while every other day, figures from the opposition are poisoned with Langley's finest Poloniom-210. We hope that one day we may be able to repay the favour to our friends in the CIA by helping the Americans reclaim what is theirs from the Communists. But for now, we must focus on keeping the Cape safe from the forces of Bolshevism and Russian Colonialism. More valuable than the CIA's direct support is their efforts to help train us in their methods, methods which will help us gain a mastery of their tactics and allow us to remain self-sufficient from the CIA's strained resources. "
 rw_south_africa.15.o1:0 "Teach a man to fish."
 
 rw_south_africa.16.t:0 "Stage 1: Denial"
 rw_south_africa.16.d:0 "South Africa is doing fine. While we've had a little hiccup after that whole Mandela situation, but overall it's not something we can't handle. The fact is that South Africa is stable, as stable as ever in fact. The natives are content, the Soviets are pulling back, and the forces of Capitalism are once more beginning to triumph. We are tearing back at the Communist-ruled World Order, and South Africa is at the centre of this new revolution against the Russians. We are not under attack, no no no. We are attacking, we are on the offensive, pushing back day after day against the Communists. Some are even suggesting we go further, take the fight directly to those Red Bastards. Consolidate, cut the wheat from the chaff, get rid of obstacles to success. They're all around us. Yes, yes. That's what we'll do. Reward ourselves for a job well done. There's dead weight all around us. Dead weight that needs to be cut out if we are going to survive and prosper. Leeches, freeloaders, yes-men. No shortage of them all around us. There is no need to worry, really, we have things sorted out. Honest. We aren't going to let ANC terrorists and Red Communist bastards dupe us. We are fine. Everything is fine. South Africa remains the most stable nation in Africa."
 rw_south_africa.16.o1:0 "This is fine."
 
 rw_south_africa.17.t:0 "Swaziland Joins South Africa"
 rw_south_africa.17.d:0 "King Mswati III is nothing more than a South African stooge already. However in Pretoria, growing frusturations have mounted with the King's failure to prevent Leftist subversion of his small Kingdom. A lack of communication between the SADF and the Umbutfo Swaziland Defence Force has kept Mozambuqian sabeutours from facing justice despite the King's infamous crackdown on PUDEMO subversives. The King, who is mostly content enjoying his garage full of luxury cars and his dozens of wives seems unconcerned with our fears surrounding his nation. Growing frusturated, de Klerk has formally moved to begin taking over Swaziland. Mswati, after being promised a generous stipend, and the incorporation of KaNgwane into the territory of the new Swaziland Bantustan, has agreed to allow Swaziland to be absorbed by South Africa. No real change in everyday life will be forced upon the citizenry. The people of Swaziland shall still enjoy complete freedom in their 'Kingdom', nestled neatly within our borders. The King shall continue to enjoy his luxurious lifestyle. Officially, no formal change has come in Swaziland's status, they have just been designated as one of our Native Homelands, which are 'officially' independent nations, the only one which continues to be internationally recognize."
 rw_south_africa.17.o1:0 "Same as it ever was."
 
 rw_south_africa.18.t:0 "Incorporation of Lesotho"
 rw_south_africa.18.d:0 "Lesotho, as a nation, has next to no reason to exist. Formed by the Domineering British in an attempt to block Boer control of the Coast, we have respected Lesotho's autonomy for some time now, despite the political chaos that has often plagued the country. Bankrupted by the ongoing HIV/AIDS crisis, utterly lacking in national identitied aside from their Monarchy, with a worthless currency, Pretoria has grown tired of Colenel Lekhanya's excuses. Instead of producing Passports, the Government of Lesotho has kept using easily-forged Travel Documents that have opened us up to subversion and Terrorists. If it weren't for Apartheid, many imagine that Lesotho would be quick to willingly join South Africa. Few Basotho feel attached to their currency or their borders – even less to their chaotic 122-seat parliament, which limps from one disputed election to the next amid assassination attempts and strikes. It ends now. Today, South African troops entered Lesotho from all direction, forcing the Enclaved Kingdom to accept South Africa's unilateral annexation of the tiny nation and the official transformation of Lesotho to South Africa's newest Bantustan. No longer shall this 'nation' be allowed to leech off us. The stragglers are being mopped up as South Africa consolidates."
 rw_south_africa.18.o1:0 "They were barely a country anyway."

 ### History Events ###
 
 saf_history.1.t:0 "The Constructive Engagement Policy"
 saf_history.1.d:0 "The Constructive Engagement Policy or 'Cape Thaw' is a term for a gradual opening of the West towards South Africa in the early 1980s, particularly driven by the Reagan Administration's desire for a reliable ally in the Southern Hemisphere in the wake of increased Socialist activity in the Global South. CIA support funneled into South Africa during the time period in hopes of tapping down unrest all while America provided South Africa covert support with their Nuclear Weapons program. The Comprehensive Anti-Apartheid Act of 1983 was formally vetoed by President Ronald Reagan who declared that in an era of Communist victories America could not afford to be picky in choosing their allies. Reagan and P.W. Botha formally met in the White House during the summer of 1983, with Reagan affirming a commitment to defending South Africa against the forces of Communism. Reagan would declare the ANC a terroristic entity and utilized the FBI to crack down on domestic opposition to Apartheid policies. Reagan's open support for Apartheid defined his Presidency prior to the Great Collapse, driving a wedge between Reagan and key allies, most notably Canada's Brian Mulroney who abhorred the Apartheid system. This Cape Thaw would ultimately provide South Africa with a key window to fortify itself against Communism during the period before the Great Collapse and the Revolutions of 1987, and is seen as a key factor contributing to Apartheid's survival."
 saf_history.1.o1:0 "Interesting."
 
 saf_history.2.t:0 "The South African Constitution of 1983"
 saf_history.2.d:0 "The South African Constitution of 1983 is the current instrument of Government that dictates day-to-day operations of the Government in the Republic of South Africa. The Constitution was notable for creating the Tricameral Parliament that exists today, which provided Coloured and Indians limited political representation. While Native representation was still nominally excluded, the creation of the Tricameral system is cited as a key factor in Apartheid's survival throughout the tumult of the 1980s. Natives continued to have their only political representation be politically impotent Bantustans, of which they were declared citizens of. As well, the 1983 Constitution abolished the office of Prime Minister, replacing it with the Executive position of State President. Botha put the changes up to a popular Referendum on November 2nd 1983, which passed 66.29% to 66.29%. While Hardliner backlash led to the launch of the far-right Conservative Party in the next election, these reforms were seen as an important victory for P.W. Botha and the National Party, with the provisions of the Constitution still remaining in force to this day. "
 saf_history.2.o1:0 "Interesting."
 
 saf_history.3.t:0 "The 1989 South African General Electiont
 saf_history.3.d:0 "The 1989 South African General Election was held on the 6th of September, 1989. Held in the aftermath of the Victory of Communism, these snap elections were called by incoming President F.W. de Klerk. Klerk's policy of 'Reform Apartheid' was not universally accepted by the ruling White Minority population, with many supporting the hard-right Conservative Party that was founded one election cycle prior. Despite a surge in support for the Conservatives, which gained 21 seats, and the liberal Anti-Apartheid Democratic Party, which gained 13 seats, the National Party was re-elected with a clear majority of 90 seats - though for the first time in the Party's history, their total vote share fell below 50 percent. These elections were seen as a great victory for de Klerk's policies of Reform Apartheid and set the stage for the ossification of the '1993 System' in South Africa as the nation traversed the remainder of the 20th Century. These were also the second elections conducted with South Africa's recently-introduced Tricameral Parliament. The results from the Coloured House of Representatives and the Indian House of Delegates saw widespread boycotts of the institution, which only had a portion of the allotted seats up for open election. Once more, these elections would be faced with widespread boycotts."
 saf_history.3.o1:0 "Interesting."
 
 saf_history.4.t:0 "Second Great Trek"
 saf_history.4.d:0 "The 'Second Great Trek' refers to a period of wide-scale emigration to South Africa from Europe and the Former United States. Deliberately attempting to boost the White Population, the National Party under F.W. de Klerk unveiled a plan to attract new minds to South Africa in the wake of Communist victories in Europe and the collapse of the United States. Travel expenses for those who chose refuge in the Cape would be covered, and a guaranteed payment of five thousand Krugerrands per household would be provided. While many old-guard Afrikaners would oppose this plan to bring in these Emigres, the National Party remained steadfast, and aside from hardliners in the AWB, this plan was hailed as a success, attracting more than a million since 1989. White South African Society would be forced to adjust to accommodate the new European settlers, the National Party putting forward a message that Whites, no matter their location, were a welcome force. Experience in integrating the large Jewish diaspora after the fall of the State of Israel was instrumental in smoothing over inner-ethnic tensions during the period of the Second Trek, ensuring a more tolerant Racist community."
 saf_history.4.o1:0 "Interesting."
 
 saf_history.5.t:0 "The South African Border War"
 saf_history.5.d:0 "The South African Border War refers to a drawn-out conflict that lasted from 1966 to 1997, with periods of varying intensity. This conflict was fought in Namibia between South African forces and the forces of the SWAPO, backed by Angola, Cuba, and the German Democratic Republic. This conflict was a largely asymmetric one that spread throughout several different nations, and was closely intertwined with the concurrent Angolan Civil War. The region of South-West Africa was occupied by South Africa since the end of the First World War, though never formally annexed, something which several unsuccessful petitions to the United Nations tried to amend to no avail. Fighting between the SADF and the PLAN, the military wing of the SWAPO, broke out in the late 1960s, extending for nearly four decades as South Africa's tactics grew increasingly aggressive. South African forces occasionally crossed into Angola, contributing to a strategic alliance between Pretoria and the UNITA forces in Angola, and further Soviet support for the MPLA. Following the Soviet Victory in the 1990s, the Soviet Union further invested in the conflict, believing a loss in Namibia could cause the toppling of the Apartheid regime. While fighting intensified in the late 90s, causing de Klerk to declare Martial Law, ultimately the SADF would manage to push the SWAPO back into Angola by 1997, securing the region under a cooperative regime and leading to a lull in the conflict that persists to this day."
 saf_history.5.o1:0 "Interesting."
 
 saf_history.6.t:0 "Release of Nelson Mandela"
 saf_history.6.d:0 "Nelson Rolihlahla Mandela was formally released from the Victor Verster Prison on September 3rd, 1999. Mandela's conditional release was meant as a show of goodwill by the de Klerk regime towards the Native populace, allowing Mandela to remain under House Arrest. This move was designed as a calculated PR move, one that could provide the illusion of change without making major institutional change. Mandela was allowed to continue writing and speaking out, though the international press was restricted from his estate in Houghton, where he was confined with an ankle monitor. Mandela, despite his austere personal philosophy, was provided with a deal of comfort in his estate by the Government, being provided with a personal chef and an extensive library. Mandela would continue speaking out vivaciously against the Apartheid system throughout his years under House Arrest, however his rhetoric notably dimmed as the 21st Century dragged on. Some attribute this to his own personal health deteriorating, while others ascribe it to Mandela losing hope that he would ever see the end of the Apartheid system in his lifetime. While de Klerk's move to let Mandela out of prison and provide him with a comfortable home enraged many within the Afrikaner community, particularly the SACP who accused de Klerk of bowing down to Communism, de Klerk gained significant goodwill both at home and abroad for this action, though notably not enough to break South Africa's international pariahhood."
 saf_history.6.o1:0 "Interesting."
 
 saf_history.7.t:0 "Windhoek Treaty"
 saf_history.7.d:0 "The Treaty of Windhoek was the treaty that established the Republic of Namibia. The process, which first began in the late 1970s, was delayed significantly by the intensification of the South African Border War. The Turnhalle Constitutional Conference, which sought to establish an independent but still Pretoria-friendly Government in Namibia, was denounced by the United Nations, which viewed the SWAPO as the 'sole legitimate representative' of Namibia's people. The SWAPO, as well as other political groups opposed to Apartheid, refused to attend, rejecting the conference as a sham. In 1978, elections were held in Namibia which led to the election of the Democratic Turnhalle Alliance, the first of their kind to be held under the principles of universal suffrage. The SWAPO chose to boycott the vote, and due to the high turnout, the Turnhalle Alliance claimed that they enjoyed greater popular support. The resulting Government was fully dependent on South Africa, requiring Pretoria's approval for all legislation. Original plans negotiated by the United States and United Kingdom were halted by the victory of Communism, and were further delayed by the escalation of the South African Border War during the 1990s, however despite some predicting that the process would never be completed, de Klerk completed the transition in December 2002, formally signing off on the newly-created Republic of Namibia, which controlled the entirety of Namibia's territory aside from the Walvis Bay Port. This new Namibian Government was a tightly-controlled satellite state that many have accused of being a glorified Bantustan. "
 saf_history.7.o1:0 "Interesting."
 
 saf_history.8.t:0 "South African HIV/AIDS Crisis"
 saf_history.8.d:0 "The HIV/AIDS Crisis ravaged South Africa during the early 21st Century, with its effects still being felt to this day. The height of the Pandemic was during a period lasting from 2003 to 2008. While the first cases came to the Government's attention in the early 1980s, rates would not noticeably spike until the mid 1990s. By the 2000s, over 75,000 were estimated to be infected. The Government has been accused of sometimes deliberate negligence in dealing with the HIV/AIDS Crisis, as it was mostly confined to the nation's Native population. A gag order on mentions of the Crisis was instituted in the early 2000s, only being lifted as HIV vaccine rollouts began in the region, however the effectiveness of this vaccine has been debated. By 2006, the Government began a comprehensive strategy, backed by the international community, to raise awareness and support practices that would reduce transmission of HIV and AIDS, including providing condoms and funding voluntary circumcision. However despite these efforts the Governmental response to the HIV/AIDS crisis has been almost universally regarded as a failure, either out of purposeful or accidental incompetence. Some have even accused AIDS of being developed as a biological weapon to kill the Black Population by Project Coast, accusations which have not been backed by substantiating evidence."
 saf_history.8.o1:0 "Interesting."


